    title: Configuration
    server: Server Configuration Setup
    serverBody: >-
      The default place for the proxy when its started is
      <code>http://localhost:8080</code>, but you can change it if needed in
      <code>./config.json</code>. You can also modify the other configuration
      values at <code>./config.json</code>. Set the port in configuration or
      override it with the PORT environment variable. Other settings are in
      <code>./config.json</code>. Localized changes for source randomization,
      auto-minify, etc. are located in <code>./config.json</code>.
    tor: Tor/Onion Routing Setup
    torGuide: 'Simply host Tor using this guide:'
    torBody: >-
      If you are hosting InvisiProxy LTS on a VPS utilizing Ubuntu consider
      attaching Tor to systemctl for easier production management. Once Tor is
      up and running on either Linux or Windows it will work automatically with
      InvisiProxy LTS when enabled by the user via the Settings menu.
    proxy: Proxy Configuration
    proxyBody: >-
      The primary location for tweaking any web proxy related settings assigned
      via the Settings menu is <code>./views/assets/js/register-sw.js</code>.
      Here you can modify the provided transport options set locally via
      localStorage, swap out SOCKS5 proxies, change Onion routing ports,
      specify a blacklist, and more.
  options:
    option: Option
    description: Description
    getSWRoute: Selects the Scramjet service worker based on adblocking.
    proxyUrl: >-
      Specifies a SOCKS5 protocol URL defaulting to the default Tor proxy port.
    transportUrl: >-
      The selected libcurl or Epoxy module implementing Proxy Transports for use
      with Wisp. Mobile browsers always use Epoxy.
    wispUrl: Modify the pathname or url handling for Wisp.
    getTransportOptions: Configures Wisp and the optional SOCKS5 proxy for Libcurl.
    Controller: >-
      This constructor allows you to swap out the prefix used for Scramjet
      dynamically and specify file locations.
  meta:
    title: InvisiProxy Docs | Self-Hosting, Configuration & Tor Setup
    description: >-
      Self-host InvisiProxy: install it with pnpm, set it up in config.json,
      route traffic through Tor or a SOCKS5 proxy, and see what each dependency
      does.
    social: >-
      Run your own InvisiProxy instance. Covers install, config.json, Tor and
      SOCKS5 routing, and the libraries the project is built on.

