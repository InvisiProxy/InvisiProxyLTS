  free:
    title: InvisiProxy is free.
    body: >-
      Being open source, you can easily fork this repository and self host for
      maximum privacy control. In contrast to numerous other web proxy
      services, InvisiProxy stands out with end-to-end encryption via TLS,
      browser history isolation, Tor/Onion routing in Chromium browsers,
      complete transparency, and privacy control. <strong>Unlike other proxy
      services we collect no user data on our official instances. Not even for
      debugging purposes.</strong><br/>Our open-source dependencies (Wisp,
      Libcurl and Epoxy) are designed to be secure and privacy-focused,
      ensuring that your browsing experience remains confidential even with
      malicious self-hosted instances.

  fast:
    title: InvisiProxy is fast and highly advanced.
    body: >-
      InvisiProxy delivers exceptional web proxy performance. It boasts a
      robust feature set including reCAPTCHA/Botguard support, Tor networking,
      SOCKS5 proxychaining, customizable blacklist settings, leak prevention,
      hidden history settings, and extensive site compatibility support via
      Scramjet + Wisp (Paired with Libcurl Transport). Other popular services
      like CroxyProxy or Proxium often only do half the job of rewriting assets
      leaking requests while being a privacy concern. This project also
      supports features like proxychaining, which allows you to route your
      traffic through multiple proxies for added security and anonymity.

  practical:
    title: InvisiProxy is practical.
    body: >-
      Leveraging our source randomization and projects like Proxy Transports,
      Wisp, and Scramjet, this project delivers a seamless experience that
      circumvents web, government and network filters. This project works
      against filters used in China (GFW - Great Firewall of China), Russia and
      more <strong>without the need of downloading software</strong>. This is
      achieved entirely within your browser as a website and our backend (or
      your own if self-hosting), enabling users to bypass even the most
      invasive censorship blocks. No need to download anything simply type in
      the domain for InvisiProxy, head to the official InvisiProxy site to
      obtain mirrors if blocked and browse anonymously.

  heroSubtitle: Free and transparent for use
  designedWithPrivacy: Designed with privacy<underline/>.

  overview:
    title: Overview
    body: >-
      InvisiProxy LTS, an experimental web proxy service, can bypass web
      filters or 'blockers' regardless of whether the method of censorship is
      client-side or network-based. This includes the ability to bypass content
      blockers overseas put in place by governments (China/GFW, Russia, etc.),
      chrome extensions, localized client firewalls, and network-related
      filters.
    donate: >-
      Please consider donating to this project so we can keep things free! We
      offer more domains per month, beta access, personal domains and priority
      feature requests.<br/>You can donate <patreon>on Patreon here</patreon>.
    patreonLabel: Donate on Patreon
