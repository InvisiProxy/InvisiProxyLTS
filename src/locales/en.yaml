faq:
  meta:
    title: InvisiProxy FAQ | Network Errors, CAPTCHAs & YouTube Fixes
    description: >-
      Network Error, blank pages, CAPTCHA loops, or YouTube not loading? Fixes
      for the most common InvisiProxy problems, and whether it's safe to log in
      to sites.
    social: >-
      Quick fixes for Network Errors, blank pages, CAPTCHA loops and YouTube
      playback, plus answers on Discord support and logging in safely.
  title: Frequently Asked Questions
  search: Search
  searchLabel: Search frequently asked questions
  icons:
    question: How do I obtain Icon URLs for the Tab Cloaking menu?
    bookmarklet: >-
      Go to the website you want an icon from, then use this bookmarklet (drag
      it to your bookmarks bar):
    button: Find Icon URL
    copy: >-
      Copy the URL that the bookmarklet gives you. Then go back to InvisiProxy
      and enter in the URL for the Icon URL in Settings. Enjoy!
  networkError:
    question: >-
      I am getting "Network Error" or Site Error every time I use the proxy?
    answer: >-
      This is a known issue with our modern web proxies. Due to the amount of
      users we get typically after ten minutes of no tab activity the
      connection is cut. Simply hit the Refresh Page button and reload the page
      to resolve the issue.
    note: >-
      This typically happens the first time you use the proxy. We have a future
      fix for this.
  bot:
    question: >-
      I am having problems logging into sites or viewing content since it
      thinks I am a bot.
    answer: >-
      During peak traffic hours this is very common due to everything going
      through only two respective IPs. The solution is to swap regions via
      Region Selection or enable Tor routing. You can also join our Patreon for
      access to a instance with a residential ISP to avoid this issue.
  unreachable:
    question: >-
      I am getting an error similar to: "'cdn.example.com' cannot be reached."
    answer: >-
      Reload the page. If that doesn't work the first time, simply use the
      browser's back button or head back to the Scramjet page and try again.
  blank:
    question: Why is my site loading in partially or just blank?
    answer: >-
      Not all websites are supported. Naturally this is due to the wide
      expanses of the web with different technologies and methods of loading
      content. If you are having issues with a specific site, please report it
      to us on our Discord server or GitHub. Otherwise try filtering through
      our proxy options to see if one of them supports the site.
  idb:
    question: >-
      I am getting an error referencing an IDB Database (Scramjet V1 issue)
    answer: >-
      This typically happens whenever we do updates to our project. Simply
      click on the (i) icon in the top left corner of your browser (or lock
      symbol) and select "Clear Site Data" or "Clear Cookies and Site Data >
      Manage On-Site Data > Trash Icon". This will clear the IndexedDB database
      and allow you to use the proxy again.
  discord:
    question: Is Discord supported?
    answer: Yes, Discord is supported.
    note: >-
      However, there are some limitations with the free proxies. Ensure that
      you don't utilize your main account unless if you are self-hosting or
      using a small domain.
  youtube:
    question: Why are YouTube videos not working?
    answer: >-
      If you are having persistent issues even after doing the steps above
      there is a chance that the instance is down temporarily, especially if
      large groups of people are also having the issue. This issue doesn't
      happen for self-hosting.
    tor: >-
      Try selecting the "Tor" option as this may fix the problem but greatly
      reduce loading speeds.
  login:
    question: Is it safe for me to login to sites?
    answer: >-
      Yes, it is safe to login to sites. However, we recommend that you do not
      login into sites you do not trust or use personal accounts due to the
      number of traffic being routed into a single domain. We try to mitigate
      this problem by rotating IPs however it is just a common practice to not
      use personal accounts on public proxies. Self-hosting however you can do
      so with ease. You can also join the patreon to utilize a residential ISP
      and avoid this issue.
  captcha:
    question: >-
      Why is the site I am on not working correctly or having CAPTCHA errors?
    answer: >-
      Captcha support works with Scramjet but it will take trial and error. The
      reason for this is Scramjet is often simply too fast and naturally
      CAPTCHA is very spotty. The solution is just keep trying to solve the
      CAPTCHA until it works. Try not to go too fast.
  youtubeBlank:
    question: >-
      When using YouTube on any of the proxy sites, why does the page not load
      fully or the video is just white?
    answer: 'There are two methods for fixing this:'
    reload: >-
      Reloading the page normally when the error above happens should load the
      video.
    reloadFrame: >-
      Or right-clicking the page and doing <code>Reload Frame</code> if you are
      using some form of Stealth Mode.

privacy:
  title: Privacy Policy
  subtitle: InvisiProxy, a private web proxy service.
  effective: 'Effective Date: 07-16-2021'
  updated: 'Updated Date: 05-10-2026'
  what:
    title: What is InvisiProxy?
    body: >-
      InvisiProxy LTS is a web proxy service that helps you access websites
      that may be blocked by your network, government or policy all within
      your browser with no download or setup. It does this securely and with
      additional privacy features. Browse Tor/Onion sites in any browser, hide
      browsing activity and bypass filters. This includes the potential ability
      to bypass content blockers from governments, chrome extensions, localized
      client firewalls, and network-related filters.<br/>This project serves
      mostly as a proof of concept for the ideal clientless solution to
      bypassing censorship.
  data:
    title: Is any data being collected?
    body: >-
      Nope! No data is logged or collected by any of our web proxies featured.
      Logging is disabled to ensure user privacy on the backend. NextDNS
      queries are adjusted to not log client IPs or domains and store in
      Switzerland. NextDNS log retention for respective numerical values is
      minimal and focused on ensuring the service operates smoothly. Cloudflare
      is utilized for this project to improve performance and have easier DNS
      management due to the scope of this project. At a minimum Cloudflare
      numerical values are utilized for tracking visits and page views
      indicating when server upgrades are needed. NGINX is set to store no
      logs. InvisiProxy LTS values its statement of ending internet censorship
      along with valuing user privacy. Outside of this the Wisp protocol (to
      proxy TCP connections) is used with libcurl-transport for end-to-end
      encryption by running SSL/TLS inside webassembly. This service is made to
      be as transparent as possible and remember you can self-host at any time
      to ensure you are in control over everything.<br/><br/>If you wish to
      make a privacy statement or request please contact us via Discord.
  security:
    title: Security
    body: >-
      InvisiProxy LTS is built from the ground up to ensure a secure and
      reliable web proxy service for its users. One of the core technologies
      behind InvisiProxy LTS is the new Wisp protocol, developed by Mercury
      Workshop.<br/><br/>This protocol brings several innovative features and
      enhancements that contribute to the speed and security of the service
      over previous models.
    intro: >-
      The Wisp protocol is designed to handle modern web traffic demands while
      maintaining high security standards. By implementing Wisp, this project
      leverages the following benefits:
    performance: >-
      Performance: The Wisp protocol optimizes TCP data transfer speeds,
      ensuring that users experience minimal latency while browsing.
    compatibility: >-
      Compatibility: Wisp is built to be compatible with a wide range of web
      technologies, ensuring seamless access to various websites and online
      services. This is done through the support of various open-source
      transports following the protocol (Libcurl Transport).
    censorship: >-
      Resilience Against Censorship: The protocol is designed to bypass
      sophisticated censorship techniques employed by restrictive networks,
      allowing users to access blocked content with ease.
    fingerprinting: >-
      Fingerprint Resistance: This project has strong fingerprint resistance
      mechanisms within its reverse proxy setup for official instances. This
      means that the proxy is designed to minimize the unique identifiers that
      can be used to track or identify users, thereby enhancing privacy. By
      following industry best practices and continually updating its methods,
      users can browse anonymously without leaving identifiable traces.
    transparency: >-
      Transparency: Transparency is a key principle for InvisiProxy LTS. The
      project operates with an open-source model, allowing the community to
      review and contribute to the codebase. This openness not only fosters
      trust but also enables continuous improvement through community feedback
      and collaboration. By adhering to transparent practices, InvisiProxy LTS
      ensures that users are aware of how their data is handled and what
      measures are in place to protect their privacy.
    randomisation: >-
      Source/Global Randomisation: In order to further enhance security and
      privacy, InvisiProxy LTS employs source and global randomisation. This
      allows the project to remain unblocked longer on domains and also improve
      anonymity while browsing. Typical web proxies will leave traces whenever
      rewriting assets, but with this method, it is much harder to detect the
      proxy and block it.
    encryption: >-
      Encryption: InvisiProxy LTS utilizes advanced proxy technologies that
      focus on end-to-end encryption and secure data transfer, particularly in
      the context of URL rewriting proxies. NOTE: This is still a massive work
      in progress and open to contributions.
    audits: >-
      Regular Audits: Conducting regular security audits to identify and
      address potential vulnerabilities.
  usage:
    title: Additional Usage
    storage: >-
      InvisiProxy uses "Cookies", IndexedDB, localStorage, and sessionStorage
      to maintain a user session (described more below) and store your
      preferences on your computer. All of this information is completely
      private being only local content with ZERO analytical purposes.
    cookies: >-
      A cookie is a string of information that a website stores on a visitor's
      computer, and that the visitor's browser provides to the website each
      time the visitor returns. InvisiProxy uses cookies to help ensure
      usability with the Settings menu, and lastly for user preferences. Users
      who do not wish to have cookies placed on their computers should set
      their browsers to refuse cookies before using InvisiProxy's websites,
      with the drawback that certain features of InvisiProxy WILL not function
      properly without the aid of cookies, localStorage or IndexedDB. No
      cookies, IndexedDB, localStorage, or sessionStorage features are stored
      for analytical purposes only functions (Scramjet (Caching proxied assets,
      session state, etc.), Autocomplete (Proxied), Setting Menu: Tab Cloak,
      Icon Presets, Transport Options, Search Engines, Theming, Sandboxing, Tor
      Routing, Hide Ads, Hidden History, and Region Swapping) rely on it for
      storing persistent data locally.
    serviceWorkers: >-
      In addition, InvisiProxy uses Service Workers as a technology for our
      web proxies. This enables the ability to intercept respective network
      traffic, etc. and is a core function for the project.
    consent: >-
      By continuing to navigate our website without changing your cookie
      settings, you hereby acknowledge and agree to InvisiProxy's use of
      cookies.
  changes:
    title: Ending Note
    body: >-
      Although most changes are likely to be minor, InvisiProxy may change its
      Privacy Policy from time to time, and in InvisiProxy LTS's sole
      discretion. InvisiProxy LTS encourages visitors to frequently check this
      page for any changes to its Privacy Policy. Your continued use of this
      site after any change in this Privacy Policy will constitute your
      acceptance of such change. In the case of any abuse or DDOS attacks,
      InvisiProxy LTS may be forced to temporarily log data to mitigate the
      attack and ensure the service remains operational. In such cases, any
      logged data will be securely deleted immediately after the attack is
      mitigated.
  contact:
    title: Contact Information & Credit
    body: >-
      If you have any questions about our Privacy Policy, please contact us via
      email at

