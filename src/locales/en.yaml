#      It appears in the Language dropdown in Settings automatically.
#   3. Translate the text. Keep {placeholders} and <tags> as they are and only
#      translate the words between tags. Keys can be removed to keep English.
#   4. Run `pnpm test:unit` to check the file against this one.

