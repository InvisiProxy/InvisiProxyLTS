home:
  title: InvisiProxy LTS | 免費網頁代理 - 繞過過濾並訪問被封鎖的網站
  description: >-
    InvisiProxy LTS 是一款前沿的網頁代理服務，專為繞過網頁過濾器和攔截器而設計。無論是客戶端還是基於網路的審查，InvisiProxy LTS 都能讓你在 Chromebook 等裝置上無縫訪問被封鎖的網站，並進行安全、私密的瀏覽。藉助我們先進的代理方案，輕鬆突破內容攔截器、Chrome 擴充套件、防火牆等限制。
  ogDescription: >-
    InvisiProxy LTS 是一款頂級網頁代理服務，可繞過網路和瀏覽器限制，安全訪問被封鎖的網站。享受安全可靠、功能先進的無縫瀏覽體驗。
  twitterDescription: >-
    瞭解 InvisiProxy LTS——一款出色的網頁代理服務，可繞過審查和過濾，安全訪問被封鎖的網站。非常適合私密瀏覽，以及在 Chromebook 等裝置上突破網路限制。

  headline: 終結網路審查。
  tagline: 隱私，觸手可及。
  browseNow: 立即瀏覽
  bypassNow: 立即繞過
  donate: 捐贈
  logoAlt: InvisiProxy 主視覺標誌
  terminal:
    setup: 在生產分支上首次部署時……
    start: 或日常使用……
    dev: 用於開發……

  free:
    title: InvisiProxy 是免費的。
    body: >-
      作為開源專案，你可以輕鬆 fork 本儲存庫並自行託管，以獲得最大的隱私控制權。與眾多其他網頁代理服務不同，InvisiProxy 擁有基於 TLS 的端到端加密、瀏覽歷史隔離、在 Chromium 瀏覽器中的 Tor/Onion 路由、完全透明以及隱私控制。<strong>與其他代理服務不同，我們的官方實例不收集任何使用者資料，即使是出於除錯目的也不會。</strong><br/>我們使用的開源依賴（Wisp、Libcurl 和 Epoxy）以安全和隱私為核心設計，即使面對惡意的自託管實例，也能確保你的瀏覽內容保持機密。

  fast:
    title: InvisiProxy 快速且高度先進。
    body: >-
      InvisiProxy 提供卓越的網頁代理效能。它擁有強大的功能集，包括 reCAPTCHA/Botguard 支援、Tor 網路、SOCKS5 代理鏈、可自訂的黑名單設定、防洩漏、隱藏歷史記錄設定，以及透過 Scramjet + Wisp（搭配 Libcurl Transport）實現的廣泛網站相容性。CroxyProxy 或 Proxium 等其他熱門服務往往只完成了一半的資源重寫工作，會洩漏請求，還存在隱私隱患。本專案還支援代理鏈等功能，讓你的流量經過多個代理轉發，進一步提升安全性和匿名性。

  practical:
    title: InvisiProxy 很實用。
    body: >-
      藉助我們的原始碼隨機化，以及 Proxy Transports、Wisp 和 Scramjet 等專案，本專案可提供無縫體驗，繞過網頁、政府和網路層面的過濾。本專案可對抗中國（GFW——防火長城）、俄羅斯等地使用的過濾器，<strong>無需下載任何軟體</strong>。這一切完全透過瀏覽器中的網站和我們的後端（自託管時則是你自己的後端）實現，讓使用者即使面對最嚴厲的審查封鎖也能繞過。無需下載任何東西，只需輸入 InvisiProxy 的域名即可；若被封鎖，可前往 InvisiProxy 官方網站獲取鏡像，然後匿名瀏覽。

  heroSubtitle: 免費且透明，放心使用
  designedWithPrivacy: 以隱私為核心設計<underline/>。

  overview:
    title: 概述
    body: >-
      InvisiProxy LTS 是一項實驗性的網頁代理服務，無論審查方式是客戶端還是基於網路，都可以繞過網頁過濾器或"攔截器"。這包括繞過各國政府設定的內容封鎖（中國/GFW、俄羅斯等）、Chrome 擴充套件、本地客戶端防火牆以及與網路相關的過濾器。
    donate: >-
      請考慮為本專案捐贈，幫助我們保持免費！我們為支持者提供每月更多域名、Beta 測試資格、個人專屬域名以及功能請求優先處理。<br/>你可以<patreon>在 Patreon 上捐贈</patreon>。
    patreonLabel: 在 Patreon 上捐贈
    imageAlt: 伺服器圖示

  intent:
    title: 宗旨
    body: >-
      本專案主要作為繞過審查的理想無客戶端方案的概念驗證。作為安全的網頁代理服務，它支援大量網站，同時頻繁更新，並注重設計、機制和功能上的細節。
    palette: >-
      本專案的配色方案基於 <nord>Nord Theme</nord> 構建，因其出色的設計配色，以及對程式碼語法和 UI 元件可讀性的重視。
    imageAlt: 程式碼檔案圖示

  usage:
    title: 使用方法
    body: >-
      前往<browse>瀏覽</browse>頁面，選擇其中一個代理！然後在搜尋框中輸入你想訪問的網站。每個網頁代理在有效性、速度和安全性方面各有不同。推薦使用 Scramjet。<br/><br/>可解鎖的網站示例：<code>https://youtube.com</code>
    imageAlt: 盾牌圖示

  apps:
    title: 應用
    body: >-
      InvisiProxy 提供一系列預先連結好的應用，包括 YouTube、Spotify、GeForce NOW、Discord、ChatGPT、Gemini 等！
    imageAlt: 應用圖示

  hosting:
    title: 託管與部署
    body: >-
      <strong>InvisiProxy LTS</strong> 是一個開源方案，在設計時就考慮了模組化、易用性和便捷部署。主要功能包括廣告攔截、靈活的原始碼生成以及先進的代理導航。<br/><br/>如需完整的部署說明，請訪問我們的官方 <github>GitHub 儲存庫</github>或<docs>此處提供的內建文件</docs>。
    docsTitle: 更多託管資訊
    imageAlt: 託管與部署圖示
    imageTitle: InvisiProxy LTS 的託管與部署

  contributing:
    title: 參與貢獻
    body: >-
      <strong>InvisiProxy LTS</strong> 的蓬勃發展離不開眾多優秀貢獻者的傾力付出。作為開源專案，<strong>InvisiProxy LTS</strong> 依靠社群的熱情來突破網路審查，幫助使用者更好地獲取資訊。
    start: 想要開始貢獻，請訪問我們的 <github>GitHub 儲存庫。</github>
    imageAlt: GitHub 貢獻圖示
    imageTitle: 在 GitHub 上為 InvisiProxy LTS 做貢獻

  githubTitle: InvisiProxy LTS GitHub 儲存庫

  bypass:
    title: 繞過審查與過濾
    body: >-
      InvisiProxy LTS 是一個開源的<strong>網頁代理專案</strong>。藉助我們先進的<strong>網頁代理解鎖</strong>功能，暢享不受限制的線上內容訪問與瀏覽。本專案還讓你能夠在任何地方自行託管，並繞過像中國（防火長城——GFW）和俄羅斯這樣的全國性或地區性封鎖。

  freeProxy:
    title: 100% 免費網頁代理
    body: >-
      使用我們的<strong>免費網頁代理服務</strong>，幫助你<strong>解鎖網站</strong>並訪問受限內容。非常適合繞過學校和/或工作場所的過濾，本專案就是為了解鎖一切而生。

  tor:
    title: 在 Chromium 瀏覽器和 Firefox 中使用 Tor 路由
    body: >-
      使用 InvisiProxy LTS，你可以直接在基於 Chromium 或 Firefox 的瀏覽器中<strong>訪問 Tor 網路</strong>。這意味著你可以直接在本網站內訪問 <strong>.onion</strong> 網站。這讓你能夠匿名瀏覽網頁（至少在一定程度上；真正的 Tor 有更好的指紋防護），並繞過任何地區限制。本專案還支援設定自訂 SOCKS5 代理以組成代理鏈。

