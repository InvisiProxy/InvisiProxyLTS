    start: 如果你想啟動專案
    test: 用於測試端點和錯誤
    prSet: prSet 函式程式碼在此……
  ubuntu:
    title: 詳細部署（以 Ubuntu 為例）
    intro: >-
      你需要安裝 <code>Node.js 26.x</code>、<code>curl</code> 和 <code>git</code>；以下是 Debian/Ubuntu 的部署示例。
    summary: 分步指南
    mirrors: >-
      簡單起見，你可以透過 discord.gg/unblock 加入 TN 的 Discord，申請鏡像網站連結（這些連結會定期補充且未被封鎖）。
    hosting: 託管
    hostingBody: >-
      不過，如果你想自託管，首先需要一臺 VPS 或一個託管服務商：
    dependencies: 依賴
    dependenciesBody: >-
      然後你需要安裝 git、musl、nginx（或 caddy）和 Node.js。以下是 Ubuntu LTS 的示例：
    tor: Tor 支援（可選）
    configure: 配置 InvisiProxy
    configureBody: >-
      最重要的選項是 production，以及混淆和 DOM 偽裝技術。
    configureMore: '之後按需配置即可：'
    run: 克隆並執行 InvisiProxy
    runBody: >-
      然後執行相應的程序；如果你在配置中將 production 設為 true，pm2 將與我們自己的 worker/快取系統一起自動啟用。
    restart: 當然，如果你使用了 NGINX 或 caddy，請重啟/重新載入它
  config:
    title: 配置
    server: 伺服器配置設定
    port: >-
      代理啟動時的預設埠為 <code>http://localhost:8080</code>。如有需要，你可以在 <code>./ecosystem.config.js</code> 中更改埠和其他生產環境引數。
    local: >-
      其他所有本地化更改，如原始碼隨機化、自動壓縮等，都位於 <code>./config.json</code> 中。
    options:
      minifyScripts: >-
        在啟動伺服器時自動壓縮相應的靜態資源。
      randomizeIdentifiers: >-
        為 Ultraviolet 啟用實驗性的代理全域性變數隨機化。這可以降低 UV 被基於擴充套件的過濾器檢測到的機率。
      production: >-
        使用預先配置好的生產環境方案進行伺服器託管。自動設定快取控制和原始碼重寫。
      disguiseFiles: >-
        啟用 DOM 偽裝，混淆 InvisiLTS 真實的內容獲取過程。具體做法是偽裝請求、解壓，然後重建 DOM 樹。
      usingSEO: >-
        啟用原始碼隨機化，透過替換 <code>./src/data.json</code> 中指定的資料塊來隨機化原始碼。對於掩蓋會自動標記或封鎖 InvisiProxy LTS 的關鍵詞以及防止原始碼封鎖非常有用。
      verbose: >-
        啟用編譯和構建訊息，以便在編譯時檢視進度和可能出現的問題。
      mirrorLinksFile: >-
        連結頁面分發器使用的僅限伺服器端的檔案，預設為 <code>private/mirror-links.txt</code>。相對路徑以專案根目錄為基準解析，也支援絕對路徑。每行一個 HTTP(S) URL，並將該檔案放在 <code>views/</code> 之外，以免被公開訪問。更改此設定後請重啟伺服器。
      geoLanguage: >-
        使用 Cloudflare 的 <code>CF-IPCountry</code> 請求頭啟用自動語言選擇。僅在 Cloudflare 之後啟用此功能，否則任何人都可以偽造該請求頭。各語言對應的國家列在每個 <code>./locales/*.yaml</code> 檔案的 <code>language.countries</code> 下。
      singleLanguage: >-
        設為 <code>true</code> 時，只構建 <code>language</code> 中設定的語言，所有訪問者都會看到該語言，並隱藏語言設定。適用於 Docker 或其他只需要一種語言的部署，因為構建更快、體積更小。預設為 <code>false</code>。
      language: >-
        當 <code>singleLanguage</code> 開啟時要構建的語言，對應 <code>./locales/</code> 中的一個檔案（例如 <code>en</code> 對應 <code>en.yaml</code>）。預設為 <code>en</code>。對於 Docker，由於語言是在構建時選定的，請在執行 <code>docker build</code> 或 <code>docker compose build</code> 之前在 <code>config.json</code> 中設定。
  translations:
    title: 翻譯
    crowdin: >-
      InvisiProxy LTS 在 <crowdin>Crowdin</crowdin> 上進行翻譯，任何人都可以參與，無需接觸程式碼。加入專案，選擇一種語言即可開始翻譯。完成的翻譯會自動同步到 <code>./locales/</code>。
    rules: >-
      翻譯規則（佔位符、標籤和遮蔽詞）請參閱 <readme/>。如果 Crowdin 上沒有你的語言，請提交 issue 或在 Discord 中詢問。
  tor:
    title: Tor/Onion/SOCKS5 路由設定
    intro: >-
      你需要安裝 Tor 才能讓洋蔥路由設定生效（無需圖形介面，有圖形介面也可以。使用圖形介面時請將埠 9050 替換為 9150）！
    guide: '按照這份指南託管 Tor 即可：'
    cliGuide: '備選指南（命令列）：'
    body: >-
      如果你在使用 Ubuntu 的 VPS 上託管 InvisiProxy LTS，可以考慮將 Tor 掛載到 systemctl，便於生產環境管理。一旦 Tor 在 Linux 或 Windows 上執行起來，當使用者在設定選單中啟用後，它就會自動與 InvisiProxy LTS 配合使用。
    customWisp: 使用者也可以在代理偏好設定中設定自己的 Wisp 伺服器。
    customProxy: >-
      如果你想使用自訂的 HTTP/HTTPS/SOCKS5 代理來轉發 Scramjet 的流量，這是在伺服器端的 <code>./src/server/wisp.ts</code> 中處理的。
  proxy:
    title: 代理配置
    body: >-
      調整透過設定選單分配的網頁代理相關設定的主要位置是 <code>./views/assets/js/register-sw.js</code>。在這裡，你可以修改透過 Cookie 在本地設定的傳輸方式選項、替換 SOCKS5 代理、更改洋蔥路由埠、指定黑名單等。
    options:
      stockSW: >-
        Ultraviolet 的預設 Service Worker 配置檔案。不過 InvisiProxy 會自動啟用廣告攔截，因此預設不使用此檔案。
      blacklistSW: >-
        Ultraviolet 的修改版本，支援域名黑名單和廣告攔截。
      proxyUrl: >-
        指定一個 SOCKS5/HTTPS/HTTP 協定的 URL，預設為 Tor 的預設代理埠。可以替換為任何有效的埠或 SOCKS5 代理。這是透過 epoxy 和 libcurl 的 proxy 選項實現的。
      transports: >-
        指定透過 Bare-Mux 切換並使用 Wisp 的埠。
      wispUrl: 修改 Wisp 的路徑名或 URL 處理方式
      defaultMode: >-
        指定全域性使用的預設傳輸方式（使用者仍可透過設定選單切換）
      ScramjetController: >-
        透過這個建構函式，你可以動態替換 Scramjet 使用的字首並指定檔案位置。注意，更改檔名時可能需要編輯 <code>./views/scram/scramjet.sw</code>。
  navigation:
    title: 客戶端導航配置
    body: >-
      客戶端導航指令碼的主要位置是 <code>./views/assets/js/common.js</code>。該檔案主要用於位址列（搜尋引擎）功能、切換代理選項以及其他客戶端設定。
    options:
      getDomain: >-
        該常量用於指定在將 URL 新增到位址列時需要移除的子域名。
      goFrame: 指定 InvisiProxy LTS 使用的隱身框架
      sx: >-
        該常量指定當使用者輸入的內容不是 URL 時要經代理使用的搜尋引擎
      search: 這些函式用於指定和解析所提交 URL 的查詢
      urlHandler: 用於為 goProx 物件設定函式。
      goProx: >-
        該常量用於對映特定代理或需要經過網頁代理的連結的 URL 處理方式。
      prSet: 使用 goProx 為所需的按鈕或輸入框繫結事件監聽器
      huLinks: >-
        自動讀取 <code>./views/assets/json</code> 中宣告的路徑，並根據頁面和用途進行新增。用於隱藏會觸發過濾封鎖的連結，並讓新增應用變得更簡單。
  structure:
    title: 結構
    summary: 網頁
    info: 結構說明
    root:
      views: >-
        InvisiProxy 的網站主體放在這裡，靜態資源由此提供。
      src: 用於將來實現混淆和關鍵詞移除功能。
    views: <code>/views/</code> 的詳細說明
    folders:
      dist: 用於存放壓縮後的檔案。構建時生成。
      pages: 用於存放網站的 HTML。
      assets: 用於存放各種 CSS、JS、圖片和 JSON 檔案。
      scram: >-
        包含本地的 Scramjet 實現。部分檔案會被 node 模組覆蓋。
      uv: 包含 UV 的實現。
    scripts: 位於 <code>/views/assets/js/</code> 的指令碼
    files:
      card: 為歡迎頁面上顯示的卡片新增炫酷的視覺效果。
      common: >-
        在所有頁面上使用，讓自動補全等大多數網站功能得以執行。
      csel: >-
        管理設定選單、位址列功能以及其他附加功能。
      loader: 用作 DOM 偽裝的資源。
      registerSw: >-
        建立並管理讓 Ultraviolet 執行的 Service Worker，同時使用 bare transport。
  future:
    title: 未來計劃
    body: <todo>這裡</todo>是 InvisiProxy LTS 的待辦事項清單（並不詳盡）。
  beginners:
    title: 面向新手的外部代理與託管簡要說明
    intro: 首先，你需要在本地或外部託管你的代理。
    hosting: '一些不錯的託管選擇：'
    current: 當前託管服務商
    paid: 付費
    freePaidDedicated: 免費、付費、獨立伺服器
    freeAndPaid: 免費和付費
    preference: >-
      在這些託管服務商中，Dedipath 和 Azure 是首選。你也可以自行託管。
    cloudflare: >-
      選好一臺不錯的 VPS 後，使用 Cloudflare 為網站和代理子域名配置 DNS 記錄。
    dns: >-
      這是一個 DNS 記錄示例。自託管時最好使用 <code>A 記錄</code>。
    dnsAlt: DNS 記錄
    root: >-
      <code>@</code> 和 <code>www.example.com</code> 用於 InvisiProxy LTS。
    subdomain: >-
      <code>a.example.com</code> 根據網站維護者的需要，用於 Libreddit 或 Invidious 等其他實例。
    local: >-
      如前所述，InvisiProxy 開箱即用地在本地託管 Scramjet 和 Ultraviolet，無需外部實例。
  domain:
    title: 域名步驟
    porkbun: >-
      如果你想獲取高階域名（TLD），推薦使用 <porkbun>Porkbun</porkbun>，它的域名價格非常實惠。一個 <code>.org</code> 域名首年通常只要 5 美元左右。
  cloudflare:
    title: Cloudflare 步驟
    account: >-
      使用 Cloudflare（註冊一個賬號），新增你的網站，然後將各個 DNS 目標新增到 Cloudflare。請務必新增 Cloudflare 的域名伺服器（Nameservers），這會在你新增網站時提供給你。
    records: >-
      請確保它們是 CNAME 記錄（A 記錄也可以），並儘量遵循以下結構：
    columns: 類型 | 名稱 | 目標
    ip: 在此填寫 VPS IP
    ssl: >-
      請確保強制使用 HTTPS，並將 SSL 設定為 Flexible（如果你不使用 LetsEncrypt）。否則可以將 SSL 設定為 Full。
  workspace:
    title: 工作區配置
    vsc: >-
      如果你有自己的裝置，推薦使用 <vsc>Visual Studio Code</vsc>。這幾乎是你能找到的最佳選擇，當然這只是個人觀點。另外，請確保你的電腦上安裝了 <node>Node.JS</node>。
    fork: >-
      這部分不會講得太深入，首先 fork 本儲存庫。然後根據你使用的作業系統，透過某種終端將其克隆到本地。請確保你已進入要進行設定的資料夾。
    gitignore: >-
      現在只需在 VSC 中新增你克隆儲存庫的資料夾。然後執行 <code>pnpm install</code>。如果你要在 GitHub 上公開發布，建議在根目錄中新增一個 <code>.gitignore</code>，包含以下排除項：
    deploy: >-
      現在你的工作區環境已經設定好了。要部署你剛建立的工作區，需要根據你的託管服務商查閱相應方法。
    gitpod: >-
      如果需要一個能在學校電腦和/或 Chromebook 上使用的線上 IDE，可以使用 GitPod。它基本上就是支援在瀏覽器中使用的 Visual Studio Code。
    gitpodAccount: '註冊賬號：'
    gitpodFork: 'fork 本儲存庫，並輸入以下 URL 來設定你的工作區：'
    gitpodSteps: >-
      按照上面相同的步驟，在你的儲存庫中執行 <code>pnpm install</code>，並在根目錄中新增一個排除 <code>node_modules</code> 的 <code>.gitignore</code>。
  faq:
    title: 詳細常見問題
    summary: 快速常見問題
    games: 在哪裡可以找到這個儲存庫的遊戲？（404 錯誤等）
    gamesBody: 請閱讀<games>這裡</games>。
    captcha: >-
      為什麼我所在的網站無法正常工作或出現驗證碼錯誤？
    captchaBody: >-
      遺憾的是，目前所有代理對驗證碼的支援都不太穩定，主要由 Scramjet 支援。因此，有些網站可能在任何代理上都無法使用。
    badGateway: 我遇到了 502 錯誤，該怎麼辦？
    badGatewayBody: >-
      出現這種情況時，你可以切換網站來解決錯誤，或者稍等片刻。有時清除快取也會有幫助。
    questions: >-
      如果你還有任何問題，歡迎在此處連結的 Discord 中提問。
    domains: >-
      為什麼官方域名現在帶有編號？這個專案又開始維護了嗎？
    domainsBody: >-
      是的，本專案為了 LTS 支援再次活躍起來了！不過，為了確保功能正常，現在的方法簡單多了：按需補充域名，並對原始碼進行高度維護。本專案比以往任何時候都更像是一個概念驗證，獻給那些敢於在網頁代理服務領域創新的勇者。
  closing:
    summary: 以前的停運公告（原文 - 2022 年）
    announcement: >-
      抱歉，這不是什麼好訊息。經過反覆思考和極度猶豫，我決定關閉 Holy Unblocker 並離開 TN。這件事讓我糾結了好幾個月，所以才會一直沒有更新，去年也出現了很長的空檔期。我只是不想放棄一個我熱愛、投入了大量時間，並在這裡結識了很棒的朋友和厲害的開發者的專案。我可以一直說下去這些人是誰，但就到此為止吧。他們自己知道是誰 :D
    reasons: >-
      想法轉變的主要原因是，我終於決定現在就畫上句號，因為：1）缺乏動力 2）社群有時並不是最好的，有時也不怎麼友善（這點必須說出來） 3）HU/TN 作為專案的前景看起來並不樂觀。
    secrets: >-
      這個決定還有其他原因，所以有些事情我會保密，除非有人覺得這些資訊還不夠。好朋友們都知道，這幾個月來我一直為這個決定倍感壓力。另外，我快畢業了，這也是促使我做出這個決定的一大原因。
    future: >-
      將來我可能會繼續/迴歸，或者只把它保留在 GitHub 上。我寫下這些，是因為即使到現在我仍然在懷疑這個決定。但目前我建議去看看其他代理網站，比如 Incognito（Duce 更新非常頻繁，他也是 Ultraviolet 的作者/開發者，所以多支援他吧） :yayy_hopi:
    patreon: >-
      也去看看他的 Patreon 吧！現有的 HU 贊助者下個月將不會被扣費，HU 的 Patreon 將會歸檔，所以請轉到 Duce 的 Patreon，讓他能為 Incognito 購買更多域名。
    signoff: 滿懷愛意 <3
  more:
    title: 更多資訊
    maintained: >-
      本專案由 InvisiProxy LTS 團隊維護，是 TitaniumNetwork 官方旗艦網頁代理網站。
    website: 檢視官方網站了解更多詳情和致謝。
    sources: '網頁代理來源：'
    sourcesBody: >-
      本專案目前使用遵循 Wisp 協定的 Scramjet 和 Ultraviolet 作為網頁代理。Bare-Mux 用於切換配合 Wisp 使用的傳輸系統。內建的傳輸系統有 EpoxyTransport 和 libcurl-transport。
    wispProtocol: Wisp 協定
    merp: Merp（混淆模組）
    dnsBlocklists: hagezi DNS 遮蔽列表
    dependencies: '其他依賴：'
    mentions: '特別提及：'
    hostingProvider: 託管服務商
  meta:
    title: InvisiProxy 文件 | 自託管、配置與 Tor 設定
    description: >-
      自託管 InvisiProxy：使用 pnpm 安裝，在 config.json 中配置，透過 Tor 或 SOCKS5 代理轉發流量，並瞭解每個依賴的作用。
    social: >-
      執行你自己的 InvisiProxy 實例。涵蓋安裝、config.json、Tor 和 SOCKS5 路由，以及本專案所基於的庫。

