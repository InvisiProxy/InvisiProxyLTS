  setup:
    title: 如何部署
    branchWarning: >-
      強烈建議你透過 IDE 切換到已釋出的生產分支。master 分支通常包含不穩定或開發中的更改。
    branchExample: '示例：使用 v6.x_production 而不是 master'
    terminal: 終端
    terminalIntro: >-
      可以使用上方的按鈕部署到上述平臺，也可以在專用伺服器上輸入以下命令
    nginxOnly: 本專案專為支援 NGINX 而設計，而非 CADDY。
    requirements: >-
      請同時確保你使用的是 <code>Node 26.x</code>。<code>git</code> 和 <code>curl</code> 是必需的依賴：
    builtIn: >-
      本網站在本地託管，內建了 <scramjet>Scramjet</scramjet>、<wisp>Wisp</wisp>、<merp>Merp 混淆</merp>、<epoxy>EpoxyTransport</epoxy> 和 <libcurl>LibcurlTransport</libcurl>。
    caddyWarning: >-
      出於安全考慮，使用反向代理託管時請務必使用 NGINX，而不是 Caddy。這是因為 wispurr 使用了迴環地址。如果使用 Caddy，請禁用此功能或調整 Caddy 的預設配置。
    resources: '自託管資源：'
  commands:
    pm2Config: >-
      如果你想使用 pm2，請編輯 config.js 並將 production 設定為 true（便於在 VPS 上託管）
    pm2: 使用 pm2 守護程序
    restart: 或在之後的使用中……
