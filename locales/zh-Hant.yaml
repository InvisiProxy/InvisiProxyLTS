  meta:
    title: InvisiProxy 常見問題 | 網路錯誤、驗證碼和 YouTube 修復
    description: >-
      遇到網路錯誤、空白頁面、驗證碼迴圈或 YouTube 無法載入？這裡有 InvisiProxy 最常見問題的解決方法，以及登入網站是否安全的說明。
    social: >-
      網路錯誤、空白頁面、驗證碼迴圈和 YouTube 播放問題的快速修復，以及關於 Discord 支援和安全登入的解答。
  title: 常見問題
  search: 搜尋
  searchLabel: 搜尋常見問題
  icons:
    question: 如何獲取標籤頁偽裝選單所需的圖示 URL？
    bookmarklet: >-
      前往你想獲取圖示的網站，然後使用這個書籤小工具（將其拖到書籤欄）：
