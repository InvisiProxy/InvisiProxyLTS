proxySettings:
  donate: >-
    プレミアムドメイン、ベータ機能、住宅用ISP回線、より高速な通信を提供しています。<patreon>Patreon</patreon>で寄付できます。<br/>サービスをうまく利用できない場合は、Torまたはリージョンルーティングを有効にしてください。プロキシに問題がある場合は<faq>FAQ</faq>ページをご覧ください。
  title: プロキシの設定
  connection: 接続
  searchNavFix: サイト修正を有効にする
  searchNavFixDescription: >-
    The Freedom Projectが作成したプラグインを使用して、ブラウジング中の「undefined」などのエラーを修正します。任意。
  experimentalSiteFixes: 実験的なサイト修正
  experimentalSiteFixesDescription: >-
    手動によるサイト対応修正の詰め合わせです。サイトが動作しなくなったり、実際のIPが漏洩したりする可能性があります。自己責任でご利用ください。
  hideHistoryDescription: ローカルの閲覧履歴を隠します。ネットワーク側から履歴を盗み見られる可能性はありますが、プロキシ経由になります。
  randomizeFingerprint: ブラウザフィンガープリントをランダム化
  randomizeFingerprintDescription: >-
    タブのセッションごとにランダムなデスクトップブラウザを使用し、Canvas、WebGL、CPU、メモリの読み取り値にノイズを加えます。選択したユーザーエージェントが優先されます。一部のサイトが動作しなくなる場合があります。
  customWisp: カスタムWispサーバー
  customWispDescription: >-
    プライバシーをより細かく管理するため、プロキシの通信を自分のWispサーバー経由にします。すべての通信をセルフホスト経由にしたい場合の軽量な方法です。フロントエンドはここのものを使い、通信は自分のサーバーに送られます。オフにするには空欄のままにしてください。
  invalidWisp: ws:// または wss:// のアドレスを入力してください。
  moreSettings: その他の設定を表示
  anotherLink: 別のリンクが必要ですか？<mirrors>ミラーリンクボタン</mirrors>をクリックしてください。

faq:
  meta:
    title: InvisiProxy FAQ | ネットワークエラー、CAPTCHA、YouTubeの修正方法
    description: >-
      ネットワークエラー、真っ白なページ、CAPTCHAのループ、YouTubeが読み込まれない？InvisiProxyでよくある問題の解決方法と、サイトへのログインが安全かどうかについて。
    social: >-
      ネットワークエラー、真っ白なページ、CAPTCHAのループ、YouTube再生の簡単な解決方法に加え、Discordへの対応や安全なログインについての回答。
  title: よくある質問
  search: 検索
  searchLabel: よくある質問を検索
  icons:
    question: タブ隠蔽メニュー用のアイコンURLはどうやって入手しますか？
    bookmarklet: >-
      アイコンを取得したいWebサイトにアクセスし、このブックマークレットを使用してください（ブックマークバーにドラッグします）：
    button: アイコンURLを取得
    copy: >-
      ブックマークレットが表示したURLをコピーしてください。InvisiProxyに戻り、設定のアイコンURLにそのURLを入力してください。お楽しみください！
  networkError:
    question: >-
      プロキシを使うたびに「ネットワークエラー」またはサイトエラーが表示されます。
    answer: >-
      これは最新のWebプロキシにおける既知の問題です。利用者が多いため、通常はタブの操作が10分ほどないと接続が切断されます。「ページを更新」ボタンを押してページを再読み込みすれば解決します。
    note: >-
      これは通常、プロキシを初めて使うときに発生します。将来的に修正予定です。
  bot:
    question: >-
      ボットだと判定されて、サイトへのログインやコンテンツの閲覧ができません。
    answer: >-
      アクセスが集中する時間帯は、すべての通信がわずか2つのIPを経由するため、これはよくあることです。解決策は、リージョン選択でリージョンを切り替えるか、Torルーティングを有効にすることです。また、Patreonに参加すれば、住宅用ISPを使ったインスタンスを利用でき、この問題を回避できます。
  unreachable:
    question: >-
      「'cdn.example.com' cannot be reached.」のようなエラーが表示されます。
    answer: >-
      ページを再読み込みしてください。一度でうまくいかない場合は、ブラウザの「戻る」ボタンを使うか、Scramjetのページに戻ってもう一度お試しください。
  blank:
    question: サイトが部分的にしか読み込まれない、または真っ白になるのはなぜですか？
    answer: >-
      すべてのWebサイトがサポートされているわけではありません。Webは広大で、コンテンツの読み込み方法や技術がさまざまであるため、これは避けられません。特定のサイトで問題がある場合は、DiscordサーバーまたはGitHubでご報告ください。それ以外の場合は、プロキシのオプションを切り替えて、サイトに対応しているものがあるか試してみてください。
  idb:
    question: >-
      IDBデータベースに関するエラーが表示されます（Scramjet V1の問題）
    answer: >-
      これは通常、プロジェクトのアップデート時に発生します。ブラウザの左上にある (i) アイコン（または鍵マーク）をクリックし、「サイトデータを削除」または「Cookieとサイトデータ > デバイス上のサイトデータを管理 > ゴミ箱アイコン」を選択してください。これでIndexedDBデータベースが消去され、再びプロキシを使用できるようになります。
  discord:
    question: Discordは使えますか？
    answer: はい、Discordはサポートされています。
    note: >-
      ただし、無料のプロキシにはいくつか制限があります。セルフホストしている場合や小規模なドメインを使っている場合を除き、メインアカウントは使わないようにしてください。
  youtube:
    question: YouTubeの動画が再生されないのはなぜですか？
    answer: >-
      上記の手順を試しても問題が続く場合は、インスタンスが一時的にダウンしている可能性があります。特に、多くの人が同じ問題を抱えている場合はその可能性が高いです。セルフホストではこの問題は発生しません。
    tor: >-
      「Tor」オプションを選択してみてください。問題が解決する可能性がありますが、読み込み速度が大幅に低下します。
  login:
    question: サイトにログインしても安全ですか？
    answer: >-
      はい、サイトへのログインは安全です。ただし、1つのドメインに大量の通信が集まるため、信頼できないサイトへのログインや個人アカウントの使用はおすすめしません。IPをローテーションすることでこの問題を軽減していますが、公開プロキシで個人アカウントを使わないのは一般的な心得です。セルフホストであれば気軽に利用できます。また、Patreonに参加すれば住宅用ISPを利用でき、この問題を回避できます。
  captcha:
    question: >-
      アクセスしているサイトが正しく動作しない、またはCAPTCHAエラーが出るのはなぜですか？
    answer: >-
      ScramjetではCAPTCHAに対応していますが、試行錯誤が必要です。Scramjetは速すぎることが多く、CAPTCHAはどうしても不安定になるためです。解決策は、通るまでCAPTCHAを解き続けることです。あまり速く操作しすぎないようにしてください。
  youtubeBlank:
    question: >-
      プロキシサイトでYouTubeを使うと、ページが完全に読み込まれなかったり、動画が真っ白になったりするのはなぜですか？
    answer: '解決方法は2つあります：'
    reload: >-
      上記のエラーが発生したときにページを通常どおり再読み込みすると、動画が読み込まれるはずです。
    reloadFrame: >-
      または、何らかのステルスモードを使用している場合は、ページを右クリックして<code>フレームを再読み込み</code>を実行してください。

privacy:
  title: プライバシーポリシー
  subtitle: InvisiProxy、プライベートなWebプロキシサービス。
  effective: '発効日: 2021年7月16日'
  updated: '更新日: 2026年10月31日'
  what:
    title: InvisiProxyとは？
    body: >-
      InvisiProxy LTSは、ネットワーク、政府、ポリシーによってブロックされている可能性のあるWebサイトに、ダウンロードや設定なしでブラウザ内からアクセスできるWebプロキシサービスです。これを安全に、追加のプライバシー機能とともに実現します。どのブラウザでもTor/Onionサイトを閲覧し、ブラウジングのアクティビティを隠し、フィルターを回避できます。これには、政府によるコンテンツブロッカー、Chrome拡張機能、ローカルのクライアントファイアウォール、ネットワーク関連のフィルターを回避できる可能性も含まれます。<br/>このプロジェクトは主に、検閲を回避するための理想的なクライアントレスソリューションの概念実証として機能します。
  data:
    title: データは収集されていますか？
    body: >-
      InvisiProxy自体は、あなたのブラウジングを記録・収集しません。ユーザーのプライバシーを確保するため、バックエンドではログ記録が無効になっています。唯一の例外はミラーリンクボタンで、不正利用を防ぐためにIPアドレスを数秒間メモリ上に保持しますが、ディスクに書き込まれることはありません。広告付きドメインの広告パートナーは、下記の「広告」で説明するとおり、独自にデータを収集します。NextDNSのクエリは、クライアントのIPやドメインを記録しないよう調整され、スイスに保存されます。NextDNSの数値データのログ保持は最小限で、サービスの円滑な運用を目的としています。このプロジェクトでは、その規模から、パフォーマンスの向上とDNS管理の容易化のためにCloudflareを利用しています。Cloudflareの数値データは、サーバーのアップグレードが必要な時期を判断するための訪問数やページビューの把握に最小限利用されます。NGINXはログを一切保存しない設定です。InvisiProxy LTSは、インターネット検閲を終わらせるという理念とともに、ユーザーのプライバシーを大切にしています。さらに、Wispプロトコル（TCP接続のプロキシ用）をlibcurl-transportと組み合わせ、WebAssembly内でSSL/TLSを実行することでエンドツーエンド暗号化を実現しています。このサービスは可能な限り透明になるよう作られています。いつでもセルフホストして、すべてを自分で管理できることを忘れないでください。<br/><br/>プライバシーに関する意見やリクエストがある場合は、Discordでご連絡ください。
  security:
    title: セキュリティ
    body: >-
      InvisiProxy LTSは、ユーザーに安全で信頼性の高いWebプロキシサービスを提供するために、ゼロから構築されています。InvisiProxy LTSを支える中核技術の1つが、Mercury Workshopが開発した新しいWispプロトコルです。<br/><br/>このプロトコルは、従来のモデルに比べてサービスの速度とセキュリティを向上させる、いくつもの革新的な機能と改良をもたらします。
    intro: >-
      Wispプロトコルは、高いセキュリティ基準を維持しながら、現代のWebトラフィックの需要に対応するよう設計されています。Wispを実装することで、このプロジェクトは次のメリットを得ています：
    performance: >-
      パフォーマンス：WispプロトコルはTCPのデータ転送速度を最適化し、ブラウジング中の遅延を最小限に抑えます。
    compatibility: >-
      互換性：Wispは幅広いWeb技術と互換性があるように作られており、さまざまなWebサイトやオンラインサービスへのシームレスなアクセスを実現します。これは、プロトコルに準拠したさまざまなオープンソースのトランスポート（Libcurl Transport）のサポートによって実現されています。
    censorship: >-
      検閲への耐性：このプロトコルは、制限の厳しいネットワークで使われる高度な検閲技術を回避するよう設計されており、ブロックされたコンテンツに簡単にアクセスできます。
    fingerprinting: >-
      フィンガープリント耐性：このプロジェクトは、公式インスタンスのリバースプロキシ構成に強力なフィンガープリント耐性の仕組みを備えています。つまり、ユーザーの追跡や特定に使われうる固有の識別子を最小限に抑えるよう設計されており、プライバシーが強化されています。業界のベストプラクティスに従い、手法を継続的に更新することで、ユーザーは特定可能な痕跡を残さずに匿名でブラウジングできます。
    transparency: >-
      透明性：透明性はInvisiProxy LTSの重要な原則です。このプロジェクトはオープンソースモデルで運営されており、コミュニティがコードベースをレビューし、貢献することができます。このオープンさは信頼を育むだけでなく、コミュニティからのフィードバックと協力による継続的な改善も可能にします。透明な運営を徹底することで、InvisiProxy LTSはユーザーが自分のデータの扱われ方と、プライバシーを守るための対策を把握できるようにしています。
    randomisation: >-
      ソース/グローバルのランダム化：セキュリティとプライバシーをさらに強化するため、InvisiProxy LTSはソースおよびグローバルのランダム化を採用しています。これにより、ドメインがより長くブロックされずに済み、ブラウジング中の匿名性も向上します。一般的なWebプロキシはアセットを書き換えるたびに痕跡を残しますが、この方法ではプロキシを検出してブロックすることがはるかに難しくなります。
    encryption: >-
      暗号化：InvisiProxy LTSは、特にURL書き換え型プロキシにおいて、エンドツーエンド暗号化と安全なデータ転送に重点を置いた高度なプロキシ技術を使用しています。注：これはまだ大規模な開発途中であり、貢献を歓迎しています。
    audits: >-
      定期的な監査：潜在的な脆弱性を特定して対処するため、定期的にセキュリティ監査を実施しています。
  advertising:
    title: 広告
    body: >-
      一部のInvisiProxyドメインでは、ホスティング費用をまかなうために広告を表示しています。Patreonのインスタンスは常に広告なしです。広告はサードパーティのネットワーク（Adsterra、Adcash、Monetag）によって配信されます。広告はInvisiProxy自身のページと読み込み画面にのみ表示され、プロキシ経由で閲覧するWebサイトの中に表示されることはありません。<br/><br/>広告が読み込まれると、そのネットワークはあなたのIPアドレス、ブラウザのユーザーエージェント、訪問中のドメインなどの技術情報を受け取り、広告の表示、表示頻度の制限、効果測定、不正防止のために独自のCookieを設定・読み取ったり、類似の技術を使用したりすることがあります。これらのネットワークは私たちのページ上でコードを実行する場合があり、そのデータの取り扱いは私たちではなく各社のプライバシーポリシーに従います。<br/><br/>多くの広告ネットワークは optout.aboutads.info または youronlinechoices.eu でオプトアウトできます。コンテンツブロッカーで広告をブロックしたり、Patreonのインスタンスを利用したりすることもできます。
  usage:
    title: その他の利用について
    storage: >-
      InvisiProxyは、ユーザーセッションの維持（詳細は後述）と設定の保存のために、「Cookie」、IndexedDB、localStorage、sessionStorageをお使いのコンピューター上で使用します。これらの情報はすべてお使いのデバイス上に保存され、InvisiProxyが分析に使用することは一切ありません。広告パートナーは、「広告」で説明するとおり、独自のCookieを保存することがあります。
    cookies: >-
      Cookieとは、Webサイトが訪問者のコンピューターに保存する情報の文字列で、訪問者が再訪するたびにブラウザからWebサイトへ送信されます。InvisiProxyは、設定メニューの使いやすさの確保と、ユーザー設定の保存のためにCookieを使用します。コンピューターにCookieを保存したくない場合は、InvisiProxyのWebサイトを利用する前に、ブラウザでCookieを拒否するよう設定してください。ただし、Cookie、localStorage、IndexedDBがないとInvisiProxyの一部の機能は正常に動作しません。InvisiProxyが分析目的でCookie、IndexedDB、localStorage、sessionStorageに何かを保存することはありません。永続的なデータをローカルに保存するために利用しているのは次の機能のみです：Scramjet（プロキシしたアセットのキャッシュ、セッション状態など）、タブ、ブックマーク、自動補完（プロキシ経由）、設定メニュー：タブ隠蔽、アイコンのプリセット、トランスポートのオプション、検索エンジン、テーマ、言語、ウィンドウの種類、Torルーティング、リージョンの切り替え、広告を隠す、履歴を隠す、ウィンドウ漏洩のブロック、WebRTCのブロック、フィンガープリントのランダム化。
    serviceWorkers: >-
      さらに、InvisiProxyはWebプロキシの技術としてService Workerを使用しています。これによりネットワーク通信などを傍受できるようになり、プロジェクトの中核となる機能です。
    consent: >-
      Cookieの設定を変更せずに当サイトの閲覧を続けることで、法律で個別の同意が必要とされない範囲において、InvisiProxyによるCookieの使用、および上記の広告パートナーのCookieに同意したものとみなされます。
  changes:
    title: 最後に
    body: >-
      ほとんどの変更は軽微なものとなる見込みですが、InvisiProxyはInvisiProxy LTSの独自の裁量により、本プライバシーポリシーを随時変更することがあります。InvisiProxy LTSは、プライバシーポリシーの変更がないか、このページを頻繁にご確認いただくことをおすすめします。プライバシーポリシーの変更後も引き続き本サイトを利用した場合、その変更に同意したものとみなされます。不正利用やDDoS攻撃が発生した場合、InvisiProxy LTSは攻撃を緩和しサービスの稼働を維持するため、一時的にデータを記録せざるを得ないことがあります。その場合、記録されたデータは攻撃の緩和後ただちに安全に削除されます。
  contact:
    title: 連絡先とクレジット
    body: >-
      プライバシーポリシーについてご質問がある場合は、次のメールアドレスまでお問い合わせください：

docs:
  chemical: >-
    自分でWebプロキシサービスをゼロから作りたい場合は、<chemical>Chemical</chemical>を使ってみてください。
  chemicalButton: Chemicalでプロキシサイトを構築
  formerly: 旧Holy Unblocker LTS
  badges:
    ci: GitHub Actionsのステータス
    dockerVersion: Dockerイメージのバージョン
    dockerPulls: Dockerのプル数
  intro: >-
    <strong>InvisiProxy LTS</strong>（旧Holy Unblocker LTS）は、検閲の方法がクライアント側かネットワークベースかを問わず、Webフィルターや「ブロッカー」を回避できる実験的なWebプロキシサービスです。これには、政府によるコンテンツブロッカー、Chrome拡張機能、ローカルのクライアントファイアウォール、ネットワーク関連のフィルターの回避も含まれます。さらに、Webサイトだけで、どのブラウザ（Chromiumでも！）からでもTor/Onionサイトを閲覧できます！
  star: リポジトリにスターを付けて、InvisiProxyを応援してください！
  about: >-
    このプロジェクトは主に、検閲を回避するための理想的なクライアントレスソリューションの概念実証として機能します。たとえば、Torを使いたいとき、ブラウジング中にリージョンを切り替えたいとき（または外部プロキシを使いたいとき）、アカウントを作らずにWebサイトを閲覧したいとき（フィンガープリントを減らせます）、広告ブロック対策を回避したいとき、デバイスの利用痕跡を最小限にしたいときなどに役立ちます。任意のドメインでこのプロジェクトをホストするだけで、デバイスに何もダウンロードせずにVPNの代わりとなる手段が手に入ります。安全なWebプロキシサービスとして多数のサイトをサポートし、頻繁にアップデートされ、セルフホストのしやすさを重視しています。InvisiProxy LTSは、YouTube、Gemini、ChatGPT、Discord、GeForce NOWなど、非常に多くのサイトで動作します！また、Webフィルターや国による検閲の回避（DOMマスカレードとソースのランダム化）において、他のWebプロキシにはない独自機能を数多く備えています。現在対応している国は中国（GFW）とロシアです。
  users: >-
    2020年以降、3,000万人以上のユーザーにご利用いただいています。ご支援本当にありがとうございます。Webプロキシのコミュニティがここまで大きくなるとは想像もしていませんでした。
  branches:
    current: '現在のブランチ: Latest'
    title: ブランチの種類
    latest: Latest（master。FOSSとSEO向けにビルド）
    beta: Beta（保留中の変更。動作が壊れる可能性のある変更）
    production: >-
      Production（v4、v5、v6。InvisiProxy LTSの安定版。本番環境でのセルフホスト向けの変更。フィルター回避とリクエスト処理を最大化）
    switch: セルフホストする場合は、本番用ブランチへの切り替えをご検討ください！
  selfHost: >-
    このプロジェクトをセルフホストしたい場合は、<deploy>セルフデプロイのオプション</deploy>をご覧ください。無料のオプションでデプロイできない場合は、Koyebや安価な有料VPSホスティングを検討してください。セルフホストしたくない場合は、InvisiProxyのミラーリンクメニューをクリックしてください。
  discord: "公式サイトのリンクをもっと入手するには、TitaniumNetworkのDiscordに参加してください："
  caution:
    title: 注意
    body: >-
      InvisiProxy LTSをセルフホストする場合は、フィルター回避機能が自動で有効になるPRODUCTIONブランチに切り替えてください。masterブランチにはセルフホストの準備ができていない開発中の変更が含まれます。ただし、このプロジェクトに貢献したい場合は、masterブランチにPRを送ってください。
  tip:
    title: ヒント
    body: >-
      InvisiProxy LTSは、最大限のプライバシーコントロールのためにセルフホスト向けに最適化されています！このリポジトリをフォークし、スターもぜひお願いします。無料または有料のデプロイオプションを使うか、専用インスタンス（VPS）にセットアップしてパフォーマンスを高めることもできます。
  sites:
    site: 対応サイト
    features: 機能
    youtube: >-
      速度やセキュリティを重視した、さまざまなオープンソースWebプロキシを内蔵
    reddit: >-
      ソースのランダム化とDOMマスカレード、さらにプロキシのグローバル変数のランダム化により、主要なフィルターを効果的に回避
    discord: >-
      設定メニューでタブのタイトルとアイコンをカスタマイズでき、閲覧履歴のステルス性が向上
    instagram: >-
      ネットサーフィン中はすべてのWebサイトで広告をブロック。公式サーバーでは低遅延のDNSを使用
    tor: >-
      設定メニューからTorを使ったSOCKS5とOnionルーティングに対応。どのブラウザでもTor/Onionサイトを利用可能！
    geforce: >-
      Webフィルターや国による検閲の回避において、他のWebプロキシにはない独自機能を搭載。
    chatgpt: >-
      ローカルの閲覧履歴を隠し、タブの漏洩を防止し、ネットワーク通信も見えにくく！
    spotify: リージョンの切り替えやTorの有効化で、地域によるプロキシブロックを回避
    more: その他、ほとんどのサイト！
    moreFeature: 高負荷な本番運用と簡単なセットアップを想定して構築
  deploy:
    title: InvisiProxyをデプロイ
    free: 無料のデプロイ
    alternatives: その他の無料サービス
    paid: 本番向けの有料/無料オプション（支払い情報が必要）
    to: '{name}にデプロイ'
    run: '{name}で実行'
    replitTitle: Replit/Herokuでのデプロイはどうなったのですか？
    replit: >-
      Replitは無料ではなくなり、HerokuはWebプロキシを禁止する方針を定めています。クラウド上での開発にはGitHub CodespacesやGitpodを、無料ホスティングにはKoyebをお試しください。
  codespaces:
    title: セットアップ手順
    fork: このリポジトリを自分のGitHubアカウントにフォーク（とスター！）します
    open: >-
      公式の<codespaces>Codespaces</codespaces>サイトにアクセスします（GitHubアカウントを事前に作成しておいてください）
    select: >-
      <strong>New Codespaces</strong>を選択し、自分のアカウントの<em>[USERNAME]/InvisiProxy</em>を探します
    branch: >-
      ブランチが<code>master</code>に、dev containerの構成が<strong>InvisiProxy LTS</strong>に設定されていることを確認します
    create: <strong>Create Codespace</strong>を選択し、コンテナのセットアップを待ちます
    install: >-
      ターミナルで<code>pnpm run fresh-install</code>と<code>pnpm start</code>を入力します
    ports: >-
      アプリケーションのポップアップで「Make public」をクリックし、ポートタブからデプロイしたWebサイトにアクセスします。
  partners:
    title: パートナー
    hardFork: '{name}（ハードフォーク）'
    partner: '{name}（パートナー）'
