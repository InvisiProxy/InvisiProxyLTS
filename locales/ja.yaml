home:
  title: InvisiProxy LTS | 無料Webプロキシ - フィルターを回避してブロックされたサイトにアクセス
  description: >-
    InvisiProxy LTSは、Webフィルターやブロッカーを回避するために設計された最先端のWebプロキシサービスです。クライアント側でもネットワーク側でも、検閲の方法を問わず、Chromebookなどのデバイスでブロックされたサイトへのシームレスなアクセスと、安全でプライベートなブラウジングを実現します。コンテンツブロッカー、Chrome拡張機能、ファイアウォールなどを高度なプロキシソリューションで乗り越えましょう。
  ogDescription: >-
    InvisiProxy LTSは、ネットワークやブラウザの制限を回避し、ブロックされたWebサイトに安全にアクセスできる一流のWebプロキシサービスです。強固なセキュリティと高度な機能で、シームレスなブラウジング体験をお楽しみください。
  twitterDescription: >-
    InvisiProxy LTSは、検閲やフィルターを回避してブロックされたWebサイトへ安全にアクセスできる最高峰のWebプロキシサービスです。プライベートなブラウジングや、Chromebookなどのデバイスでのネットワーク制限の回避に最適です。

  headline: 検閲の悪夢を終わらせよう。
  tagline: 失われたプライバシーが、すぐ手の届くところに。
  browseNow: 今すぐブラウジング
  bypassNow: 今すぐ回避
  donate: 寄付する
  logoAlt: InvisiProxy ロゴ ヒーロー
  terminal:
    setup: 本番ブランチで初めてセットアップする場合…
    start: もしくは通常の利用では…
    dev: 開発用には…

  free:
    title: InvisiProxyは無料でお使いいただけます。
    body: >-
      このプロジェクトはオープンソースなので、リポジトリを簡単にフォークしてセルフホストすれば、最大限のプライバシーコントロールを実現できます。他の多くのWebプロキシサービスとは異なり、InvisiProxyはTLSによるエンドツーエンド暗号化、閲覧履歴の分離、ChromiumブラウザでのTor/Onionルーティング、完全な透明性、そしてプライバシーコントロールを備えています。<strong>他のプロキシサービスとは違い、公式インスタンスではユーザーデータを一切収集しません。デバッグ目的でさえもです。</strong><br/>私たちが利用しているオープンソースの依存関係（Wisp、Libcurl、Epoxy）は安全性とプライバシーを重視して設計されており、悪意のあるセルフホストのインスタンスであっても、あなたのブラウジングの機密性が保たれます。

  fast:
    title: InvisiProxyは高速かつ高機能です。
    body: >-
      InvisiProxyは卓越したWebプロキシ性能を発揮します。reCAPTCHA/Botguard対応、Torネットワーク、SOCKS5プロキシチェーン、カスタマイズ可能なブラックリスト設定、漏洩防止、履歴の非表示設定、そしてScramjet + Wisp（Libcurl Transportと連携）による幅広いサイト互換性など、強力な機能を備えています。CroxyProxyやProxiumなどの他の人気サービスは、アセットの書き換えが中途半端でリクエストが漏洩することが多く、プライバシー上の懸念もあります。このプロジェクトはプロキシチェーンにも対応しており、複数のプロキシを経由して通信することで、セキュリティと匿名性をさらに高めることができます。

  practical:
    title: InvisiProxyは実用的です。
    body: >-
      ソースのランダム化や、Proxy Transports、Wisp、Scramjetといったプロジェクトを活用することで、Web・政府・ネットワークのフィルターを回避するシームレスな体験を提供します。このプロジェクトは中国（GFW - 中国のグレート・ファイアウォール）やロシアなどで使われているフィルターにも、<strong>ソフトウェアをダウンロードすることなく</strong>対応します。これはWebサイトとしてブラウザ内と私たちのバックエンド（セルフホストの場合はあなた自身のバックエンド）だけで完結しており、最も強力な検閲ブロックさえも回避できます。ダウンロードは不要です。InvisiProxyのドメインを入力するだけ。ブロックされている場合は公式InvisiProxyサイトでミラーを入手し、匿名でブラウジングしましょう。

  heroSubtitle: 無料で透明性の高いサービス
  designedWithPrivacy: プライバシーを第一に設計<underline/>。

  overview:
    title: 概要
    body: >-
      実験的なWebプロキシサービスであるInvisiProxy LTSは、検閲の方法がクライアント側かネットワークベースかを問わず、Webフィルターや「ブロッカー」を回避できます。これには、海外の政府によって導入されたコンテンツブロッカー（中国/GFW、ロシアなど）、Chrome拡張機能、ローカルのクライアントファイアウォール、ネットワーク関連のフィルターの回避も含まれます。
    donate: >-
      このプロジェクトを無料で維持するため、寄付をご検討ください！支援者には毎月の追加ドメイン、ベータ版へのアクセス、個人用ドメイン、機能リクエストの優先対応を提供しています。<br/>寄付は<patreon>こちらのPatreon</patreon>から行えます。
    patreonLabel: Patreonで寄付する
    imageAlt: サーバーアイコン

  intent:
    title: 目的
    body: >-
      このプロジェクトは主に、検閲を回避するための理想的なクライアントレスソリューションの概念実証として機能します。安全なWebプロキシサービスとして多数のサイトをサポートし、頻繁にアップデートを行いながら、デザイン、仕組み、機能の細部にこだわっています。
    palette: >-
      本プロジェクトのカラーパレットは、最適なデザイン配色と、読みやすいコード構文およびUIコンポーネントを重視した<nord>Nord Theme</nord>をベースに構築されています。
    imageAlt: ファイルコードアイコン

  usage:
    title: 使い方
    body: >-
      <browse>ブラウズ</browse>ページに移動し、掲載されているプロキシを1つ選択してください。その後、検索ボックスにアクセスしたいサイトを入力します。各Webプロキシは、回避性能・速度・セキュリティのレベルがそれぞれ異なります。Scramjetのご利用をおすすめします。<br/><br/>ブロック解除するWebサイトの例：<code>https://youtube.com</code>
    imageAlt: シールドアイコン

  apps:
    title: アプリ
    body: >-
      InvisiProxyには、YouTube、Spotify、GeForce NOW、Discord、ChatGPT、Geminiなど、あらかじめリンクされたアプリケーションのコレクションが用意されています！
    imageAlt: アプリケーションアイコン

  hosting:
    title: ホスティングとデプロイ
    body: >-
      <strong>InvisiProxy LTS</strong>は、モジュール性、使いやすさ、デプロイの容易さを念頭に設計されたオープンソースソリューションです。主な機能として、広告ブロック、柔軟なソースコード生成、高度なプロキシナビゲーションなどがあります。<br/><br/>詳しいセットアップ手順については、公式<github>GitHubリポジトリ</github>または<docs>こちらの内蔵ドキュメント</docs>をご覧ください。
    docsTitle: ホスティングに関する追加情報
    imageAlt: ホスティングとデプロイのアイコン
    imageTitle: InvisiProxy LTSのホスティングとデプロイ

  contributing:
    title: 貢献
    body: >-
      <strong>InvisiProxy LTS</strong>は、素晴らしい貢献者の皆さんの献身的な努力によって成り立っています。オープンソースプロジェクトである<strong>InvisiProxy LTS</strong>は、インターネット検閲を回避し、ユーザーが情報へアクセスしやすくするために、コミュニティの情熱に支えられています。
    start: 貢献を始めるには、<github>GitHubリポジトリ</github>にアクセスしてください。
    imageAlt: GitHub貢献アイコン
    imageTitle: GitHubでInvisiProxy LTSに貢献する

  githubTitle: InvisiProxy LTS GitHubリポジトリ

  bypass:
    title: 検閲やフィルターを回避
    body: >-
      InvisiProxy LTSはオープンソースの<strong>Webプロキシプロジェクト</strong>です。高度な<strong>Webプロキシによるブロック解除</strong>機能で、オンラインコンテンツへの制限のないアクセスとブラウジングをお楽しみください。また、どこにでもセルフホストでき、中国（中国のグレート・ファイアウォール - GFW）やロシアのような国家規模・地域規模のブロックも回避できます。

  freeProxy:
    title: 100%無料のWebプロキシ
    body: >-
      Webサイトの<strong>ブロックを解除</strong>し、制限されたコンテンツにアクセスできる<strong>無料のWebプロキシサービス</strong>をご活用ください。教育機関や職場のフィルターの回避に最適で、あらゆるブロックを解除するために作られています。

  tor:
    title: ChromiumブラウザとFirefoxでTorルーティングを利用
    body: >-
      InvisiProxy LTSを使えば、ChromiumベースやFirefoxベースのブラウザから直接<strong>Torネットワークにアクセス</strong>できます。つまり、このWebサイト内で<strong>.onion</strong>サイトに直接アクセスできるということです。これにより、地域の制限を回避しながら匿名でWebを閲覧できます（ある程度までですが。本物のTorの方がフィンガープリント対策は優れています）。このプロジェクトは、プロキシチェーン用のカスタムSOCKS5プロキシの設定にも対応しています。

