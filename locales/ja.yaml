    title: '目次：'
    setup: セットアップ
    terminal: ターミナル
    configuration: プロジェクトの構成
    server: サーバーの構成
    tor: TORルーティング
    proxy: プロキシ
    navigation: クライアントナビゲーション
    translations: 翻訳
    structure: 構造
    structureInfo: 構造の詳細
    views: 静的ファイル
    scripts: スクリプト
    future: 今後の追加予定
    beginners: 初心者向けの説明
    hosting: ホスティングプロバイダー
    domain: ドメインの設定
    cloudflare: Cloudflareの設定
    workspace: ワークスペースの構成
    faq: 詳しいFAQ
    more: その他の情報
  setup:
    title: セットアップ方法
    branchWarning: >-
      IDEで本番リリース用のブランチに切り替えることを強くおすすめします。masterブランチには不安定な変更や開発中の変更が含まれることがよくあります。
    branchExample: '例：masterではなくv6.x_production'
    terminal: ターミナル
    terminalIntro: >-
      上のボタンを使って上記のデプロイ先にデプロイするか、専用サーバーで以下のコマンドを入力してください
    nginxOnly: このプロジェクトはNGINXに対応するよう作られています。CADDYではありません。
    requirements: >-
      <code>Node 26.x</code>を使用していることも確認してください。<code>git</code>と<code>curl</code>は必須の依存関係です：
    builtIn: >-
      このWebサイトは、<scramjet>Scramjet</scramjet>、<wisp>Wisp</wisp>、<merp>Merp 難読化</merp>、<epoxy>EpoxyTransport</epoxy>、<libcurl>LibcurlTransport</libcurl>を内蔵してローカルでホストされています。
    caddyWarning: >-
      セキュリティ上の理由から、リバースプロキシでホストする場合はCaddyではなくNGINXを使用してください。wispurrがループバックを使用するためです。Caddyを使う場合は、この機能を無効にするか、Caddyのデフォルト設定を調整してください。
    resources: 'セルフホスト用のリソース：'
  commands:
    pm2Config: >-
      pm2を使用したい場合は、config.jsを編集してproductionをtrueに設定してください（VPSでのホスティングが簡単になります）
    pm2: pm2デーモンの利用
    restart: もしくは2回目以降の利用では…
    kill: pm2で作成された本番プロセスを終了するには
    buildErrors: ビルドエラーが発生した場合…
    serviceErrors: サービスエラーが発生した場合…
    nodeVersion: 26または最新版
    start: プロジェクトを起動したい場合
    test: エンドポイントとエラーのテスト用
    prSet: prSet関数のコードはこちら….
  ubuntu:
    title: 詳しいセットアップ（Ubuntuの例）
    intro: >-
      <code>Node.js 26.x</code>、<code>curl</code>、<code>git</code>がインストールされている必要があります。以下はDebian/Ubuntuでのセットアップ例です。
    summary: ステップごとのガイド
    mirrors: >-
      簡単に済ませたい場合は、discord.gg/unblock でTNのDiscordに参加し、ミラーサイトのリンク（補充済みでブロックされていないもの）をリクエストできます。
    hosting: ホスティング
    hostingBody: >-
      セルフホストしたい場合は、まずVPSまたはホスティングプロバイダーが必要です：
    dependencies: 依存関係
    dependenciesBody: >-
      次に、git、musl、nginx（またはcaddy）、Node.jsをセットアップする必要があります。以下はUbuntu LTSでの例です：
    tor: Torのサポート（任意）
    configure: InvisiProxyの構成
    configureBody: >-
      最も重要なオプションは、productionと、難読化およびDOMマスカレードの手法です。
    configureMore: 'あとは必要に応じて構成してください：'
    run: InvisiProxyのクローンと実行
    runBody: >-
      その後、該当するプロセスを実行します。構成でproductionをtrueにしている場合、独自のワーカー/キャッシュシステムとともにpm2が自動的に有効になります。
    restart: NGINXまたはcaddyを使用した場合は、もちろん再起動/再読み込みしてください
  config:
    title: 構成
    server: サーバー構成のセットアップ
    port: >-
      起動時のプロキシのデフォルトポートは<code>http://localhost:8080</code>です。必要に応じて、ポートやその他の本番用の指標を<code>./ecosystem.config.js</code>で変更できます。
    local: >-
      ソースのランダム化や自動ミニファイなど、その他のローカルな変更はすべて<code>./config.json</code>にあります。
    options:
      minifyScripts: >-
        サーバー起動時に、該当する静的アセットを自動的にミニファイします。
      randomizeIdentifiers: >-
        Ultraviolet向けの実験的なプロキシグローバル変数のランダム化を有効にします。拡張機能ベースのフィルターにUVが検出される可能性を下げます。
      production: >-
        サーバーホスティング用にあらかじめ構成された本番セットアップを使用します。キャッシュ制御とソースの書き換えが自動で設定されます。
      disguiseFiles: >-
        InvisiLTSの実際のコンテンツ取得を難読化するDOMマスカレードを有効にします。リクエストを偽装し、展開してからDOMツリーを再構築することで実現します。
      usingSEO: >-
        <code>./src/data.json</code>で指定したデータの断片を入れ替えてソースをランダム化する、ソースのランダム化を有効にします。InvisiProxy LTSを自動的にフラグ付け・ブロックするキーワードを隠したり、ソースによるブロックを防いだりするのに非常に役立ちます。
      verbose: >-
        コンパイルとビルドのメッセージを有効にし、コンパイル中の進捗や問題の可能性を確認できるようにします。
      mirrorLinksFile: >-
        リンクページの配布機能が使用するサーバー専用ファイルで、デフォルトは<code>private/mirror-links.txt</code>です。相対パスはプロジェクトのルートから解決され、絶対パスにも対応しています。1行に1つのHTTP(S) URLを記述し、公開されないようにファイルは<code>views/</code>の外に置いてください。この設定を変更したらサーバーを再起動してください。
      geoLanguage: >-
        Cloudflareの<code>CF-IPCountry</code>ヘッダーを使った言語の自動選択を有効にします。このヘッダーは誰でも設定できてしまうため、Cloudflareの背後でのみ有効にしてください。国は各<code>./locales/*.yaml</code>ファイルの<code>language.countries</code>に言語ごとに記載されています。
      singleLanguage: >-
        <code>true</code>にすると、<code>language</code>で設定した言語だけがビルドされ、すべての訪問者にその言語が表示され、言語設定は非表示になります。ビルドが速く小さくなるため、1つの言語だけが必要なDockerなどのデプロイに便利です。デフォルトは<code>false</code>です。
      language: >-
        <code>singleLanguage</code>がオンのときにビルドする言語で、<code>./locales/</code>内のファイルに対応します（例：<code>en.yaml</code>なら<code>en</code>）。デフォルトは<code>en</code>です。Dockerの場合、言語はビルド時に選ばれるため、<code>docker build</code>または<code>docker compose build</code>を実行する前に<code>config.json</code>で設定してください。
  translations:
    title: 翻訳
    crowdin: >-
      InvisiProxy LTSは<crowdin>Crowdin</crowdin>で翻訳されており、コードに触れることなく誰でも協力できます。プロジェクトに参加し、言語を選んで翻訳を始めましょう。完成した翻訳は自動的に<code>./locales/</code>に同期されます。
    rules: >-
      翻訳のルール（プレースホルダー、タグ、マスクする用語）については<readme/>をご覧ください。Crowdinにあなたの言語がない場合は、issueを作成するかDiscordでお尋ねください。
  tor:
    title: Tor/Onion/SOCKS5ルーティングのセットアップ
    intro: >-
      Onionルーティングの設定を機能させるには、Torをセットアップする必要があります（GUIは不要ですが、あっても構いません。GUIを使う場合はポート9050を9150に置き換えてください）！
    guide: 'このガイドに従ってTorをホストするだけです：'
    cliGuide: '別のガイド（CLI向け）：'
    body: >-
      Ubuntuを使用したVPSでInvisiProxy LTSをホストしている場合は、本番環境の管理を簡単にするためにTorをsystemctlに登録することを検討してください。LinuxまたはWindowsでTorが起動すれば、ユーザーが設定メニューで有効にしたときにInvisiProxy LTSで自動的に動作します。
    customWisp: ユーザーはプロキシの設定で独自のWispサーバーを設定することもできます。
    customProxy: >-
      Scramjetの通信をカスタムのHTTP/HTTPS/SOCKS5プロキシ経由にしたい場合、これはサーバー側の<code>./src/server/wisp.ts</code>で処理されます。
  proxy:
    title: プロキシの構成
    body: >-
      設定メニューで割り当てられるWebプロキシ関連の設定を調整する主な場所は<code>./views/assets/js/register-sw.js</code>です。ここでは、Cookieでローカルに設定されるトランスポートのオプションの変更、SOCKS5プロキシの差し替え、Onionルーティングのポートの変更、ブラックリストの指定などができます。
    options:
      stockSW: >-
        Ultravioletのデフォルトのサービスワーカー構成ファイルです。ただしInvisiProxyでは広告ブロックが自動的に有効になるため、デフォルトでは使用されません。
      blacklistSW: >-
        ドメインのブラックリスト化と広告ブロックができるよう改変したUltravioletです。
      proxyUrl: >-
        SOCKS5/HTTPS/HTTPプロトコルのURLを指定します。デフォルトはTorのデフォルトプロキシポートです。任意の有効なポートやSOCKS5プロキシに差し替えられます。epoxyとlibcurlの両方でproxyオプションを使って設定します。
      transports: >-
        Bare-Muxで切り替えてWispを利用するポートを指定します。
      wispUrl: Wispのパス名またはURLの処理を変更します
      defaultMode: >-
        グローバルに使用されるデフォルトのトランスポートを指定します（ユーザーは引き続き設定メニューで切り替えられます）
      ScramjetController: >-
        このコンストラクターでは、Scramjetで使用するプレフィックスを動的に差し替えたり、ファイルの場所を指定したりできます。ファイル名を変更する場合は<code>./views/scram/scramjet.sw</code>の編集が必要になる場合があります。
  navigation:
    title: クライアントナビゲーションの構成
    body: >-
      クライアント側のナビゲーションスクリプトの主な場所は<code>./views/assets/js/common.js</code>です。このファイルは主に、オムニボックス（検索エンジン）の機能、プロキシのオプションの切り替え、その他のクライアント設定に使用されます。
    options:
      getDomain: >-
        この定数は、オムニボックスにURLを追加するときに削除するサブドメインを指定するために使用されます。
      goFrame: InvisiProxy LTSで使用するステルスフレームを指定します
      sx: >-
        この定数は、ユーザーがURL以外のものを入力したときにプロキシ経由で使用する検索エンジンを指定します
      search: 送信されたURLに使用するクエリを指定・解析する関数です
      urlHandler: goProxオブジェクトの関数を設定するために使用されます。
      goProx: >-
        この定数では、特定のプロキシや、Webプロキシ経由にする必要のあるリンクのURL処理をマッピングできます。
      prSet: goProxを使って、必要なボタンや入力欄にイベントリスナーを設定します
      huLinks: >-
        <code>./views/assets/json</code>に記載されたパスを自動的に取得し、ページや用途に応じて追加します。フィルターでブロックされるリンクを隠し、アプリを追加しやすくするために使われます。
  structure:
    title: 構造
    summary: Webページ
    info: 構造の詳細
    root:
      views: >-
        InvisiProxyのサイト本体が置かれ、静的アセットが配信される場所です。
      src: 難読化とキーワード除去機能を今後実装するための場所です。
    views: <code>/views/</code>の詳細
    folders:
      dist: はミニファイされたファイルに使用されます。ビルド時に作成されます。
      pages: はサイトのHTMLに使用されます。
      assets: はさまざまなCSS、JS、画像、JSONファイルの保存に使用されます。
      scram: >-
        にはローカルのScramjet実装が含まれます。一部のファイルはnodeモジュールで上書きされます。
      uv: にはUVの実装が含まれます。
    scripts: <code>/views/assets/js/</code>にあるスクリプト
    files:
      card: はウェルカム画面に表示されるボックスカードにおしゃれな視覚効果を加えます。
      common: >-
        はすべてのページで使用され、自動補完など、ほとんどのサイト機能を動作させます。
      csel: >-
        は設定メニュー、オムニボックスの機能、その他の追加機能を管理します。
      loader: はDOMマスカレード用のアセットとして使用されます。
      registerSw: >-
        はUltravioletが動作するためのサービスワーカーを作成・管理し、bare transportも使用します。
  future:
    title: 今後の追加予定
    body: <todo>こちら</todo>はInvisiProxy LTSの（すべてではない）ToDoリストです。
  beginners:
    title: 外部プロキシとホスティングに関する初心者向けのざっくり説明
    intro: まず、プロキシをローカルまたは外部でホストする必要があります。
    hosting: 'おすすめのホスティングの例：'
    current: 現在のホスティングプロバイダー
    paid: 有料
    freePaidDedicated: 無料、有料、専用
    freeAndPaid: 無料と有料
    preference: >-
      ホスティングプロバイダーの中では、DedipathとAzureが一押しです。セルフホストも可能です。
    cloudflare: >-
      まともなVPSを選んだら、サイトとプロキシ用サブドメインの両方のDNSレコードにCloudflareを使用します。
    dns: >-
      これはDNSレコードの例です。セルフホストでは<code>Aレコード</code>が望ましいです。
    dnsAlt: DNSレコード
    root: >-
      <code>@</code>と<code>www.example.com</code>はInvisiProxy LTSに使用しています。
    subdomain: >-
      <code>a.example.com</code>は、サイト管理者の必要に応じて、LibredditやInvidiousなどの他のインスタンスに使用しています。
    local: >-
      前述のとおり、InvisiProxyは最初からScramjetとUltravioletを使ってローカルでホストされます。外部のインスタンスは必要ありません。
  domain:
    title: ドメインの手順
    porkbun: >-
      プレミアムドメイン（TLD）を取得したい場合は、驚きの価格でドメインを提供している<porkbun>Porkbun</porkbun>を使いましょう。<code>.org</code>ドメインなら、初年度は通常わずか5ドル程度です。
  cloudflare:
    title: Cloudflareの手順
    account: >-
      Cloudflareを使用し（アカウントを作成）、サイトを追加してから、さまざまなDNSのターゲットをCloudflareに追加します。サイトを追加する際に提示されるCloudflareのネームサーバーを必ず設定してください。
    records: >-
      CNAMEにしてください（Aレコードでも動作します）。次の構成に従うようにしてください：
    columns: タイプ | 名前 | ターゲット
    ip: ここにVPSのIP
    ssl: >-
      HTTPSを強制し、SSLをFlexibleに設定してください（LetsEncryptを使わない場合）。それ以外の場合はSSLをFullに設定できます。
  workspace:
    title: ワークスペースの構成
    vsc: >-
      自分のデバイスがあるなら、<vsc>Visual Studio Code</vsc>がおすすめです。手に入る中で最良の選択肢と言えますが、もちろん個人の意見です。また、マシンに<node>Node.JS</node>がインストールされていることを確認してください。
    fork: >-
      この部分はあまり詳しく説明しませんが、まずこのリポジトリをフォークします。次に、使用しているOSに応じて何らかのターミナルでローカルにクローンします。セットアップしたいフォルダに移動していることを確認してください。
    gitignore: >-
      次に、リポジトリをクローンしたフォルダをVSCに追加します。そして<code>pnpm install</code>を実行します。GitHubで公開する場合は、ルートディレクトリに次の除外設定を含む<code>.gitignore</code>を追加することをおすすめします：
    deploy: >-
      これでワークスペース環境のセットアップは完了です。作成したワークスペースをデプロイする方法は、ホスティングプロバイダーによって異なるので調べてください。
    gitpod: >-
      学校のパソコンやChromebookで使えるオンラインIDEが欲しい場合はGitPodを使いましょう。基本的にはブラウザで使えるVisual Studio Codeです。
    gitpodAccount: 'アカウントを作成：'
    gitpodFork: 'このリポジトリをフォークし、ワークスペースをセットアップするために次のURLを入力します：'
    gitpodSteps: >-
      リポジトリで<code>pnpm install</code>を実行し、ルートディレクトリに<code>node_modules</code>を除外する<code>.gitignore</code>を追加するという、上記と同じ手順を行ってください。
  faq:
    title: 詳しいFAQ
    summary: クイックFAQ
    games: このリポジトリのゲームはどこにありますか？（404エラーなど）
    gamesBody: <games>こちら</games>をお読みください。
    captcha: >-
      アクセスしているサイトが正しく動作しない、またはCAPTCHAエラーが出るのはなぜですか？
    captchaBody: >-
      残念ながら、現在のプロキシではどれもCAPTCHAへの対応が不安定です。主にScramjetが対応しています。そのため、どのプロキシでも動作しないサイトがあるかもしれません。
    badGateway: 502エラーが出ます。どうすればいいですか？
    badGatewayBody: >-
      その場合は、サイトを切り替えるか、しばらく待ってください。キャッシュを消去すると解決することもあります。
    questions: >-
      まだ質問がある場合は、こちらにリンクしているDiscordで気軽に聞いてください。
    domains: >-
      公式ドメインに番号が付くようになったのはなぜですか？このプロジェクトのメンテナンスは再開されたのですか？
    domainsBody: >-
      はい、このプロジェクトはLTSサポートのために再び活動しています！ただし、確実に動作させるため、アプローチはよりシンプルになりました。必要に応じたドメインの補充と、しっかりメンテナンスされたソースです。これまで以上に、このプロジェクトはWebプロキシサービスの分野で革新に挑む勇敢な人たちのための概念実証です。
  closing:
    summary: 以前の終了メッセージ（原文 - 2022年）
    announcement: >-
      あまり良いお知らせではなくてごめんなさい。たくさん考え、ひどく迷った末に、Holy Unblockerを終了し、TNを去ることにしました。何か月もずっと悩み続けてきたことで、そのせいで更新が途絶えたり、昨年は大きな空白ができたりしました。情熱を持って楽しみ、時間を費やし、ここで素晴らしい友人や最高の開発者たちと出会えたプロジェクトを、ただ投げ出したくはなかったんです。その人たちが誰なのか永遠に語り続けられますが、ここでやめておきます。本人たちはわかっているはずです :D
    reasons: >-
      考えが変わった一番の理由は、今ここで区切りをつけることにしたからです。1) モチベーションがなくなった 2) コミュニティは時に最高とは言えず、優しくないこともある（これは言っておかないと） 3) HU/TNのプロジェクトとしての将来があまり明るく見えない。
    secrets: >-
      この決断には他にも理由があるので、これで情報が足りないと感じる人がいても、いくつかは秘密にしておきます。親しい友人なら、私がこの何か月もこの選択にとてもストレスを感じていたことを知っているはずです。それに、もうすぐ卒業するということも、この決断の大きな後押しになりました。
    future: >-
      将来また続けたり戻ってきたりするかもしれませんし、GitHubだけに残すかもしれません。これを書いているのは、今でもこの変更について迷っているからです。でも今のところは、Incognitoのような他のプロキシサイトをチェックしてみてください（Duceは頻繁に大量のアップデートをしていて、Ultravioletの作者/開発者でもあるので、応援してあげてください） :yayy_hopi:
    patreon: >-
      彼のPatreonもぜひチェックしてください！現在のHUのパトロンは来月以降請求されず、HUのPatreonはアーカイブされるので、DuceがIncognito用のドメインをもっと買えるよう、彼のPatreonへどうぞ。
    signoff: 愛を込めて <3
  more:
    title: その他の情報
    maintained: >-
      このプロジェクトはInvisiProxy LTSチームによってメンテナンスされており、TitaniumNetwork公式のフラッグシップWebプロキシサイトです。
    website: 詳細とクレジットは公式Webサイトをご覧ください。
    sources: 'Webプロキシのソース：'
    sourcesBody: >-
      このプロジェクトは現在、Wispプロトコルに準拠したWebプロキシとしてScramjetとUltravioletを使用しています。Bare-Muxは、Wispで使用するトランスポートシステムの切り替えに使われています。含まれているトランスポートシステムはEpoxyTransportとlibcurl-transportです。
    wispProtocol: Wispプロトコル
    merp: Merp（難読化モジュール）
    dnsBlocklists: hagezi DNSブロックリスト
    dependencies: 'その他の依存関係：'
    mentions: '特筆すべき言及：'
    hostingProvider: ホスティングプロバイダー
  meta:
    title: InvisiProxy ドキュメント | セルフホスト、構成、Torのセットアップ
    description: >-
      InvisiProxyをセルフホスト：pnpmでインストールし、config.jsonで設定し、TorやSOCKS5プロキシ経由で通信させ、各依存関係の役割を確認しましょう。
    social: >-
      自分だけのInvisiProxyインスタンスを動かしましょう。インストール、config.json、TorとSOCKS5のルーティング、プロジェクトを支えるライブラリについて解説します。

apps:
  intro: >-
    下のWebサイトを選択すると、プロキシ経由で開きます。これは公開プロキシサービスなので、メインアカウントでのログインは避けてください。一部のサイトではサブアカウントと2FAを有効にすることで制限が緩和されるため、サブアカウントを作成して2FAを有効にすることをおすすめします。数百万件のリクエストが少数のIPを経由しているため、アクセスをブロックするサイトもあります。
  patreon: >-
