    network-related filters. The project even allows the ability to browse
    Tor/Onion sites in any browser (even Chromium) all through a website!
  star: You can support InvisiProxy by starring the repository!
  about: >-
    This project serves mostly as a proof of concept for the ideal clientless
    solution to bypassing censorship. A good use case of this project would be
    if you ever needed a method to use Tor, swap regions when browsing (or use
    an external proxy), browse websites without making accounts (reduces
    fingerprinting), bypass adblocking, and/or leave minimal traces of device
    activity. Simply host this project on any domain and have an alternative
    solution to a VPN without needing to download anything on said device.
    Being a secure web proxy service, it supports numerous sites while being
    updated frequently and concentrating on being easy to self-host.
    InvisiProxy LTS works with a large number of sites, including YouTube,
    Gemini, ChatGPT, Discord, GeForce NOW and more! This project also features
    good amount of exclusive features compared to other web proxies in terms of
    bypassing web filters (DOM Masquerading and Source Randomization) and global
    censorship from countries. Current countries supported are China (GFW) and
    Russia.
  users: >-
    Over 30M+ users since 2020. Thank you so much for the support I could have
    never imagined how massive the web proxy community has become.
  branches:
    current: 'Current Branch: Latest'
    title: Branch Types
    latest: Latest (master; built for FOSS and SEO)
    beta: Beta (pending changes; changes that may break things)
    production: >-
