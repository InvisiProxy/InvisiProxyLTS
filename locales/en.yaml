faq:
  meta:
    title: InvisiProxy FAQ | Network Errors, CAPTCHAs & YouTube Fixes
    description: >-
      Network Error, blank pages, CAPTCHA loops, or YouTube not loading? Fixes
      for the most common InvisiProxy problems, and whether it's safe to log in
      to sites.
    social: >-
      Quick fixes for Network Errors, blank pages, CAPTCHA loops and YouTube
      playback, plus answers on Discord support and logging in safely.
  title: Frequently Asked Questions
  search: Search
  searchLabel: Search frequently asked questions
  icons:
    question: How do I obtain Icon URLs for the Tab Cloaking menu?
    bookmarklet: >-
      Go to the website you want an icon from, then use this bookmarklet (drag
      it to your bookmarks bar):
    button: Find Icon URL
    copy: >-
      Copy the URL that the bookmarklet gives you. Then go back to InvisiProxy
      and enter in the URL for the Icon URL in Settings. Enjoy!
  networkError:
    question: >-
      I am getting "Network Error" or Site Error every time I use the proxy?
    answer: >-
      This is a known issue with our modern web proxies. Due to the amount of
      users we get typically after ten minutes of no tab activity the
      connection is cut. Simply hit the Refresh Page button and reload the page
      to resolve the issue.
    note: >-
      This typically happens the first time you use the proxy. We have a future
      fix for this.
  bot:
    question: >-
      I am having problems logging into sites or viewing content since it
      thinks I am a bot.
    answer: >-
      During peak traffic hours this is very common due to everything going
      through only two respective IPs. The solution is to swap regions via
      Region Selection or enable Tor routing. You can also join our Patreon for
      access to a instance with a residential ISP to avoid this issue.
  unreachable:
    question: >-
      I am getting an error similar to: "'cdn.example.com' cannot be reached."
    answer: >-
      Reload the page. If that doesn't work the first time, simply use the
      browser's back button or head back to the Scramjet page and try again.
  blank:
    question: Why is my site loading in partially or just blank?
    answer: >-
      Not all websites are supported. Naturally this is due to the wide
      expanses of the web with different technologies and methods of loading
      content. If you are having issues with a specific site, please report it
      to us on our Discord server or GitHub. Otherwise try filtering through
      our proxy options to see if one of them supports the site.
  idb:
    question: >-
      I am getting an error referencing an IDB Database (Scramjet V1 issue)
    answer: >-
      This typically happens whenever we do updates to our project. Simply
      click on the (i) icon in the top left corner of your browser (or lock
      symbol) and select "Clear Site Data" or "Clear Cookies and Site Data >
      Manage On-Site Data > Trash Icon". This will clear the IndexedDB database
      and allow you to use the proxy again.
  discord:
    question: Is Discord supported?
    answer: Yes, Discord is supported.
    note: >-
      However, there are some limitations with the free proxies. Ensure that
      you don't utilize your main account unless if you are self-hosting or
      using a small domain.
  youtube:
    question: Why are YouTube videos not working?
    answer: >-
      If you are having persistent issues even after doing the steps above
      there is a chance that the instance is down temporarily, especially if
      large groups of people are also having the issue. This issue doesn't
      happen for self-hosting.
    tor: >-
      Try selecting the "Tor" option as this may fix the problem but greatly
      reduce loading speeds.
  login:
    question: Is it safe for me to login to sites?
    answer: >-
      Yes, it is safe to login to sites. However, we recommend that you do not
      login into sites you do not trust or use personal accounts due to the
      number of traffic being routed into a single domain. We try to mitigate
      this problem by rotating IPs however it is just a common practice to not
      use personal accounts on public proxies. Self-hosting however you can do
      so with ease. You can also join the patreon to utilize a residential ISP
      and avoid this issue.
  captcha:
    question: >-
      Why is the site I am on not working correctly or having CAPTCHA errors?
    answer: >-
      Captcha support works with Scramjet but it will take trial and error. The
      reason for this is Scramjet is often simply too fast and naturally
      CAPTCHA is very spotty. The solution is just keep trying to solve the
      CAPTCHA until it works. Try not to go too fast.
  youtubeBlank:
    question: >-
      When using YouTube on any of the proxy sites, why does the page not load
      fully or the video is just white?
    answer: 'There are two methods for fixing this:'
    reload: >-
      Reloading the page normally when the error above happens should load the
      video.
    reloadFrame: >-
      Or right-clicking the page and doing <code>Reload Frame</code> if you are
      using some form of Stealth Mode.

privacy:
  title: Privacy Policy
  subtitle: InvisiProxy LTS, a private web proxy service.
  effective: 'Effective Date: 07-16-2021'
  updated: 'Updated Date: 11-26-2026'
  what:
    title: What is InvisiProxy?
    body: >-
      InvisiProxy LTS is a web proxy that runs in your browser. Instead of
      opening a site directly, you open it through the proxy, so your
      network only ever sees the proxy. Sites blocked by your network,
      school or government become reachable again, and Tor/Onion sites open
      in any browser. Nothing to download, nothing to install.
  data:
    title: What is collected?
    body: >-
      InvisiProxy does not log your browsing. The Wisp server is started
      with per-connection logging off: it records no addresses and no
      destinations. The nginx config that ships with this project turns
      access logs off on the proxy paths, and no request logs are written
      to disk.<br/><br/>One exception, kept in memory only: the mirror
      links button remembers your address for five seconds so the button
      cannot be spammed. It is never written to disk and leaves no
      records.<br/><br/>Attacks and floods are handled with rate limits and
      connection caps, not with logs. Per-connection logging exists as a
      debugging option, but it is off by default in every config this
      project ships.<br/><br/>DNS lookups are resolved on the server. The
      DNS provider is the operator's choice (self-hosters often point it at
      a filtering DNS service); this project adds no logging on top of
      whatever is chosen.<br/><br/>The official site is served through
      Cloudflare. Like any CDN, it sees your IP address and the address of
      each request with it; how that data is handled is described in
      Cloudflare's own privacy policy.<br/><br/>None of this has to be
      taken on faith. It is all open source, and you can self-host at any
      time to control the whole stack yourself.
  security:
    title: Security
    body: >-
      Wisp carries every stream your browser would normally open over one
      WebSocket to the proxy server, where the real connections are made.
      In short, what that looks like:
    performance: >-
      Speed: Wisp sends site data as plain WebSocket frames, so pages stay
      fast.
    compatibility: >-
      Compatibility: open transports such as Libcurl keep the proxy working
      with a wide range of sites and services.
    censorship: >-
      Censorship resistance: the protocol is built so filters cannot easily
      see or block what you open.
    fingerprinting: >-
      Fingerprints: the reverse proxy setup randomizes rewrites, so
      sessions are harder to single out and the proxy is harder to block.
    encryption: >-
      Encryption: HTTPS sites stay end-to-end encrypted between you and
      them, and the Wisp connection itself uses wss:// (TLS) on the official
      site. Parts of the rewriting stack are still being built; this section
      grows as they land.
    transparency: >-
      Open source: everything above can be checked in the repository, and
      changes are public.
  advertising:
    title: Advertising
    body: >-
      Free domains show ads to cover hosting costs. Patreon instances are
      always ad-free. Ads are served by third-party networks: Adsterra,
      Adcash and Monetag. They only appear on InvisiProxy's own pages and
      loading screens, never inside the sites you browse through the
      proxy.<br/><br/>When an ad loads, its network receives your IP
      address, your user agent and the page you are on, and may set or read
      its own cookies. Their handling of your data follows their privacy
      policies, not this one.<br/><br/>An ad blocker stops all of this;
      uBlock Origin works, or use a Patreon instance.
  usage:
    title: What is stored on your device
    storage: >-
      Your settings, tabs and bookmarks live in your browser: cookies,
      localStorage, sessionStorage and IndexedDB. They never leave your
      device, and none of it is used for analytics.
    cookies: >-
      If you refuse cookies in your browser, features like tabs, bookmarks
      and the settings menu stop working, since there is nowhere to save
      them. Nothing is stored for tracking; only proxy functions rely on it
      (Scramjet caching and session state, tabs, bookmarks, autocomplete,
      tab cloak, icon presets, transport options, search engines, theming,
      language, window type, Tor routing, region swapping, hide ads,
      hidden history, block window leaks, block WebRTC and fingerprint
      randomization).
    serviceWorkers: >-
      A service worker sits between pages and the network; the proxy needs
      one to route traffic. Clearing the site's storage removes it again.
    consent: >-
      Using the site counts as accepting the storage above, plus the
      advertising partners' cookies where the law does not require your
      separate consent.
  changes:
    title: Changes
    body: >-
      This policy can change; the updated date at the top tells you when it
      last did. This page always states the current policy.
  contact:
    title: Contact
    body: >-
      Questions about this policy, or a data or privacy request: write to

