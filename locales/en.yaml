  ubuntu:
    title: Detailed Setup (Ubuntu Example)
    intro: >-
      You will need <code>Node.js 26.x</code>, <code>curl</code> and
      <code>git</code> installed; below is an example for Debian/Ubuntu setup.
    summary: Step-by-Step Guide
    mirrors: >-
      For simplicity sake you can join the TN discord at discord.gg/unblock and
      request for mirror site links (that are restocked and unblocked).
    hosting: Hosting
    hostingBody: >-
      If you wish to self-host however you will first need a VPS or hosting
      provider:
    dependencies: Dependencies
    dependenciesBody: >-
      You will then need to setup git, nginx (or caddy), Node.js and the
      finalwisp binary (the Wisp server). Here is an example for Ubuntu LTS:
    tor: Tor Support (Optional)
    configure: Configurating InvisiProxy
    configureBody: >-
      Most important options are production along with the obfuscation and DOM
      masquerading techniques.
    configureMore: 'From there just configure as needed:'
    run: Cloning and Running InvisiProxy
    runBody: >-
      Then run the respective process; the site starts under pm2 with our own
      workers/cache system, and manageWisp (the default) has the site process
      run the finalwisp instances itself:
    restart: Then of course if you used NGINX or caddy please restart/reload it
  config:
    title: Configuration
    server: Server Configuration Setup
    port: >-
      The default PORT for the proxy when started is
      <code>http://localhost:8080</code>. You can change the PORT (PORT env
      override) and other settings if needed in <code>./config.json</code>.
    local: >-
      Every other localized changes for source randomization, auto-minify, etc.
      are located in <code>./config.json</code>.
    options:
      minifyScripts: >-
        Automatically minify respective static assets upon starting the server.
      randomizeIdentifiers: >-
        Enable experimental proxy global randomization for Ultraviolet. This
        reduces the chances of UV being detected by any extension based filters.
      manageWisp: >-
        When true (the default) the site process starts and watches the finalwisp
        instances itself. Set it to false for the nginx + pm2 setup, where nginx
        routes Wisp to pm2-managed instances (see FINALWISP.md) and a site
        rebuild no longer drops Wisp sessions.
      dns: >-
        How the finalwisp instances resolve hostnames: resolve (the default)
        uses finalwisp's own resolver, lookup the system resolver, and a provider
        such as nextdns:xxx or xxx.dns.nextdns.io is queried directly.
      disguiseFiles: >-
        Enable DOM masquerading which obfuscates real the real content fetches
        for InvisiLTS. This is done through disguising requests, decompressing
        and then reconstructing the DOM tree.
      usingSEO: >-
        Enable Source Randomization which randomizes the source by swapping
        chunks of data specified in <code>./src/data.json</code>. Highly useful
        for masking keywords that will automatically flag or block InvisiProxy
        LTS as well as preventing source blocks.
      verbose: >-
        Enables compiling and building messages to see progress and possible
        issues while compiling.
      mirrorLinksFile: >-
        Server-only file used by the Links page dispenser, defaulting to
        <code>private/mirror-links.txt</code>. Relative paths are resolved from
        the project root; absolute paths are also supported. Use one HTTP(S) URL
        per line and keep the file outside <code>views/</code> so it is not
        publicly served. Restart the server after changing this setting.
      geoLanguage: >-
        Enables automatic language selection using Cloudflare's
        <code>CF-IPCountry</code> header. Only enable this behind Cloudflare,
        since the header can otherwise be set by anyone. Countries are listed
        per language under <code>language.countries</code> in each
        <code>./locales/*.yaml</code> file.
      singleLanguage: >-
        When <code>true</code>, only the language set in <code>language</code>
        is built and every visitor gets it, with the Language setting hidden.
        Useful for Docker or other deployments that only need one language,
        since builds are faster and smaller. Defaults to <code>false</code>.
      language: >-
        The language to build when <code>singleLanguage</code> is on, matching a
        file in <code>./locales/</code> (e.g. <code>en</code> for
        <code>en.yaml</code>). Defaults to <code>en</code>. For Docker, set this
        in <code>config.json</code> before running <code>docker build</code> or
        <code>docker compose build</code>, since languages are chosen at build
        time.
  translations:
    title: Translations
    crowdin: >-
      InvisiProxy LTS is translated on <crowdin>Crowdin</crowdin>, and anyone
      can help without needing to touch code. Join the project, choose a
      language and start translating. Finished translations are synced into
      <code>./locales/</code> automatically.
    rules: >-
      See <readme/> for the translation rules (placeholders, tags and masked
      terms). If your language isn't listed on Crowdin, open an issue or ask in
      the Discord.
  tor:
    title: Tor/Onion/SOCKS5 Routing Setup
    intro: >-
      You need to setup Tor (no GUI need/GUI is alright. With GUI replace port
      9050 with 9150) in order for the Onion Routing setting to work!
    guide: 'Simply host Tor using this guide:'
    cliGuide: 'Alternative Guide (for CLI):'
    body: >-
      If you are hosting InvisiProxy LTS on a VPS utilizing Ubuntu consider
      attaching Tor to systemctl for easier production management. Once Tor is
      up and running on either Linux or Windows it will work automatically with
      InvisiProxy LTS when enabled by the user via the Settings menu.
    customWisp: Users can also set their own Wisp server in Proxy Preferences.
    customProxy: >-
      If you wish to use a custom HTTP/HTTPS/SOCKS5 proxy to route traffic for
      Scramjet this is handled on the server in
      <code>./src/server/wisp.ts</code>.
  proxy:
    title: Proxy Configuration
    body: >-
      The primary location for tweaking any web proxy related settings assigned
      via the Settings menu is <code>./views/assets/js/register-sw.js</code>.
      Here you can modify the provided transport options set locally via a
      cookie, swap out SOCKS5 proxies, change Onion routing ports, specify a
      blacklist, and more.
    options:
      stockSW: >-
        The default service worker configuration file for Ultraviolet. For
        InvisiProxy however adblocking is automatically enabled so this is not
        used by default.
      blacklistSW: >-
        A modified version of Ultraviolet that allows for blacklisting domains
        and adblocking.
      proxyUrl: >-
        Specifies a SOCKS5/HTTPS/HTTP protocol URL defaulting to the default Tor
        proxy port. This can be swapped out with any valid port or SOCK5s proxy.
        This is done via the proxy option for both epoxy and libcurl.
      transports: >-
        Specifies any provided ports to be swapped via Bare-Mux and utilize
        Wisp.
      wispUrl: Modify the pathname or url handling for Wisp
      defaultMode: >-
        Specify the default transport used globally (can be swapped by the users
        still via the Settings menu)
      ScramjetController: >-
        This constructor allows you to swap out the prefix used for Scramjet
        dynamically and specify file locations. Note you may need to edit
        <code>./views/scram/scramjet.sw</code> when changing file names.
  navigation:
    title: Client Navigation Configuration
    body: >-
      The primary location for any client side navigation scripts is
      <code>./views/assets/js/common.js</code>. This file is primary used for
      Omnibox (Search Engine) functionality, swapping proxy options and other
      client settings.
    options:
      getDomain: >-
        This constant is used for specifying any subdomains to remove when
        appending a URL into the omnibox.
      goFrame: This specifies the stealth frame used for InvisiProxy LTS
      sx: >-
        This constant specifies the search engine you want to be proxied
        whenever a user types something in that isn't a URL
      search: These functions specify and parse the queries used for submitted URLs
      urlHandler: Used to set functions for the goProx object.
      goProx: >-
        This constant allows for the mapping of URL handling for specific
        proxies or links that need to fall under a web proxy.
      prSet: Attaches event listeners using goProx for any buttons or inputs needed
      huLinks: >-
        Automatically takes paths stated in <code>./views/assets/json</code> and
        appends them depending on the page and usage. This is used for hiding
        links that would lead to filter blocks and create an easier system for
        adding apps.
  structure:
    title: Structure
    summary: Web Pages
    info: Structure Information
    root:
      views: >-
        The physical site base of InvisiProxy goes here where static assets are
        served.
      src: For future implementation of obfuscation and keyword removing features.
    views: Details of <code>/views/</code>
    folders:
      dist: is used for minfied files. Created on build.
      pages: is used for the HTML for the site.
      assets: is used for storing various CSS, JS, image, and JSON files.
      scram: >-
        contains the respective local Scramjet implementation. Some files are
        overridden by the node module.
      uv: contains the UV implementation.
    scripts: Scripts located in <code>/views/assets/js/</code>
    files:
      card: adds a fancy visual effect to the box cards displayed on the welcome screen.
      common: >-
        is used on all pages and allows most site features to function such as
        autocomplete.
      csel: >-
        manages the settings menu, omnibox function and other additional
        features.
      loader: is used as an asset for DOM masquerading.
      registerSw: >-
        creates and manages service workers that allow Ultraviolet to function,
        and also uses bare transport.
