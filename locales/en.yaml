      Use the same steps above by running <code>pnpm install</code> in your
      repository and adding a <code>.gitignore</code> in your root directory
      specifying to exclude <code>node_modules</code>.
  faq:
    title: Detailed FAQ
    summary: Quick FAQ
    games: Where can I find the games for this repo? (404 errors, etc.)
    gamesBody: Please read over <games>here</games>.
    captcha: >-
      Why is the site I am on not working correctly or having CAPTCHA errors?
    captchaBody: >-
      Captcha support is spotty on all of the current proxies sadly. It is
      primarily supported by Scramjet. Therefore some sites may not work with
      any of the sites.
    badGateway: I am getting 502 errors. What do I do?
    badGatewayBody: >-
      When this happens you may either switch sites to fix the error or wait a
      bit. Sometimes clearing your cache can help.
    questions: >-
      If you still have any questions feel free to ask them in the discord
      linked here.
    domains: >-
      Why are official domains now numbered? Is this project maintained again?
    domainsBody: >-
      Yes, this project is active again for LTS support! However, the approach
      is now much simpler to ensure functionality: domain restocks as needed and
      a highly maintained source. More than ever, this project serves as a proof
      of concept for the brave souls willing to innovate in the web proxy
      service space.
  closing:
    summary: Former Closing Message (Original - 2022)
    announcement: >-
      This isn’t the greatest announcement sorry. After lots of thought and
      severe hesitation I’m shutting down Holy Unblocker and leaving TN. It's
      just been something that I’ve been super conflicted with for months hence
      the lack of updates and the massive gaps that happened last year. I just
      didn’t want to throw away a project that I passionately enjoyed and spent
      time on while making amazing friends and meeting epic devs here. I could
      go on forever for who these people are but ima like leave it here. They
      know who they are :D
    reasons: >-
      The main change of thought is that I’m finally just putting an end right
      now due to 1) the lack of motivation 2) the community is NOT the greatest
      at time and not the nicest at times (have to put that out here) 3) the
      future doesn’t look so good for HU/TN as a project.
    secrets: >-
      Some things I’ll be keeping secret since there are more reasons to this
      choice unless otherwise for those who don’t find this enough information.
      Good friends here will know that I’ve been super stressed about this
      choice for months now. Also regardless a good motivator for this choice is
      the fact that I’ll be graduating soon.
    future: >-
      It’s possible that I may continue/come back for this in the future or keep
      it on GitHub only. I leave this here because even now I am still doubting
      myself about this change. But for now I’d check out other proxy sites like
      Incognito (Duce DOES a ton of updates frequently and he is the
      creator/developer of Ultraviolet so give him some love) :yayy_hopi:
    patreon: >-
      Check out his Patreon also! For current HU patrons you will not be billed
      next month and the HU Patreon will be archived so head over to Duce’s
      patron so he can purchase more domains for Incognito.
    signoff: With love <3
