    gitignore: >-
      Now simply add the folder you cloned this repo in in VSC. Then run
      <code>pnpm install</code>. I recommend that if you are releasing this
      publically on GitHub that you add a <code>.gitignore</code> in your root
      directory with the following exclusions:
    deploy: >-
      Now you have your following workspace environment setup. To deploy the
      following workspace you just created you will need to look up depending
      on your hosting provider.
    gitpod: >-
      For an online IDE that you can use on your school computer and/or
      chromebook use GitPod. Basically the equivalent of Visual Studio Code but
      with in-browser support.
    gitpodAccount: 'Make an account:'
    gitpodFork: 'Fork this repo and enter in this URL to setup your workspace:'
