faq:
  meta:
    title: InvisiProxy 常见问题 | 网络错误、验证码和 YouTube 修复
    description: >-
      遇到网络错误、空白页面、验证码循环或 YouTube 无法加载？这里有 InvisiProxy 最常见问题的解决方法，以及登录网站是否安全的说明。
    social: >-
      网络错误、空白页面、验证码循环和 YouTube 播放问题的快速修复，以及关于 Discord 支持和安全登录的解答。
  title: 常见问题
  search: 搜索
  searchLabel: 搜索常见问题
  icons:
    question: 如何获取标签页伪装菜单所需的图标 URL？
    bookmarklet: >-
      前往你想获取图标的网站，然后使用这个书签小工具（将其拖到书签栏）：
    button: 查找图标 URL
    copy: >-
      复制书签小工具给出的 URL。然后返回 InvisiProxy，在设置中的图标 URL 处输入该 URL。尽情享用吧！
  networkError:
    question: >-
      每次使用代理时都出现"Network Error"或网站错误？
    answer: >-
      这是我们现代网页代理的已知问题。由于用户数量众多，标签页通常在约十分钟无活动后会断开连接。只需点击"刷新页面"按钮并重新加载页面即可解决。
    note: >-
      这通常发生在你第一次使用代理时。我们会在未来修复此问题。
  bot:
    question: >-
      网站认为我是机器人，导致我无法登录网站或查看内容。
    answer: >-
      在高峰时段这很常见，因为所有流量都只经过两个 IP。解决方法是通过"地区选择"切换地区，或启用 Tor 路由。你也可以加入我们的 Patreon，使用配备家庭宽带 ISP 的实例来避免此问题。
  unreachable:
    question: >-
      我遇到了类似这样的错误："'cdn.example.com' cannot be reached."
    answer: >-
      重新加载页面。如果第一次没有用，只需使用浏览器的后退按钮，或返回 Scramjet 页面再试一次。
  blank:
    question: 为什么我的网站只加载了一部分或完全空白？
    answer: >-
      并非所有网站都受支持。这是因为互联网极其广阔，网站使用着各种不同的技术和内容加载方式。如果你在某个特定网站上遇到问题，请在我们的 Discord 服务器或 GitHub 上报告。否则，可以尝试切换我们的代理选项，看看是否有其中一个支持该网站。
  idb:
    question: >-
      我遇到了与 IDB 数据库相关的错误（Scramjet V1 问题）
    answer: >-
      这通常发生在我们更新项目时。只需点击浏览器左上角的 (i) 图标（或锁形图标），然后选择"清除网站数据"或"Cookie 和网站数据 > 管理设备上的网站数据 > 垃圾桶图标"。这会清除 IndexedDB 数据库，让你可以重新使用代理。
  discord:
    question: 支持 Discord 吗？
    answer: 是的，支持 Discord。
    note: >-
      不过，免费代理存在一些限制。除非你是自托管或使用小型域名，否则请不要使用你的主账号。
  youtube:
    question: 为什么 YouTube 视频无法播放？
    answer: >-
      如果执行上述步骤后问题仍然存在，可能是实例暂时宕机了，尤其是当很多人都遇到同样的问题时。自托管不会出现此问题。
    tor: >-
      尝试选择"Tor"选项，这可能会解决问题，但会大幅降低加载速度。
  login:
    question: 登录网站安全吗？
    answer: >-
      是的，登录网站是安全的。不过，由于大量流量被路由到同一个域名，我们建议你不要登录不信任的网站，也不要使用个人账号。我们通过轮换 IP 来缓解这个问题，但在公共代理上不使用个人账号是一种常识。如果是自托管，则可以放心使用。你也可以加入 Patreon，使用家庭宽带 ISP 来避免此问题。
  captcha:
    question: >-
      为什么我所在的网站无法正常工作或出现验证码错误？
    answer: >-
      Scramjet 支持验证码，但需要多次尝试。原因是 Scramjet 往往速度太快，而验证码本身就很不稳定。解决方法就是不断尝试，直到验证通过为止。尽量不要操作得太快。
  youtubeBlank:
    question: >-
      在任何代理网站上使用 YouTube 时，为什么页面无法完全加载，或者视频一片白？
    answer: '有两种方法可以解决：'
    reload: >-
      出现上述错误时，正常重新加载页面应该就能加载视频。
    reloadFrame: >-
      或者，如果你在使用某种隐身模式，右键单击页面并选择<code>重新加载框架</code>。

privacy:
  title: 隐私政策
  subtitle: InvisiProxy，一款私密的网页代理服务。
  effective: '生效日期：2021-07-16'
  updated: '更新日期：2026-10-31'
  what:
    title: 什么是 InvisiProxy？
    body: >-
      InvisiProxy LTS 是一款网页代理服务，帮助你在浏览器内访问可能被网络、政府或政策封锁的网站，无需下载或设置。它以安全的方式实现这一点，并附带额外的隐私功能。在任何浏览器中浏览 Tor/Onion 网站、隐藏浏览活动并绕过过滤。这包括可能绕过政府的内容封锁、Chrome 扩展、本地客户端防火墙以及与网络相关的过滤器。<br/>本项目主要作为绕过审查的理想无客户端方案的概念验证。
  data:
    title: 是否收集任何数据？
    body: >-
      InvisiProxy 本身不会记录或收集你的浏览内容。为保护用户隐私，后端已禁用日志记录。唯一的例外是镜像链接按钮，它会在内存中保存你的 IP 地址几秒钟以防止滥用；该信息绝不会写入磁盘。含广告域名上的广告合作伙伴会收集他们自己的数据，详见下方"广告"部分。NextDNS 查询经过调整，不记录客户端 IP 或域名，并存储在瑞士。NextDNS 对相关数值的日志保留极少，仅用于确保服务顺利运行。鉴于本项目的规模，我们使用 Cloudflare 来提升性能并简化 DNS 管理。Cloudflare 的数值数据仅被最低限度地用于统计访问量和页面浏览量，以判断何时需要升级服务器。NGINX 被设置为不保存任何日志。InvisiProxy LTS 坚守终结网络审查的理念，同时重视用户隐私。除此之外，我们使用 Wisp 协议（用于代理 TCP 连接）配合 libcurl-transport，在 WebAssembly 中运行 SSL/TLS，实现端到端加密。本服务力求尽可能透明，请记住，你随时可以自行托管，确保一切都在你的掌控之中。<br/><br/>如果你希望提出隐私声明或请求，请通过 Discord 联系我们。
  security:
    title: 安全
    body: >-
      InvisiProxy LTS 从底层开始构建，旨在为用户提供安全可靠的网页代理服务。InvisiProxy LTS 背后的核心技术之一，是由 Mercury Workshop 开发的全新 Wisp 协议。<br/><br/>与以往的模型相比，该协议带来了多项创新功能和改进，提升了服务的速度和安全性。
    intro: >-
      Wisp 协议旨在满足现代网络流量需求，同时保持高安全标准。通过实现 Wisp，本项目获得了以下优势：
    performance: >-
      性能：Wisp 协议优化了 TCP 数据传输速度，确保用户在浏览时延迟最低。
    compatibility: >-
      兼容性：Wisp 与各种网页技术兼容，确保无缝访问各类网站和在线服务。这是通过支持遵循该协议的各种开源传输方式（Libcurl Transport）实现的。
    censorship: >-
      抗审查能力：该协议旨在绕过限制性网络所采用的复杂审查技术，让用户轻松访问被封锁的内容。
    fingerprinting: >-
      抗指纹识别：本项目在官方实例的反向代理配置中具备强大的抗指纹识别机制。这意味着代理被设计为尽量减少可用于追踪或识别用户的唯一标识符，从而增强隐私。通过遵循行业最佳实践并持续更新方法，用户可以匿名浏览，不留下可识别的痕迹。
    transparency: >-
      透明度：透明是 InvisiProxy LTS 的核心原则。本项目采用开源模式运营，社区可以审查代码库并做出贡献。这种开放性不仅建立了信任，还能通过社区反馈和协作实现持续改进。通过坚持透明的做法，InvisiProxy LTS 确保用户了解他们的数据如何被处理，以及有哪些保护隐私的措施。
    randomisation: >-
      源码/全局随机化：为了进一步增强安全性和隐私，InvisiProxy LTS 采用了源码和全局随机化。这让项目能在域名上更长时间不被封锁，同时提升浏览时的匿名性。普通网页代理在重写资源时会留下痕迹，而采用这种方法后，代理更难被检测和封锁。
    encryption: >-
      加密：InvisiProxy LTS 采用先进的代理技术，专注于端到端加密和安全的数据传输，特别是在 URL 重写代理方面。注意：这仍是一项进行中的大型工作，欢迎贡献。
    audits: >-
      定期审计：定期进行安全审计，以发现并修复潜在漏洞。
  advertising:
    title: 广告
    body: >-
      部分 InvisiProxy 域名会展示广告以支付托管费用。Patreon 实例始终无广告。广告由第三方广告网络投放：Adsterra、Adcash 和 Monetag。广告只会出现在 InvisiProxy 自己的页面和加载界面上，绝不会出现在你通过代理浏览的网站内部。<br/><br/>广告加载时，广告网络会获得你的 IP 地址、浏览器用户代理、你正在访问的域名以及类似的技术信息，并可能设置或读取其自身的 Cookie 或使用类似技术来展示广告、限制展示频率、衡量效果和防止欺诈。这些广告网络可能会在我们的页面上运行它们的代码；它们对你数据的处理受其各自的隐私政策约束，而非我们的。<br/><br/>你可以在 optout.aboutads.info 或 youronlinechoices.eu 选择退出许多广告网络。你也可以使用内容拦截器屏蔽广告，或使用 Patreon 实例。
  usage:
    title: 其他使用说明
    storage: >-
      InvisiProxy 使用"Cookie"、IndexedDB、localStorage 和 sessionStorage 来维持用户会话（详见下文），并在你的电脑上保存你的偏好设置。所有这些信息都保存在你的设备上，InvisiProxy 不会将其用于任何分析。广告合作伙伴可能会保存他们自己的 Cookie，详见"广告"部分。
    cookies: >-
      Cookie 是网站存储在访问者电脑上的一串信息，访问者每次返回时，浏览器都会将其提供给网站。InvisiProxy 使用 Cookie 来确保设置菜单的可用性，以及保存用户偏好。不希望在电脑上存储 Cookie 的用户，应在使用 InvisiProxy 网站前将浏览器设置为拒绝 Cookie，但这样做的缺点是，没有 Cookie、localStorage 或 IndexedDB 的帮助，InvisiProxy 的某些功能将无法正常运行。InvisiProxy 不会出于分析目的使用任何 Cookie、IndexedDB、localStorage 或 sessionStorage 功能；只有以下功能依赖它们在本地存储持久数据：Scramjet（缓存被代理的资源、会话状态等）、标签页、书签、自动补全（经代理）、设置菜单：标签页伪装、图标预设、传输方式选项、搜索引擎、主题、语言、窗口类型、Tor 路由、地区切换、隐藏广告、隐藏历史记录、阻止窗口泄漏、阻止 WebRTC 以及指纹随机化。
    serviceWorkers: >-
      此外，InvisiProxy 使用 Service Worker 作为我们网页代理的技术。它可以拦截相应的网络流量等，是本项目的核心功能。
    consent: >-
      在不更改 Cookie 设置的情况下继续浏览我们的网站，即表示你在法律不要求单独同意的范围内，确认并同意 InvisiProxy 使用 Cookie，以及上述广告合作伙伴使用的 Cookie。
  changes:
    title: 结语
    body: >-
      虽然大多数变更可能都很小，但 InvisiProxy 可能会不时更改其隐私政策，具体由 InvisiProxy LTS 自行决定。InvisiProxy LTS 鼓励访问者经常查看本页面，了解隐私政策的任何变化。在隐私政策变更后继续使用本网站，即表示你接受该变更。如遇滥用或 DDoS 攻击，InvisiProxy LTS 可能不得不临时记录数据，以缓解攻击并确保服务正常运行。在这种情况下，所有记录的数据将在攻击缓解后立即被安全删除。
  contact:
    title: 联系方式与致谢
    body: >-
      如果你对我们的隐私政策有任何疑问，请通过以下电子邮件联系我们：

docs:
  chemical: >-
    如果你想从零开始创建自己的网页代理服务，可以试试 <chemical>Chemical</chemical>。
  chemicalButton: 使用 Chemical 构建你的代理网站
  formerly: 前身为 Holy Unblocker LTS
  badges:
    ci: GitHub Actions 状态
    dockerVersion: Docker 镜像版本
    dockerPulls: Docker 拉取次数
  intro: >-
    <strong>InvisiProxy LTS</strong>（前身为 Holy Unblocker LTS）是一项实验性的网页代理服务，无论审查方式是客户端还是基于网络，都可以绕过网页过滤器或"拦截器"。这包括绕过政府的内容封锁、Chrome 扩展、本地客户端防火墙以及与网络相关的过滤器。本项目甚至可以让你通过一个网站，在任何浏览器（包括 Chromium）中浏览 Tor/Onion 网站！
  star: 给仓库点个 Star 来支持 InvisiProxy 吧！
  about: >-
    本项目主要作为绕过审查的理想无客户端方案的概念验证。一个很好的使用场景是：当你需要使用 Tor、在浏览时切换地区（或使用外部代理）、无需注册账号即可浏览网站（减少指纹识别）、绕过反广告拦截，以及/或尽量少留下设备活动痕迹时。只需在任意域名上托管本项目，就能拥有一个无需在设备上下载任何东西的 VPN 替代方案。作为安全的网页代理服务，它支持大量网站，更新频繁，并专注于易于自托管。InvisiProxy LTS 可用于大量网站，包括 YouTube、Gemini、ChatGPT、Discord、GeForce NOW 等！与其他网页代理相比，本项目在绕过网页过滤（DOM 伪装和源码随机化）以及各国的全局审查方面，还拥有不少独有功能。目前支持的国家有中国（GFW）和俄罗斯。
  users: >-
    自 2020 年以来已有超过 3000 万用户。非常感谢大家的支持，我从未想过网页代理社区会变得如此庞大。
  branches:
    current: '当前分支：Latest'
    title: 分支类型
    latest: Latest（master；面向 FOSS 和 SEO 构建）
    beta: Beta（待合并的更改；可能导致问题的更改）
    production: >-
      Production（v4、v5、v6；InvisiProxy LTS 的稳定版本。针对生产环境自托管的更改；最大化过滤规避和请求处理能力）
    switch: 自托管时请考虑切换到 Production 分支！
  selfHost: >-
    如果你想自行托管本项目，请查看<deploy>自部署选项</deploy>。无法使用任何免费选项部署？可以看看 Koyeb，或者考虑便宜的付费 VPS 托管方案。如果你不想自托管，请点击 InvisiProxy 上的镜像链接菜单。
  discord: "请务必加入 TitaniumNetwork 的 Discord 获取更多官方网站链接："
  caution:
    title: 注意
    body: >-
      如果你要自托管 InvisiProxy LTS，请切换到 PRODUCTION 分支，该分支会自动启用过滤规避功能。master 分支包含尚未准备好用于自托管的开发中更改。不过，如果你想为本项目做贡献，请向 master 分支提交 PR。
  tip:
    title: 提示
    body: >-
      InvisiProxy LTS 针对自托管进行了优化，为你提供最大的隐私控制权！fork 本仓库，也欢迎点个 Star。你可以使用免费或付费的部署选项进行自托管，或者将其部署在专用实例（VPS）上以获得更好的性能。
