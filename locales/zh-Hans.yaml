      复制书签小工具给出的 URL。然后返回 InvisiProxy，在设置中的图标 URL 处输入该 URL。尽情享用吧！
  networkError:
    question: >-
      每次使用时，我都会遇到“Network error”或站点错误。
    answer: >-
      这是我们现代网页代理的一个已知问题。由于用户量较大，标签页通常在没有活动十分钟后就会断开连接。只需点击“刷新页面”按钮并重新加载页面即可解决。
    note: >-
      这通常发生在你第一次使用代理时。我们会在未来修复此问题。
  bot:
    question: >-
      网站认为我是机器人，导致我无法登录网站或查看内容。
    answer: >-
      高峰期这种情况很常见，因为所有流量都只走两个 IP。解决办法是通过“区域选择”切换区域，或者开启 Tor 路由。你也可以加入我们的 Patreon，使用带有住宅 ISP 的实例来避开这个问题。
  unreachable:
    question: >-
      我遇到了类似这样的错误："'cdn.example.com' cannot be reached."
    answer: >-
      刷新页面。如果第一次不管用，直接用浏览器的返回按钮，或者回到 Scramjet 页面再试。
  blank:
    question: 为什么我的网站只加载了一部分或完全空白？
    answer: >-
      并非所有网站都能支持。原因很简单：网络世界广阔无垠，各种技术和内容加载方式千差万别。如果某个网站有问题，欢迎在 Discord 服务器或 GitHub 上反馈给我们。也可以试试切换不同的代理选项，看哪个能支持该网站。
  idb:
    question: >-
      我遇到了与 IDB 数据库相关的错误（Scramjet V1 问题）
    answer: >-
      这通常在我们更新项目时出现。点击浏览器左上角的 (i) 图标（或锁形图标），选择“清除网站数据”，或者依次点击“清除 Cookie 和网站数据 > 管理网站数据 > 垃圾桶图标”。这样就会清空 IndexedDB 数据库，代理也就能重新使用了。
  discord:
    question: 支持 Discord 吗？
    answer: 我们支持 Discord。
    note: >-
      不过免费代理也有一些限制。除非你是自托管，或者用的是小型部署，否则最好不要使用自己的主账号。
  youtube:
    question: 为什么 YouTube 视频无法播放？
    answer: >-
      如果按上面的步骤操作后问题依然存在，那可能是实例暂时宕机了--如果很多人也遇到同样的问题，就更是如此。自托管的话不会出现这种情况。
    tor: >-
      尝试选择"Tor"选项，这可能会解决问题，但会大幅降低加载速度。
  login:
    question: 登录网站安全吗？
    answer: >-
      是的，登录网站是安全的。不过我们建议，不要登录你不信任的网站，也尽量别用个人账号，因为大量流量都集中在一个域名上。我们会通过轮换 IP 来缓解这个问题，但公共代理上不用个人账号，本来就是常规操作。如果是自托管，就完全可以放心使用。你也可以加入 Patreon，使用住宅 ISP 来避开这个问题。
  captcha:
    question: >-
      为什么我所在的网站无法正常工作或出现验证码错误？
    answer: >-
      Scramjet 是支持验证码的，不过得反复试才行。原因在于 Scramjet 往往跑得太快，而验证码本身又时灵时不灵。解决办法就是一直尝试解验证码，直到成功。注意不要操作太快。
  youtubeBlank:
    question: >-
      在代理网站上用 YouTube 时，为什么页面加载不全，或者视频直接白屏？
    answer: '有两种方法可以解决：'
    reload: >-
      出现上述错误时，正常重新加载页面应该就能加载视频。
    reloadFrame: >-
      或者，如果你在使用某种隐身模式，右键单击页面并选择<code>重新加载框架</code>。

privacy:
  title: 隐私政策
  subtitle: InvisiProxy LTS，一个注重隐私的网页代理服务。
  effective: 生效日期：2021-07-16
  updated: 更新日期：2026-11-26
  what:
    title: 什么是 InvisiProxy？
    body: InvisiProxy LTS 是一款在浏览器中运行的网页代理。网站不再直连，而是经由代理打开，因此网络只会看到代理。被网络、学校或政府封锁的网站重新可达，Tor/Onion 网站也能在任何浏览器中打开。无需下载，无需安装。
  data:
    title: 收集哪些数据？
    body: InvisiProxy 不记录你的浏览。Wisp 服务器以关闭连接日志的方式启动：不记录地址，不记录目标，不生成记录。项目随附的 nginx 配置在代理路径上关闭了访问日志，任何请求日志都不会写入磁盘。<br/><br/>唯一的例外，仅存在于内存中：镜像链接按钮会记住你的地址五秒钟，以防止按钮被滥用。它永远不会写入磁盘，也不留记录。<br/><br/>攻击与洪泛由速率限制和连接上限处理，而不是靠日志。按连接的日志作为调试选项存在，但在本项目交付的每份配置中默认均为关闭。<br/><br/>DNS 查询在服务器上解析。DNS 供应商由运营者选择（自托管者常用带过滤的 DNS）；项目不会在其上再添加任何日志。<br/><br/>官方网站经由 Cloudflare 分发。与任何 CDN 一样，它会看到你的 IP 地址和每个请求的目标地址；这些数据的处理方式见 Cloudflare 自己的隐私政策。<br/><br/>这一切不必全凭信任。全部开源，你可以随时自托管，由自己掌控整套设施。
  security:
    title: 安全
    body: Wisp 把浏览器原本要开的每条流都通过一条 WebSocket 送到代理服务器，由它建立真正的连接。简要说：
    performance: 速度：Wisp 直接以 WebSocket 帧发送站点数据，页面保持快速。
    compatibility: 兼容性：Libcurl 等开放传输让代理与各类网站和服务保持兼容。
    censorship: 抗审查：协议的设计让过滤器难以看到、也难以封锁你访问的内容。
    fingerprinting: 指纹：反向代理对重写进行随机化，会话更难被单独识别，代理也更难被封禁。
    encryption: 加密：HTTPS 网站在你和它之间保持端到端加密；官方网站的 Wisp 连接本身使用 wss://（TLS）。重写栈的一部分仍在开发中，这一节会随之完善。
    transparency: 开源：以上全部都可在仓库中核查，变更公开。
  advertising:
    title: 广告
    body: 免费域名会展示广告以支付托管费用。Patreon 实例始终无广告。广告由第三方广告网络投放：Adsterra、Adcash、Monetag。广告只出现在 InvisiProxy 自己的页面和加载画面中，绝不出现在你经代理浏览的网站里。<br/><br/>广告加载时，其网络会收到你的 IP 地址、User-Agent 和所在页面，并可能写入或读取自己的 Cookie。其数据处理遵循各自的隐私政策，而非本政策。<br/><br/>广告拦截器可以停掉这一切；uBlock Origin 有效，或使用 Patreon 实例。
  usage:
    title: 存储在你设备上的内容
    storage: 你的设置、标签页和书签保存在浏览器里：Cookie、localStorage、sessionStorage 和 IndexedDB。它们不会离开你的设备，也完全不用于分析。
    cookies: 如果浏览器拒绝 Cookie，标签页、书签和设置菜单等功能将停止工作，因为没有地方可存。任何内容都不用于追踪；只有代理自身功能依赖它（Scramjet 缓存与会话状态、标签页、书签、自动补全、标签伪装、图标预设、传输选项、搜索引擎、主题、语言、窗口类型、Tor 路由、区域切换、隐藏广告、隐藏历史、阻止窗口泄漏、阻止 WebRTC 和指纹随机化）。
    serviceWorkers: Service Worker 位于页面与网络之间；代理需要它来转发流量。清除站点存储即会将其移除。
    consent: 继续使用本站即视为接受上述存储，以及在法律不要求另行同意处广告伙伴的 Cookie。
  changes:
    title: 变更
    body: 政策可能变化；顶部的更新日期标明最近一次改动。本页始终列出现行政策。
  contact:
    title: 联系方式
    body: 关于本政策的问题，或数据与隐私请求：请致函

rivacy:
  title: 隐私政策
  subtitle: InvisiProxy，一款私密的网页代理服务。
  effective: '生效日期：2021-07-16'
  updated: '更新日期：2026-10-31'
  what:
    title: 什么是 InvisiProxy？
    body: >-
      InvisiProxy LTS 是一款免安装、即开即用的网页代理服务，助你在浏览器内轻松突破各类网络限制、政策过滤与国家级审查。系统在设计上高度注重安全性与隐私保护，不仅能有效隐匿浏览活动、绕过 Chrome 扩展与本地客户端防火墙，还支持在任意浏览器中直接访问 Tor (.onion) 站点。<br/>本项目主要作为一个概念验证（PoC），旨在探索无客户端防审查方案的理想解法。
  data:
    title: 是否收集任何数据？
    body: >-
      InvisiProxy LTS 本身绝不会记录或收集你的任何浏览信息，后端已完全禁用日志记录以保障用户隐私。唯一的例外是镜像链接按钮：为了防止恶意滥用，系统仅在内存中将请求 IP 地址暂存数秒，且该信息绝不会写入任何磁盘。在广告支持域名上，第三方广告合作伙伴会按照下文"广告"部分所述自行收集必要的非敏感数据。NextDNS 查询托管于瑞士节点，已配置为不记录客户端 IP 或请求域名，仅保留极短时间的必要运行日志以维持服务稳定。本项目使用 Cloudflare 优化性能并简化 DNS 管理，Cloudflare 仅利用基础访问量与页面浏览量指标数据来评估服务器扩容需求。NGINX Web 服务器已严格设置为零日志模式。InvisiProxy LTS 珍视其终结网络审查的宗旨，同样高度重视用户隐私；在底层传输方面，系统采用 Wisp 协议代理 TCP 连接，并配合 libcurl-transport 直接在 WebAssembly 内运行 SSL/TLS 堆栈，实现真正的端到端加密。本服务始终力求公开透明，且你随时可以自行托管部署，将一切掌控在自己手中。<br/><br/>如果你有任何隐私方面的问询或请求，请通过 [Discord / 邮箱] 与我们联系。
  security:
    title: 安全
    body: >-
      InvisiProxy LTS 从零构建，致力于提供安全、可靠的网页代理体验。其底层核心技术之一，正是由 Mercury Workshop 推出的全新 Wisp 传输协议。<br/><br/>该协议带来了多项创新功能与增强，相比以往的模式，进一步提升了服务的速度与安全性。
    intro: >-
      Wisp 协议旨在应对现代网络流量的需求，同时保持高标准的安全性。通过采用 Wisp，本项目具备以下优势：
    performance: >-
      性能：Wisp 协议优化了 TCP 数据传输速度，确保用户在浏览时体验到最低延迟。
    compatibility: >-
      兼容性：Wisp 在设计上兼容多种网络技术，确保无缝访问各类网站和在线服务。这得益于对遵循该协议的各种开源传输层（Libcurl Transport）的支持。
    censorship: >-
      抗审查能力：该协议旨在绕过限制性网络采用的复杂审查技术，让用户轻松访问被封锁的内容。
    fingerprinting: >-
      抗指纹识别：本项目在官方实例的反向代理架构中内置了强大的抗指纹识别机制。这意味着该代理旨在尽可能减少可用于追踪或识别用户的唯一标识符，从而增强隐私保护。通过遵循行业最佳实践并持续更新相关方法，用户可以匿名浏览，而不留下可识别的痕迹。
    transparency: >-
      透明性：透明是 InvisiProxy LTS 的核心原则。本项目以开源模式运作，允许社区审查代码库并为其做出贡献。这种开放不仅有助于建立信任，还能通过社区反馈与协作实现持续改进。通过坚持透明的做法，InvisiProxy LTS 确保用户了解其数据如何处理，以及有哪些措施在保护他们的隐私。
    randomisation: >-
      源码/全局随机化：为进一步增强安全性与隐私保护，InvisiProxy LTS 采用了源码随机化与全局随机化。这使项目能够在域名上保持更长时间不被封锁，同时提升浏览时的匿名性。典型的网页代理在重写资源时总会留下痕迹，而采用这种方法后，代理被检测和封锁的难度大大提高。
    encryption: >-
      加密：InvisiProxy LTS 采用先进的代理技术，专注于端到端加密与安全数据传输，尤其是在 URL 重写代理的场景中。注意：这部分仍在大量开发中，欢迎参与贡献。
    audits: >-
      定期审计：定期进行安全审计，以发现并修复潜在漏洞。
  advertising:
    title: 广告
    body: >-
      部分 InvisiProxy 域名会展示广告以维持服务器托管成本，Patreon 赞助者的专享节点则始终保持完全无广告。广告均由第三方网络（Adsterra、Adcash 和 Monetag）投放，且仅会出现在 InvisiProxy 本身的页面与加载过渡页上，绝不会植入或干扰你通过代理浏览的任何目标网站。<br/><br/>广告加载时，相关广告网络会获取你的 IP 地址、浏览器 User-Agent、当前访问的域名及其他基础技术参数，并可能通过设置或读取自身的 Cookie 及类似技术来展示广告、控制频次、衡量投放效果与防范欺诈行为。上述广告网络可能会在我们的页面上运行其第三方代码，其对你数据的收集与处理将严格受其自身隐私政策约束，而不适用于本项目的隐私声明。<br/><br/>你可以使用 uBlock Origin 等内容拦截器屏蔽广告，或使用 Patreon 实例。
  usage:
    title: 其他使用说明
    storage: >-
      InvisiProxy 使用“Cookie”、IndexedDB、localStorage 和 sessionStorage 来维持用户会话（详见下文）并在你的电脑上存储你的偏好设置。所有这些信息都保留在你的设备上，InvisiProxy 不会将其用于任何分析用途。广告合作伙伴可能会按照“广告”部分所述存储其自身的 Cookie。
    cookies: >-
      Cookie 是网站存储在访客电脑上的一串信息，访客每次回访时，浏览器都会将其提供给该网站。InvisiProxy 仅使用 Cookie 及本地存储技术（包含 localStorage、IndexedDB 与 sessionStorage）来保存用户偏好设置并维持“设置”菜单的功能运行，绝不会出于任何分析或追踪目的存储此类数据。你可以将浏览器设置为拒绝 Cookie，但请注意，若缺少 Cookie、localStorage 或 IndexedDB 的支持，本站的某些关键功能将无法正常运作。相关本地存储仅用于在客户端持久化保存各项功能数据，包括：Scramjet 传输引擎（缓存代理资源与会话状态）、标签页、书签、代理自动补全，以及设置菜单中的标签页伪装、图标预设、传输选项、搜索引擎、主题、语言、窗口类型、Tor 路由、区域切换、隐藏广告、隐藏历史、窗口泄漏拦截、WebRTC 阻止与指纹随机化等。
    serviceWorkers: >-
      此外，InvisiProxy 使用 Service Worker 作为我们网页代理的技术。它可以拦截相应的网络流量等，是本项目的核心功能。
    consent: >-
      在不更改 Cookie 设置的情况下继续浏览我们的网站，即表示你在法律不要求单独同意的范围内，确认并同意 InvisiProxy 使用 Cookie，以及上述广告合作伙伴使用的 Cookie。
  changes:
    title: 结语
    body: >-
      InvisiProxy LTS 保留在无需事先通知的情况下随时修改本隐私政策的权利（大多数变更通常仅涉及细微调整）。我们建议访客定期查看本页面以获取最新的隐私政策；在本政策更新发布后，你继续使用本网站即视为同意并接受修改后的条款。此外，若遭受恶意滥用或 DDoS 流量攻击，InvisiProxy LTS 可能会临时开启必要的日志记录以缓解攻击并保障服务稳定运行。在此类情况下产生的任何临时数据，均会在攻击被成功拦截后立即安全彻底地删除。
  contact:
    title: 联系方式与致谢
    body: >-
      如果你对我们的隐私政策有任何疑问，请通过以下电子邮件联系我们：

docs:
  chemical: >-
    如果你想从零开始创建自己的网页代理服务，可以试试 <chemical>Chemical</chemical>。
  chemicalButton: 使用 Chemical 构建你的代理网站
  formerly: 前身为 Holy Unblocker LTS
  badges:
    ci: GitHub Actions 状态
    dockerVersion: Docker 镜像版本
    dockerPulls: Docker 拉取次数
  intro: >-
    <strong>InvisiProxy LTS</strong>（前身为 Holy Unblocker LTS）是一款实验性网页代理服务。无论是客户端级别的限制还是网络级别的审查，它都能轻松穿透--包括绕过国家级内容封锁、Chrome 管理扩展、本地防火墙及各类网络过滤。更强大的是，它甚至支持在任意浏览器（含 Chromium）中直接访问 Tor (.onion) 站点，这一切只需通过一个网页即可轻松实现！
  star: 给仓库点个 Star 来支持 InvisiProxy 吧！
  about: >-
    本项目主要作为一个概念验证（PoC），旨在探索无客户端防审查方案的理想解法。无论是需要访问 Tor 网络、浏览时切换区域（或使用外部代理）、实现无账号匿名浏览（降低指纹识别风险）、绕过反广告拦截，还是尽可能减少本地设备上的活动痕迹，InvisiProxy LTS 都能完美胜任。只需将其部署在任意域名上，即可获得一款无需下载安装任何软件的 VPN 替代方案。作为一款安全高效的网页代理，本项目保持高频更新，广泛兼容包括 YouTube、Gemini、ChatGPT、Discord 和 GeForce NOW 在内的各类主流平台，并提供极简的自托管体验。相比传统网页代理，InvisiProxy LTS 拥有多项独家技术--通过 DOM 伪装与源码随机化技术，轻松穿透局部网络过滤与国家级全局审查（目前已支持中国 GFW 与俄罗斯网络环境）。
  users: >-
    自 2020 年以来已有超过 3000 万用户。非常感谢大家的支持，我从未想过网页代理社区会变得如此庞大。
  branches:
    current: '当前分支：Latest'
    title: 分支类型
    latest: Latest（master；面向 FOSS 和 SEO 构建）
    beta: Beta（待合并的更改；可能导致问题的更改）
    production: >-
      Production（v4、v5、v6；InvisiProxy LTS 的稳定版本。针对生产环境自托管的更改；最大化过滤规避和请求处理能力）
