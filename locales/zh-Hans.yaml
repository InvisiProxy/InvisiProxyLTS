home:
  title: InvisiProxy LTS | 免费网页代理 - 突破过滤，访问被封网站
  description: >-
    InvisiProxy LTS 是一款前沿网页代理，帮你绕过网络过滤和封锁。无论客户端限制还是网络审查，都能在 Chromebook 等设备上顺畅访问被封网站，安全私密地上网。内容拦截、Chrome 扩展、防火墙，统统搞定 - 先进代理方案，让你一路畅通。
  ogDescription: >-
    InvisiProxy LTS 是一款顶级网页代理，轻松绕过网络与浏览器限制，安全访问被封网站。强劲的安全防护、丰富的高级功能，让你畅享顺滑上网体验。
  twitterDescription: >-
    认识 InvisiProxy LTS - 顶级网页代理，绕过审查与过滤，安全访问被封网站。私密浏览、突破网络限制，Chromebook 等设备上都能轻松搞定。

  headline: 终结网络审查。
  tagline: 隐私保护，触手可及
  browseNow: 立即上网
  bypassNow: 立即突破
  donate: 捐赠
  logoAlt: InvisiProxy 首页标志
  terminal:
    setup: 首次在生产分支上进行配置时...
    start: 或典型用途...
    dev:  用于开发时...

  free:
    title: InvisiProxy 是免费的。
    body: >-
      作为开源项目，你可以轻松 fork 本仓库并自行托管，完全掌控数据隐私。与其他网页代理不同，InvisiProxy 凭借端到端 TLS 加密、浏览隔离机制、Chromium 浏览器中的 Tor/Onion 路由、完全透明的代码架构及自主隐私控制脱颖而出。<strong>与大多数代理服务不同，我们的官方托管实例绝不收集任何用户数据 - 甚至连调试用途都不涉及。</strong><br/>我们的开源依赖项（Wisp、Libcurl 与 Epoxy）在设计上以安全和隐私为核心，确保即便在恶意托管的第三方实例上，你的浏览体验依然保持高度私密。

  fast:
    title: InvisiProxy 快速且高度先进。
    body: >-
      InvisiProxy 网页代理性能卓越、功能强大：全面支持 reCAPTCHA / Botguard 绕过、Tor 网络接入、SOCKS5 代理链、自定义黑名单、防泄漏机制与历史记录隔离；并通过 Scramjet + Wisp（基于 Libcurl 传输层）实现了极高的站点兼容性。相比之下，CroxyProxy、Proxium 等热门服务往往“治标不治本” - 即便重写了资源，请求依然存在泄漏风险，甚至埋下隐私隐患。此外，本项目还支持多级代理链，可将流量经由多个代理节点层层转发，让安全与匿名性再上一层楼。

  practical:
    title: InvisiProxy 实用性强。
    body: >-
      依托我们的源码随机化技术，以及 Proxy Transports、Wisp 和 Scramjet 等底层项目，InvisiProxy 能够提供无缝的访问体验，有效绕过国家级与运营商级的网络审查。无论是面对中国（GFW - 防火长城）还是俄罗斯等地的深度封锁，用户均<strong>无需下载任何客户端软件</strong>。整个代理体验完全在浏览器端（基于 Web）运行，配合我们的后端（或你自托管的后端），即便是面对最具侵入性的网络限制也能轻松穿透。没有任何下载门槛 - 只需在浏览器中输入 InvisiProxy 域名（若被封锁，可前往官网获取镜像），即可开启匿名浏览。

  heroSubtitle: 免费使用，完全透明
  designedWithPrivacy: 以隐私为核心设计<underline/>。

  overview:
    title: 概述
    body: >-
      InvisiProxy LTS 是一款实验性网页代理服务，能够轻松绕过客户端及网络层的各类过滤与封锁。无论是 Chrome 管理扩展、本地客户端防火墙，还是各国政府（如中国 GFW、俄罗斯等）设置的内容拦截与国家级网络审查，InvisiProxy LTS 都能提供顺畅、安全的穿透体验。
    donate: >-
      请考虑为这个项目捐款，让我们能够继续保持免费！我们提供每月更多域名、内测资格、个人专属域名以及优先功能请求。<br/>你可以在 Patreon 上捐款 <patreon>点此前往 Patreon</patreon>。
    patreonLabel: 在 Patreon 上捐款。
    imageAlt: Server Icon

  intent:
    title: 目的
    body: >-
      本项目主要作为一个概念验证，旨在探索绕过审查的理想无客户端方案。作为一款安全的网页代理服务，它支持众多网站，更新频繁，并在设计、机制和功能上精益求精。
    palette: >-
      本项目的配色方案采用 <nord>Nord 主题</nord> 构建，以获得最佳的设计配色，并优先保障代码语法与 UI 组件的可读性。
    imageAlt: File Code Icon

  usage:
    title: 用法
    body: >-
      前往 <browse>浏览</browse> 页面，选择其中一个推荐的代理！然后在搜索框中输入你想访问的网站。每个网页代理都有各自的效力、速度和安全性。推荐使用 Scramjet。<br/><br/>要解锁的示例网站：<code>https://youtube.com</code>
    imageAlt: Shield Icon

  apps:
    title: App
    body: >-
      InvisiProxy 汇集了一系列已预置链接的 App，包括 YouTube、Spotify、GeForce NOW、Discord、ChatGPT、Gemini 等！
    imageAlt: Application Icon

  hosting:
    title: 托管与部署指南 
    body: >-
      <strong>InvisiProxy LTS</strong> 是一款开源解决方案，在设计上注重模块化、易用性和便捷部署。主要功能包括广告拦截、灵活的源码生成以及高级代理导航。<br/><br/>如需完整的设置说明，请访问我们的官方 <github>GitHub 仓库</github> 或 <docs>此处内置的文档</docs>。
    docsTitle: 更多托管信息
    imageAlt: Hosting and Deployment Icon
    imageTitle: InvisiProxy LTS 的托管与部署

  contributing:
    title: 贡献指南
    body: >-
      <strong>InvisiProxy LTS</strong> 的蓬勃发展，离不开我们优秀贡献者的倾力付出。作为一个开源项目，<strong>InvisiProxy LTS</strong> 依靠社区的热情来绕过网络审查，帮助用户更好地获取信息。
    start: 想要开始贡献，请访问我们的 <github>GitHub 仓库。</github>
    imageAlt: Contributing Github Icon
    imageTitle: 在 GitHub 上为 InvisiProxy LTS 做贡献

  githubTitle: InvisiProxy LTS GitHub 仓库

  bypass:
    title: 绕过审查与过滤
    body: >-
      InvisiProxy LTS 是一款开源<strong>网页代理</strong>，致力于带来自由无界的网络体验。支持自由自托管，助你通过<strong>网页代理解封</strong>功能轻松突破中国（GFW 防火长城）、俄罗斯等严格的国家级网络审查。

  freeProxy:
    title: 100% 免费网页代理
    body: >-
      借助<strong>免费网页代理服务</strong>，轻松<strong>解锁网站</strong>与受限内容。无论是校园网还是职场过滤，InvisiProxy 都能轻松穿透，解锁一切限制，带来真正自由的无界网络体验。

  tor:
    title: 在 Chromium 与 Firefox 浏览器中启用 Tor 路由
    body: >-
      使用 InvisiProxy LTS，你可以直接在基于 Chromium/Firefox 的浏览器中<strong>访问 Tor 网络</strong>。这意味着你能在本网站内直接访问 <strong>.onion</strong> 站点。这让你能够匿名浏览网页（至少在一定程度上如此；真正的 Tor 拥有更好的指纹防护），绕过任何地区限制。本项目还支持设置自定义 SOCKS5 代理，以实现代理链。

  unrestricted: 免费畅享无限制浏览
  closing: 是时候，自由上网了。
  tryFree: 免费试用 InvisiProxy

