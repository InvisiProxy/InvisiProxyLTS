home:
  title: InvisiProxy LTS | 免费网页代理 - 绕过过滤并访问被封锁的网站
  description: >-
    InvisiProxy LTS 是一款前沿的网页代理服务，专为绕过网页过滤器和拦截器而设计。无论是客户端还是基于网络的审查，InvisiProxy LTS 都能让你在 Chromebook 等设备上无缝访问被封锁的网站，并进行安全、私密的浏览。借助我们先进的代理方案，轻松突破内容拦截器、Chrome 扩展、防火墙等限制。
  ogDescription: >-
    InvisiProxy LTS 是一款顶级网页代理服务，可绕过网络和浏览器限制，安全访问被封锁的网站。享受安全可靠、功能先进的无缝浏览体验。
  twitterDescription: >-
    了解 InvisiProxy LTS——一款出色的网页代理服务，可绕过审查和过滤，安全访问被封锁的网站。非常适合私密浏览，以及在 Chromebook 等设备上突破网络限制。

  headline: 终结网络审查。
  tagline: 隐私，触手可及。
  browseNow: 立即浏览
  bypassNow: 立即绕过
  donate: 捐赠
  logoAlt: InvisiProxy 主视觉标志
  terminal:
    setup: 在生产分支上首次部署时……
    start: 或日常使用……
    dev: 用于开发……

  free:
    title: InvisiProxy 是免费的。
    body: >-
      作为开源项目，你可以轻松 fork 本仓库并自行托管，以获得最大的隐私控制权。与众多其他网页代理服务不同，InvisiProxy 拥有基于 TLS 的端到端加密、浏览历史隔离、在 Chromium 浏览器中的 Tor/Onion 路由、完全透明以及隐私控制。<strong>与其他代理服务不同，我们的官方实例不收集任何用户数据，即使是出于调试目的也不会。</strong><br/>我们使用的开源依赖（Wisp、Libcurl 和 Epoxy）以安全和隐私为核心设计，即使面对恶意的自托管实例，也能确保你的浏览内容保持机密。

  fast:
    title: InvisiProxy 快速且高度先进。
    body: >-
      InvisiProxy 提供卓越的网页代理性能。它拥有强大的功能集，包括 reCAPTCHA/Botguard 支持、Tor 网络、SOCKS5 代理链、可自定义的黑名单设置、防泄漏、隐藏历史记录设置，以及通过 Scramjet + Wisp（搭配 Libcurl Transport）实现的广泛网站兼容性。CroxyProxy 或 Proxium 等其他热门服务往往只完成了一半的资源重写工作，会泄漏请求，还存在隐私隐患。本项目还支持代理链等功能，让你的流量经过多个代理转发，进一步提升安全性和匿名性。

  practical:
    title: InvisiProxy 很实用。
    body: >-
      借助我们的源码随机化，以及 Proxy Transports、Wisp 和 Scramjet 等项目，本项目可提供无缝体验，绕过网页、政府和网络层面的过滤。本项目可对抗中国（GFW——防火长城）、俄罗斯等地使用的过滤器，<strong>无需下载任何软件</strong>。这一切完全通过浏览器中的网站和我们的后端（自托管时则是你自己的后端）实现，让用户即使面对最严厉的审查封锁也能绕过。无需下载任何东西，只需输入 InvisiProxy 的域名即可；若被封锁，可前往 InvisiProxy 官方网站获取镜像，然后匿名浏览。

  heroSubtitle: 免费且透明，放心使用
  designedWithPrivacy: 以隐私为核心设计<underline/>。

  overview:
    title: 概述
    body: >-
      InvisiProxy LTS 是一项实验性的网页代理服务，无论审查方式是客户端还是基于网络，都可以绕过网页过滤器或"拦截器"。这包括绕过各国政府设置的内容封锁（中国/GFW、俄罗斯等）、Chrome 扩展、本地客户端防火墙以及与网络相关的过滤器。
    donate: >-
      请考虑为本项目捐赠，帮助我们保持免费！我们为支持者提供每月更多域名、Beta 测试资格、个人专属域名以及功能请求优先处理。<br/>你可以<patreon>在 Patreon 上捐赠</patreon>。
    patreonLabel: 在 Patreon 上捐赠
    imageAlt: 服务器图标

  intent:
    title: 宗旨
    body: >-
      本项目主要作为绕过审查的理想无客户端方案的概念验证。作为安全的网页代理服务，它支持大量网站，同时频繁更新，并注重设计、机制和功能上的细节。
    palette: >-
      本项目的配色方案基于 <nord>Nord Theme</nord> 构建，因其出色的设计配色，以及对代码语法和 UI 组件可读性的重视。
    imageAlt: 代码文件图标

  usage:
    title: 使用方法
    body: >-
      前往<browse>浏览</browse>页面，选择其中一个代理！然后在搜索框中输入你想访问的网站。每个网页代理在有效性、速度和安全性方面各有不同。推荐使用 Scramjet。<br/><br/>可解锁的网站示例：<code>https://youtube.com</code>
    imageAlt: 盾牌图标

  apps:
    title: 应用
    body: >-
      InvisiProxy 提供一系列预先链接好的应用，包括 YouTube、Spotify、GeForce NOW、Discord、ChatGPT、Gemini 等！
    imageAlt: 应用图标

  hosting:
    title: 托管与部署
    body: >-
      <strong>InvisiProxy LTS</strong> 是一个开源方案，在设计时就考虑了模块化、易用性和便捷部署。主要功能包括广告拦截、灵活的源码生成以及先进的代理导航。<br/><br/>如需完整的部署说明，请访问我们的官方 <github>GitHub 仓库</github>或<docs>此处提供的内置文档</docs>。
    docsTitle: 更多托管信息
    imageAlt: 托管与部署图标
    imageTitle: InvisiProxy LTS 的托管与部署

  contributing:
    title: 参与贡献
    body: >-
      <strong>InvisiProxy LTS</strong> 的蓬勃发展离不开众多优秀贡献者的倾力付出。作为开源项目，<strong>InvisiProxy LTS</strong> 依靠社区的热情来突破网络审查，帮助用户更好地获取信息。
    start: 想要开始贡献，请访问我们的 <github>GitHub 仓库。</github>
    imageAlt: GitHub 贡献图标
    imageTitle: 在 GitHub 上为 InvisiProxy LTS 做贡献

  githubTitle: InvisiProxy LTS GitHub 仓库

  bypass:
    title: 绕过审查与过滤
    body: >-
      InvisiProxy LTS 是一个开源的<strong>网页代理项目</strong>。借助我们先进的<strong>网页代理解锁</strong>功能，畅享不受限制的在线内容访问与浏览。本项目还让你能够在任何地方自行托管，并绕过像中国（防火长城——GFW）和俄罗斯这样的全国性或地区性封锁。

  freeProxy:
    title: 100% 免费网页代理
    body: >-
      使用我们的<strong>免费网页代理服务</strong>，帮助你<strong>解锁网站</strong>并访问受限内容。非常适合绕过学校和/或工作场所的过滤，本项目就是为了解锁一切而生。

  tor:
    title: 在 Chromium 浏览器和 Firefox 中使用 Tor 路由
    body: >-
      使用 InvisiProxy LTS，你可以直接在基于 Chromium 或 Firefox 的浏览器中<strong>访问 Tor 网络</strong>。这意味着你可以直接在本网站内访问 <strong>.onion</strong> 网站。这让你能够匿名浏览网页（至少在一定程度上；真正的 Tor 有更好的指纹防护），并绕过任何地区限制。本项目还支持设置自定义 SOCKS5 代理以组成代理链。

