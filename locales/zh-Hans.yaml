    可选用 The Freedom Project 开发的插件，修复浏览过程中出现的“undefined”等错误。
  experimentalSiteFixes: 实验性网站修复
  experimentalSiteFixesDescription: >-
    混合了多项手动站点兼容修复。可能导致网站出错并泄漏真实 IP，使用风险自负。
  hideHistoryDescription: 隐藏本地浏览记录。网络仍能嗅探浏览历史，但该历史已经过代理转发。
  randomizeFingerprint: 随机化浏览器指纹
  randomizeFingerprintDescription: >-
    每个标签页会话都会随机使用一个桌面浏览器，并为 canvas、WebGL、CPU 及内存读数添加噪声。手动选定的用户代理依然优先生效。可能影响部分网站的正常使用。
  proxyVersion: 代理版本
  proxyVersionDescription: >-
    Scramjet V3（Beta）为最新版本；若某些网站出现异常，可切换到 Scramjet 2.1.0。切换后会重新加载页面并重连标签页。
  customWisp: 自定义 Wisp 服务器
  customWispDescription: >-
    将代理流量经由你自己的 Wisp 服务器路由，以便更好地掌控隐私。若想通过自托管路由所有流量，这是一种轻量级方案。可继续使用此处的前端，只将相应流量导向你自己的服务器。留空则关闭此功能。
