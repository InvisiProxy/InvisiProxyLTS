      如果出现 IDB 数据库错误，请点击地址栏中的锁形图标，选择"网站设置"或"网站数据"，然后点击"清除网站数据"来清除你的网站数据
    cache: >-
      通过 Ctrl+Shift+R 清除浏览器或网站缓存。你也可以在 Invisi 的 设置 > 隐私 > 清除网站数据 中操作
    address: 确认你输入的地址正确无误
    maintenance: >-
      如果是网站维护或更新，请等待问题解决。
    censored: 确认服务器没有被你的网络审查（WebRTC 等）
    faq: 查看常见问题页面，了解特定网站的兼容性问题。
    github: 在 <github>Scramjet GitHub</github> 上排查该错误。
    engine: 在设置面板中尝试其他代理传输方式或地区。
  network: 刷新网络服务
  love: 用爱制作
