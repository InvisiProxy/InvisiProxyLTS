    body: >-
      InvisiProxy LTS 针对自托管进行了优化，让你最大程度掌控隐私！Fork 本仓库并考虑点个 Star。你可以使用免费或付费的部署方案进行自托管，或将其部署在独立实例（VPS）上以获得更佳性能。
