      简单起见，你可以通过 discord.gg/unblock 加入 TN 的 Discord，申请镜像网站链接（这些链接会定期补充且未被封锁）。
    hosting: 托管
    hostingBody: >-
      不过，如果你想自托管，首先需要一台 VPS 或一个托管服务商：
    dependencies: 依赖
    dependenciesBody: >-
      然后你需要安装 git、musl、nginx（或 caddy）和 Node.js。以下是 Ubuntu LTS 的示例：
    tor: Tor 支持（可选）
    configure: 配置 InvisiProxy
    configureBody: >-
      最重要的选项是 production，以及混淆和 DOM 伪装技术。
    configureMore: '之后按需配置即可：'
    run: 克隆并运行 InvisiProxy
    runBody: >-
      然后运行相应的进程；如果你在配置中将 production 设为 true，pm2 将与我们自己的 worker/缓存系统一起自动启用。
    restart: 当然，如果你使用了 NGINX 或 caddy，请重启/重新加载它
  config:
    title: 配置
    server: 服务器配置设置
    port: >-
      代理启动时的默认端口为 <code>http://localhost:8080</code>。如有需要，你可以在 <code>./ecosystem.config.js</code> 中更改端口和其他生产环境参数。
    local: >-
      其他所有本地化更改，如源码随机化、自动压缩等，都位于 <code>./config.json</code> 中。
    options:
      minifyScripts: >-
        在启动服务器时自动压缩相应的静态资源。
      randomizeIdentifiers: >-
        为 Ultraviolet 启用实验性的代理全局变量随机化。这可以降低 UV 被基于扩展的过滤器检测到的几率。
      production: >-
        使用预先配置好的生产环境方案进行服务器托管。自动设置缓存控制和源码重写。
      disguiseFiles: >-
        启用 DOM 伪装，混淆 InvisiLTS 真实的内容获取过程。具体做法是伪装请求、解压，然后重建 DOM 树。
      usingSEO: >-
        启用源码随机化，通过替换 <code>./src/data.json</code> 中指定的数据块来随机化源码。对于掩盖会自动标记或封锁 InvisiProxy LTS 的关键词以及防止源码封锁非常有用。
      verbose: >-
        启用编译和构建消息，以便在编译时查看进度和可能出现的问题。
      mirrorLinksFile: >-
        链接页面分发器使用的仅限服务器端的文件，默认为 <code>private/mirror-links.txt</code>。相对路径以项目根目录为基准解析，也支持绝对路径。每行一个 HTTP(S) URL，并将该文件放在 <code>views/</code> 之外，以免被公开访问。更改此设置后请重启服务器。
      geoLanguage: >-
        使用 Cloudflare 的 <code>CF-IPCountry</code> 请求头启用自动语言选择。仅在 Cloudflare 之后启用此功能，否则任何人都可以伪造该请求头。各语言对应的国家列在每个 <code>./locales/*.yaml</code> 文件的 <code>language.countries</code> 下。
      singleLanguage: >-
        设为 <code>true</code> 时，只构建 <code>language</code> 中设置的语言，所有访问者都会看到该语言，并隐藏语言设置。适用于 Docker 或其他只需要一种语言的部署，因为构建更快、体积更小。默认为 <code>false</code>。
      language: >-
        当 <code>singleLanguage</code> 开启时要构建的语言，对应 <code>./locales/</code> 中的一个文件（例如 <code>en</code> 对应 <code>en.yaml</code>）。默认为 <code>en</code>。对于 Docker，由于语言是在构建时选定的，请在运行 <code>docker build</code> 或 <code>docker compose build</code> 之前在 <code>config.json</code> 中设置。
  translations:
    title: 翻译
    crowdin: >-
      InvisiProxy LTS 在 <crowdin>Crowdin</crowdin> 上进行翻译，任何人都可以参与，无需接触代码。加入项目，选择一种语言即可开始翻译。完成的翻译会自动同步到 <code>./locales/</code>。
    rules: >-
      翻译规则（占位符、标签和屏蔽词）请参阅 <readme/>。如果 Crowdin 上没有你的语言，请提交 issue 或在 Discord 中询问。
  tor:
    title: Tor/Onion/SOCKS5 路由设置
    intro: >-
      你需要安装 Tor 才能让洋葱路由设置生效（无需图形界面，有图形界面也可以。使用图形界面时请将端口 9050 替换为 9150）！
    guide: '按照这份指南托管 Tor 即可：'
    cliGuide: '备选指南（命令行）：'
    body: >-
      如果你在使用 Ubuntu 的 VPS 上托管 InvisiProxy LTS，可以考虑将 Tor 挂载到 systemctl，便于生产环境管理。一旦 Tor 在 Linux 或 Windows 上运行起来，当用户在设置菜单中启用后，它就会自动与 InvisiProxy LTS 配合使用。
    customWisp: 用户也可以在代理偏好设置中设置自己的 Wisp 服务器。
    customProxy: >-
      如果你想使用自定义的 HTTP/HTTPS/SOCKS5 代理来转发 Scramjet 的流量，这是在服务器端的 <code>./src/server/wisp.ts</code> 中处理的。
  proxy:
    title: 代理配置
    body: >-
      调整通过设置菜单分配的网页代理相关设置的主要位置是 <code>./views/assets/js/register-sw.js</code>。在这里，你可以修改通过 Cookie 在本地设置的传输方式选项、替换 SOCKS5 代理、更改洋葱路由端口、指定黑名单等。
    options:
      stockSW: >-
        Ultraviolet 的默认 Service Worker 配置文件。不过 InvisiProxy 会自动启用广告拦截，因此默认不使用此文件。
      blacklistSW: >-
        Ultraviolet 的修改版本，支持域名黑名单和广告拦截。
      proxyUrl: >-
        指定一个 SOCKS5/HTTPS/HTTP 协议的 URL，默认为 Tor 的默认代理端口。可以替换为任何有效的端口或 SOCKS5 代理。这是通过 epoxy 和 libcurl 的 proxy 选项实现的。
      transports: >-
        指定通过 Bare-Mux 切换并使用 Wisp 的端口。
      wispUrl: 修改 Wisp 的路径名或 URL 处理方式
      defaultMode: >-
        指定全局使用的默认传输方式（用户仍可通过设置菜单切换）
      ScramjetController: >-
        通过这个构造函数，你可以动态替换 Scramjet 使用的前缀并指定文件位置。注意，更改文件名时可能需要编辑 <code>./views/scram/scramjet.sw</code>。
  navigation:
    title: 客户端导航配置
    body: >-
      客户端导航脚本的主要位置是 <code>./views/assets/js/common.js</code>。该文件主要用于地址栏（搜索引擎）功能、切换代理选项以及其他客户端设置。
    options:
      getDomain: >-
        该常量用于指定在将 URL 添加到地址栏时需要移除的子域名。
      goFrame: 指定 InvisiProxy LTS 使用的隐身框架
      sx: >-
        该常量指定当用户输入的内容不是 URL 时要经代理使用的搜索引擎
      search: 这些函数用于指定和解析所提交 URL 的查询
      urlHandler: 用于为 goProx 对象设置函数。
      goProx: >-
        该常量用于映射特定代理或需要经过网页代理的链接的 URL 处理方式。
      prSet: 使用 goProx 为所需的按钮或输入框绑定事件监听器
      huLinks: >-
        自动读取 <code>./views/assets/json</code> 中声明的路径，并根据页面和用途进行添加。用于隐藏会触发过滤封锁的链接，并让添加应用变得更简单。
  structure:
    title: 结构
    summary: 网页
    info: 结构说明
    root:
      views: >-
        InvisiProxy 的网站主体放在这里，静态资源由此提供。
      src: 用于将来实现混淆和关键词移除功能。
    views: <code>/views/</code> 的详细说明
    folders:
      dist: 用于存放压缩后的文件。构建时生成。
      pages: 用于存放网站的 HTML。
      assets: 用于存放各种 CSS、JS、图片和 JSON 文件。
      scram: >-
        包含本地的 Scramjet 实现。部分文件会被 node 模块覆盖。
      uv: 包含 UV 的实现。
    scripts: 位于 <code>/views/assets/js/</code> 的脚本
    files:
      card: 为欢迎页面上显示的卡片添加炫酷的视觉效果。
      common: >-
        在所有页面上使用，让自动补全等大多数网站功能得以运行。
      csel: >-
        管理设置菜单、地址栏功能以及其他附加功能。
      loader: 用作 DOM 伪装的资源。
      registerSw: >-
        创建并管理让 Ultraviolet 运行的 Service Worker，同时使用 bare transport。
  future:
    title: 未来计划
    body: <todo>这里</todo>是 InvisiProxy LTS 的待办事项清单（并不详尽）。
  beginners:
    title: 面向新手的外部代理与托管简要说明
    intro: 首先，你需要在本地或外部托管你的代理。
    hosting: '一些不错的托管选择：'
    current: 当前托管服务商
    paid: 付费
    freePaidDedicated: 免费、付费、独立服务器
    freeAndPaid: 免费和付费
    preference: >-
      在这些托管服务商中，Dedipath 和 Azure 是首选。你也可以自行托管。
    cloudflare: >-
      选好一台不错的 VPS 后，使用 Cloudflare 为网站和代理子域名配置 DNS 记录。
    dns: >-
      这是一个 DNS 记录示例。自托管时最好使用 <code>A 记录</code>。
    dnsAlt: DNS 记录
    root: >-
      <code>@</code> 和 <code>www.example.com</code> 用于 InvisiProxy LTS。
    subdomain: >-
      <code>a.example.com</code> 根据网站维护者的需要，用于 Libreddit 或 Invidious 等其他实例。
    local: >-
      如前所述，InvisiProxy 开箱即用地在本地托管 Scramjet 和 Ultraviolet，无需外部实例。
  domain:
    title: 域名步骤
    porkbun: >-
      如果你想获取高级域名（TLD），推荐使用 <porkbun>Porkbun</porkbun>，它的域名价格非常实惠。一个 <code>.org</code> 域名首年通常只要 5 美元左右。
  cloudflare:
    title: Cloudflare 步骤
    account: >-
      使用 Cloudflare（注册一个账号），添加你的网站，然后将各个 DNS 目标添加到 Cloudflare。请务必添加 Cloudflare 的域名服务器（Nameservers），这会在你添加网站时提供给你。
    records: >-
      请确保它们是 CNAME 记录（A 记录也可以），并尽量遵循以下结构：
    columns: 类型 | 名称 | 目标
    ip: 在此填写 VPS IP
    ssl: >-
      请确保强制使用 HTTPS，并将 SSL 设置为 Flexible（如果你不使用 LetsEncrypt）。否则可以将 SSL 设置为 Full。
  workspace:
    title: 工作区配置
    vsc: >-
      如果你有自己的设备，推荐使用 <vsc>Visual Studio Code</vsc>。这几乎是你能找到的最佳选择，当然这只是个人观点。另外，请确保你的电脑上安装了 <node>Node.JS</node>。
    fork: >-
      这部分不会讲得太深入，首先 fork 本仓库。然后根据你使用的操作系统，通过某种终端将其克隆到本地。请确保你已进入要进行设置的文件夹。
    gitignore: >-
      现在只需在 VSC 中添加你克隆仓库的文件夹。然后运行 <code>pnpm install</code>。如果你要在 GitHub 上公开发布，建议在根目录中添加一个 <code>.gitignore</code>，包含以下排除项：
    deploy: >-
      现在你的工作区环境已经设置好了。要部署你刚创建的工作区，需要根据你的托管服务商查阅相应方法。
    gitpod: >-
      如果需要一个能在学校电脑和/或 Chromebook 上使用的在线 IDE，可以使用 GitPod。它基本上就是支持在浏览器中使用的 Visual Studio Code。
    gitpodAccount: '注册账号：'
    gitpodFork: 'fork 本仓库，并输入以下 URL 来设置你的工作区：'
    gitpodSteps: >-
      按照上面相同的步骤，在你的仓库中运行 <code>pnpm install</code>，并在根目录中添加一个排除 <code>node_modules</code> 的 <code>.gitignore</code>。
  faq:
    title: 详细常见问题
    summary: 快速常见问题
    games: 在哪里可以找到这个仓库的游戏？（404 错误等）
    gamesBody: 请阅读<games>这里</games>。
    captcha: >-
      为什么我所在的网站无法正常工作或出现验证码错误？
    captchaBody: >-
      遗憾的是，目前所有代理对验证码的支持都不太稳定，主要由 Scramjet 支持。因此，有些网站可能在任何代理上都无法使用。
    badGateway: 我遇到了 502 错误，该怎么办？
    badGatewayBody: >-
      出现这种情况时，你可以切换网站来解决错误，或者稍等片刻。有时清除缓存也会有帮助。
    questions: >-
      如果你还有任何问题，欢迎在此处链接的 Discord 中提问。
    domains: >-
      为什么官方域名现在带有编号？这个项目又开始维护了吗？
    domainsBody: >-
      是的，本项目为了 LTS 支持再次活跃起来了！不过，为了确保功能正常，现在的方法简单多了：按需补充域名，并对源码进行高度维护。本项目比以往任何时候都更像是一个概念验证，献给那些敢于在网页代理服务领域创新的勇者。
  closing:
    summary: 以前的停运公告（原文 - 2022 年）
    announcement: >-
      抱歉，这不是什么好消息。经过反复思考和极度犹豫，我决定关闭 Holy Unblocker 并离开 TN。这件事让我纠结了好几个月，所以才会一直没有更新，去年也出现了很长的空档期。我只是不想放弃一个我热爱、投入了大量时间，并在这里结识了很棒的朋友和厉害的开发者的项目。我可以一直说下去这些人是谁，但就到此为止吧。他们自己知道是谁 :D
    reasons: >-
      想法转变的主要原因是，我终于决定现在就画上句号，因为：1）缺乏动力 2）社区有时并不是最好的，有时也不怎么友善（这点必须说出来） 3）HU/TN 作为项目的前景看起来并不乐观。
    secrets: >-
      这个决定还有其他原因，所以有些事情我会保密，除非有人觉得这些信息还不够。好朋友们都知道，这几个月来我一直为这个决定倍感压力。另外，我快毕业了，这也是促使我做出这个决定的一大原因。
    future: >-
      将来我可能会继续/回归，或者只把它保留在 GitHub 上。我写下这些，是因为即使到现在我仍然在怀疑这个决定。但目前我建议去看看其他代理网站，比如 Incognito（Duce 更新非常频繁，他也是 Ultraviolet 的作者/开发者，所以多支持他吧） :yayy_hopi:
    patreon: >-
      也去看看他的 Patreon 吧！现有的 HU 赞助者下个月将不会被扣费，HU 的 Patreon 将会归档，所以请转到 Duce 的 Patreon，让他能为 Incognito 购买更多域名。
    signoff: 满怀爱意 <3
  more:
    title: 更多信息
    maintained: >-
      本项目由 InvisiProxy LTS 团队维护，是 TitaniumNetwork 官方旗舰网页代理网站。
    website: 查看官方网站了解更多详情和致谢。
    sources: '网页代理来源：'
    sourcesBody: >-
      本项目目前使用遵循 Wisp 协议的 Scramjet 和 Ultraviolet 作为网页代理。Bare-Mux 用于切换配合 Wisp 使用的传输系统。内置的传输系统有 EpoxyTransport 和 libcurl-transport。
    wispProtocol: Wisp 协议
    merp: Merp（混淆模块）
    dnsBlocklists: hagezi DNS 屏蔽列表
    dependencies: '其他依赖：'
    mentions: '特别提及：'
    hostingProvider: 托管服务商
