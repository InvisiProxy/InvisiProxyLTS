  hideHistoryDescription: Dölj lokal webbhistorik. Nätverk kan fortfarande sniffa historiken, men den går via proxy.
  randomizeFingerprint: Slumpa webbläsarens fingeravtryck
  randomizeFingerprintDescription: >-
