    restart: Om du använde NGINX eller caddy, starta sedan om eller ladda om det
  config:
    title: Konfiguration
    server: Konfiguration av server
    port: >-
      Standardporten för proxyn när den startas är
      <code>http://localhost:8080</code>. Du kan ändra porten och andra
      produktionsvärden vid behov i <code>./ecosystem.config.js</code>.
    local: >-
      Alla andra lokala ändringar för källrandomisering, automatisk minifiering
      m.m. finns i <code>./config.json</code>.
    options:
      minifyScripts: >-
        Minifiera automatiskt respektive statiska tillgångar när servern
        startar.
      randomizeIdentifiers: >-
        Aktivera experimentell randomisering av proxyns globala variabler för
        Ultraviolet. Det minskar risken att UV upptäcks av tilläggsbaserade
        filter.
      production: >-
        Använd en förkonfigurerad produktionsuppsättning för serverhosting.
        Cachekontroll och omskrivning av källkod ställs in automatiskt.
      disguiseFiles: >-
        Aktivera DOM-maskering som döljer de riktiga innehållshämtningarna för
        InvisiLTS. Det sker genom att förklä förfrågningar, packa upp och sedan
        bygga upp DOM-trädet igen.
      usingSEO: >-
        Aktivera källrandomisering, som slumpar källan genom att byta ut
        datadelar som anges i <code>./src/data.json</code>. Mycket användbart för
        att maskera nyckelord som automatiskt flaggar eller blockerar
        InvisiProxy LTS, och för att förhindra blockering baserad på källkod.
      verbose: >-
        Visar kompilerings- och byggmeddelanden så att du kan följa förloppet
        och se eventuella problem under kompileringen.
      mirrorLinksFile: >-
        Serverfil som används av länkutdelaren på länksidan, med
        <code>private/mirror-links.txt</code> som standard. Relativa sökvägar
        utgår från projektets rot; absoluta sökvägar stöds också. Ange en
        HTTP(S)-URL per rad och håll filen utanför <code>views/</code> så att den
        inte blir offentligt tillgänglig. Starta om servern efter att du ändrat
        den här inställningen.
      geoLanguage: >-
        Aktiverar automatiskt språkval med Cloudflares
        <code>CF-IPCountry</code>-header. Aktivera bara bakom Cloudflare,
        eftersom headern annars kan sättas av vem som helst. Länder anges per
        språk under <code>language.countries</code> i varje
        <code>./locales/*.yaml</code>-fil.
      singleLanguage: >-
        När den är <code>true</code> byggs bara språket som anges i
        <code>language</code>, och alla besökare får det språket medan
        språkinställningen döljs. Användbart för Docker eller andra
        driftsättningar som bara behöver ett språk, eftersom byggen blir
        snabbare och mindre. Standard är <code>false</code>.
      language: >-
        Språket som byggs när <code>singleLanguage</code> är på, motsvarande en
        fil i <code>./locales/</code> (t.ex. <code>en</code> för
        <code>en.yaml</code>). Standard är <code>en</code>. För Docker, ange det i
        <code>config.json</code> innan du kör <code>docker build</code> eller
        <code>docker compose build</code>, eftersom språk väljs vid byggtid.
  translations:
    title: Översättningar
    crowdin: >-
      InvisiProxy LTS översätts på <crowdin>Crowdin</crowdin>, och vem som helst
      kan hjälpa till utan att röra koden. Gå med i projektet, välj ett språk och
      börja översätta. Färdiga översättningar synkas automatiskt till
      <code>./locales/</code>.
    rules: >-
      Se <readme/> för reglerna för översättning (platshållare, taggar och
      maskerade termer). Om ditt språk inte finns på Crowdin, skapa ett issue
      eller fråga i Discord.
  tor:
    title: Installation av Tor/Onion/SOCKS5-routing
    intro: >-
      Du behöver installera Tor (inget grafiskt gränssnitt behövs, men det går
      bra med. Med grafiskt gränssnitt, byt port 9050 mot 9150) för att
      inställningen för Onion-routing ska fungera!
    guide: 'Hosta bara Tor med den här guiden:'
    cliGuide: 'Alternativ guide (för CLI):'
    body: >-
      Om du hostar InvisiProxy LTS på en VPS med Ubuntu, överväg att koppla Tor
      till systemctl för enklare hantering i produktion. När Tor är igång på
      Linux eller Windows fungerar det automatiskt med InvisiProxy LTS när
      användaren aktiverar det i inställningsmenyn.
    customWisp: Användare kan också ange sin egen Wisp-server i Proxyinställningar.
    customProxy: >-
      Om du vill använda en egen HTTP/HTTPS/SOCKS5-proxy för att routa trafik
      för Scramjet hanteras det på servern i
      <code>./src/server/wisp.ts</code>.
  proxy:
    title: Proxykonfiguration
    body: >-
      Huvudplatsen för att justera webbproxyinställningar som tilldelas via
      inställningsmenyn är <code>./views/assets/js/register-sw.js</code>. Här
      kan du ändra överföringsmetoderna som sätts lokalt via en cookie, byta ut
      SOCKS5-proxyer, ändra portar för Onion-routing, ange en svartlista och
      mer.
    options:
      stockSW: >-
        Standardkonfigurationsfilen för service worker i Ultraviolet. I
        InvisiProxy är annonsblockering dock aktiverad automatiskt, så den här
        används inte som standard.
      blacklistSW: >-
        En modifierad version av Ultraviolet som gör det möjligt att svartlista
        domäner och blockera annonser.
      proxyUrl: >-
        Anger en URL med protokollet SOCKS5/HTTPS/HTTP, som standard Tors
        standardport för proxy. Den kan bytas mot valfri giltig port eller
        SOCKS5-proxy. Det görs via proxy-alternativet för både epoxy och
        libcurl.
      transports: >-
        Anger portar som ska bytas via Bare-Mux och använda Wisp.
      wispUrl: Ändra sökvägen eller URL-hanteringen för Wisp
      defaultMode: >-
        Anger standardöverföringsmetoden som används globalt (användarna kan
        fortfarande byta via inställningsmenyn)
      ScramjetController: >-
        Den här konstruktorn låter dig dynamiskt byta prefix som används för
        Scramjet och ange filplatser. Observera att du kan behöva redigera
        <code>./views/scram/scramjet.sw</code> när du byter filnamn.
  navigation:
    title: Konfiguration av klientnavigering
    body: >-
      Huvudplatsen för skript för klientnavigering är
      <code>./views/assets/js/common.js</code>. Filen används främst för
      adressfältets (sökmotorns) funktioner, byte av proxyalternativ och andra
      klientinställningar.
    options:
      getDomain: >-
        Den här konstanten anger vilka underdomäner som ska tas bort när en URL
        läggs till i adressfältet.
      goFrame: Anger den dolda ramen som används för InvisiProxy LTS
      sx: >-
        Den här konstanten anger vilken sökmotor som ska proxyas när en användare
        skriver något som inte är en URL
      search: De här funktionerna anger och tolkar frågorna för inskickade URL:er
      urlHandler: Används för att sätta funktioner för goProx-objektet.
      goProx: >-
        Den här konstanten mappar URL-hantering för specifika proxyer eller
        länkar som behöver gå via en webbproxy.
      prSet: Kopplar händelselyssnare med goProx till knappar eller inmatningsfält som behövs
      huLinks: >-
        Tar automatiskt sökvägar som anges i <code>./views/assets/json</code>
        och lägger till dem beroende på sida och användning. Det används för att
        dölja länkar som skulle leda till filterblockeringar och göra det enklare
        att lägga till appar.
  structure:
    title: Struktur
    summary: Webbsidor
    info: Strukturinformation
    root:
      views: >-
        Här ligger själva grunden för InvisiProxys sida, där statiska tillgångar
        serveras.
      src: För framtida implementering av obfuskering och borttagning av nyckelord.
    views: Detaljer om <code>/views/</code>
    folders:
      dist: används för minifierade filer. Skapas vid bygget.
      pages: används för sidans HTML.
      assets: används för att lagra olika CSS-, JS-, bild- och JSON-filer.
      scram: >-
        innehåller den lokala Scramjet-implementationen. Vissa filer skrivs över
        av node-modulen.
      uv: innehåller UV-implementationen.
    scripts: Skript i <code>/views/assets/js/</code>
    files:
      card: lägger till en snygg visuell effekt på korten som visas på välkomstskärmen.
      common: >-
        används på alla sidor och får de flesta funktioner att fungera, till
        exempel autokomplettering.
      csel: >-
        hanterar inställningsmenyn, adressfältets funktion och andra
        extrafunktioner.
      loader: används som tillgång för DOM-maskering.
      registerSw: >-
        skapar och hanterar service workers som får Ultraviolet att fungera, och
        använder även bare transport.
  future:
    title: Framtida tillägg
    body: <todo>Det här</todo> är vår (ofullständiga) att göra-lista för InvisiProxy LTS.
  beginners:
    title: Enkel förklaring för nybörjare om externa proxyer och hosting
    intro: Först vill du hosta dina proxyer lokalt eller externt.
    hosting: 'Lista över några bra hostingalternativ:'
    current: Nuvarande hostingleverantör
    paid: Betald
    freePaidDedicated: Gratis, betald, dedikerad
    freeAndPaid: Gratis och betald
    preference: >-
      Av hostingleverantörerna i listan föredrar vi Dedipath och Azure. Du kan
      också självhosta.
    cloudflare: >-
      När du har valt en bra VPS, använd Cloudflare för DNS-posterna för både
      sidan och underdomänerna för proxyerna.
    dns: >-
      Det här är ett exempel på DNS-poster. Självhosting kräver helst
      <code>A-poster</code>.
    dnsAlt: DNS-poster
    root: >-
      <code>@</code> och <code>www.example.com</code> används för InvisiProxy
      LTS.
    subdomain: >-
      <code>a.example.com</code> används för andra instanser som Libreddit eller
      Invidious beroende på vad sidans administratör behöver.
    local: >-
      Som nämnts tidigare hostas InvisiProxy lokalt med Scramjet och
      Ultraviolet direkt från start. Inga externa instanser behövs.
  domain:
    title: Domänsteg
    porkbun: >-
      Om du vill skaffa premiumdomäner (TLD:er), använd
      <porkbun>Porkbun</porkbun>, som erbjuder domäner till fantastiska priser.
      En <code>.org</code>-domän kostar bokstavligen runt $5 första året.
  cloudflare:
    title: Cloudflare-steg
    account: >-
      Använd Cloudflare (skapa ett konto), lägg till din sida och lägg sedan
      till dina olika DNS-mål i Cloudflare. Se till att du lägger till
      Cloudflares namnservrar, som du får när du lägger till din sida.
    records: >-
      Se till att de är CNAME, även om A-poster också fungerar, och försök följa
      den här strukturen:
    columns: Typ | Namn | Mål
    ip: VPS-IP HÄR
    ssl: >-
      Se till att HTTPS tvingas och att SSL är satt till Flexible (om du inte
      använder LetsEncrypt). Annars kan du sätta SSL till Full.
  workspace:
    title: Konfiguration av arbetsmiljö
    vsc: >-
      Om du har en egen enhet är <vsc>Visual Studio Code</vsc> att föredra.
      Ungefär det bästa alternativet som finns, men det är förstås en åsikt. Se
      också till att du har <node>Node.JS</node> installerat på din dator.
    fork: >-
      Vi går inte in för djupt på den här delen, men forka först repositoryt.
      Klona det sedan lokalt via en terminal av något slag beroende på vilket
      operativsystem du använder. Se till att du navigerar till mappen du vill
      sätta upp det i.
    gitignore: >-
      Lägg nu bara till mappen du klonade repot i i VSC. Kör sedan <code>pnpm
      install</code>. Om du publicerar det här offentligt på GitHub
      rekommenderar jag att du lägger till en <code>.gitignore</code> i
      rotmappen med följande undantag:
    deploy: >-
      Nu har du din arbetsmiljö uppsatt. För att driftsätta arbetsmiljön du just
      skapat behöver du kolla upp hur det görs hos din hostingleverantör.
    gitpod: >-
      För en online-IDE som du kan använda på skoldatorn och/eller en
      Chromebook, använd GitPod. I princip samma sak som Visual Studio Code fast
      i webbläsaren.
    gitpodAccount: 'Skapa ett konto:'
    gitpodFork: 'Forka repot och ange den här URL:en för att sätta upp din arbetsmiljö:'
    gitpodSteps: >-
      Följ samma steg som ovan genom att köra <code>pnpm install</code> i ditt
      repository och lägga till en <code>.gitignore</code> i rotmappen som
      utesluter <code>node_modules</code>.
  faq:
    title: Detaljerade vanliga frågor
    summary: Snabba frågor
    games: Var hittar jag spelen för det här repot? (404-fel m.m.)
    gamesBody: Läs <games>här</games>.
    captcha: >-
      Varför fungerar inte sidan jag är på korrekt, eller får CAPTCHA-fel?
    captchaBody: >-
      Tyvärr är CAPTCHA-stödet opålitligt på alla nuvarande proxyer. Det stöds
      främst av Scramjet. Därför kanske vissa sidor inte fungerar med någon av
      proxyerna.
    badGateway: Jag får 502-fel. Vad gör jag?
    badGatewayBody: >-
      När det händer kan du antingen byta sida för att lösa felet eller vänta en
      stund. Ibland hjälper det att rensa cachen.
    questions: >-
      Om du fortfarande har frågor, ställ dem gärna i Discord-servern som länkas
      här.
    domains: >-
      Varför är de officiella domänerna numrerade nu? Underhålls projektet igen?
    domainsBody: >-
      Ja, projektet är aktivt igen för LTS-stöd! Men tillvägagångssättet är nu
      mycket enklare för att säkerställa att allt fungerar: domäner fylls på vid
      behov och källkoden underhålls noga. Mer än någonsin är projektet ett
      "proof of concept" för de modiga själar som vill förnya
      webbproxy-världen.
  closing:
    summary: Tidigare avslutningsmeddelande (original - 2022)
    announcement: >-
      Det här är inte det roligaste beskedet, förlåt. Efter mycket funderande
      och stor tvekan lägger jag ner Holy Unblocker och lämnar TN. Det är något
      jag har varit väldigt kluven över i månader, därav bristen på
      uppdateringar och de stora luckorna förra året. Jag ville bara inte kasta
      bort ett projekt som jag brann för och lade tid på, och där jag fick
      fantastiska vänner och träffade grymma utvecklare. Jag skulle kunna hålla
      på hur länge som helst om vilka de är, men jag lämnar det här. De vet vilka
      de är :D
    reasons: >-
      Den främsta anledningen till att jag ändrat mig är att jag äntligen sätter
      punkt nu på grund av 1) brist på motivation 2) communityn är INTE alltid
      den bästa och inte alltid den trevligaste (det måste sägas) 3) framtiden
      ser inte så ljus ut för HU/TN som projekt.
    secrets: >-
      Vissa saker håller jag hemliga eftersom det finns fler skäl bakom beslutet,
      även för den som inte tycker att det här är tillräckligt med information.
      Goda vänner här vet att jag har varit superstressad över det här beslutet
      i flera månader. En stor bidragande orsak är också att jag snart tar
      examen.
    future: >-
      Det är möjligt att jag fortsätter/kommer tillbaka i framtiden eller bara
      behåller det på GitHub. Jag skriver det här eftersom jag fortfarande
      tvivlar på beslutet. Men tills vidare, kolla in andra proxysidor som
      Incognito (Duce uppdaterar VÄLDIGT ofta och är skaparen/utvecklaren av
      Ultraviolet, så ge honom lite kärlek) :yayy_hopi:
    patreon: >-
      Kolla in hans Patreon också! Nuvarande HU-patrons debiteras inte nästa
      månad och HU:s Patreon arkiveras, så gå över till Duces Patreon så att han
      kan köpa fler domäner till Incognito.
    signoff: Med kärlek <3
  more:
    title: Mer information
    maintained: >-
      Projektet underhålls av InvisiProxy LTS-teamet och är en officiell
      flaggskeppssida för webbproxy från TitaniumNetwork.
    website: Besök den officiella hemsidan för mer information och tack.
    sources: 'Källor för webbproxyer:'
    sourcesBody: >-
      Projektet använder för närvarande Scramjet och Ultraviolet som
      webbproxyer enligt Wispprotokollet. Bare-Mux används för att byta mellan
      överföringssystem som används med Wisp. De inkluderade
      överföringssystemen är EpoxyTransport och libcurl-transport.
    wispProtocol: Wispprotokollet
    merp: Merp (obfuskeringsmodul)
    dnsBlocklists: hagezi DNS-blocklistor
    dependencies: 'Andra beroenden:'
    mentions: 'Värda att nämna:'
    hostingProvider: Hostingleverantör
  meta:
    title: InvisiProxy Dokumentation | Självhosting, konfiguration och Tor
    description: >-
      Självhosta InvisiProxy: installera med pnpm, konfigurera i config.json,
      routa trafik genom Tor eller en SOCKS5-proxy och se vad varje beroende
      gör.
    social: >-
      Kör din egen InvisiProxy-instans. Täcker installation, config.json, Tor-
      och SOCKS5-routing och biblioteken som projektet bygger på.

apps:
  intro: >-
    Välj en sida nedan för att öppna den via proxyn. Undvik att logga in med
    dina huvudkonton eftersom det här är en offentlig proxytjänst. Vi
    rekommenderar att du skapar alternativa konton och aktiverar 2FA, eftersom
    vissa sidor lättar på begränsningarna då. Miljontals förfrågningar går
    genom ett fåtal IP-adresser, så vissa sidor kan blockera åtkomst.
  patreon: >-
    Överväg att gå med i vår <patreon>Patreon</patreon> om du vill att din
    trafik ska gå via en pålitlig hushållsleverantör (residential ISP) och med
    högre hastighet. Du kan också aktivera Tor-routing eller ändra
    regioninställningarna om du har problem. För att GeForce Now ska fungera,
    stäng av annonser i proxyinställningarna.
  faq: Se sidan <faq>Vanliga frågor</faq> om du har problem med proxyn.
  loading: Laddar applikationer…
  categories:
    all: Alla
    featured: Utvalda
    social: Socialt
    chat: Chatt
    video: Video
    music: Musik
    games: Spel
    ai: AI
    education: Utbildning
    opensource: Öppen källkod

partners:
  title: Partnertjänster
  intro: >-
    Utforska våra partnerprojekt. De körs via proxyn så att du kan använda dem
    här oblockerade.
  features: >-
    Våra partner erbjuder bland annat oblockerade spel, webbportar och
    emulering. Alla partner har öppen källkod och är gratis att använda. Gå
    gärna med i deras communityn och stöd dem om du kan. Alla har en liknande
    modell som InvisiProxy, så gå med i deras respektive Discord-servrar för
    fler länkar.

credits:
  title: Tack till
  intro: >-
    InvisiProxy LTS är en officiell webbproxy-tjänst som kan kringgå webbfilter
    oavsett om de finns i ett tillägg eller är nätverksbaserade.<br/>Det här
    projektet låter dig komma åt innehåll som annars blockeras av regeringar,
    skolor eller arbetsplatser.
  name: Namn
  contributions: Bidrag
  contact: Anteckningar och kontaktinfo
  iconAlt: ikon
  sections:
    developers: Huvudutvecklare
