  moreSettings: Visa fler inställningar
  anotherLink: Behöver du en annan länk? Klicka på <mirrors>knappen för spegellänkar</mirrors>.

faq:
  meta:
    title: InvisiProxy Vanliga frågor | Nätverksfel, CAPTCHAs och YouTube-fixar
    description: >-
      Nätverksfel, tomma sidor, CAPTCHA-loopar eller laddar inte YouTube? Lösningar
      på de vanligaste problemen med InvisiProxy, och om det är säkert att logga
      in på sidor.
    social: >-
      Snabba lösningar på nätverksfel, tomma sidor, CAPTCHA-loopar och
      YouTube-uppspelning, plus svar om Discord-stöd och säker inloggning.
  title: Vanliga frågor
  search: Sök
  searchLabel: Sök bland vanliga frågor
  icons:
    question: Hur får jag ikon-URL:er till menyn för att maskera fliken?
    bookmarklet: >-
      Gå till hemsidan du vill ha ikonen från och använd det här bokmärket (dra
      det till ditt bokmärkesfält):
    button: Hitta ikon-URL
    copy: >-
      Kopiera URL:en som bokmärket ger dig. Gå sedan tillbaka till InvisiProxy
      och skriv in URL:en som ikon-URL i inställningarna. Klart!
  networkError:
    question: >-
      Jag får "Network Error" eller sidfel varje gång jag använder proxyn?
    answer: >-
      Det här är ett känt problem med våra moderna webbproxyer. På grund av hur
      många användare vi har bryts anslutningen oftast efter tio minuter utan
      aktivitet i fliken. Klicka bara på knappen Uppdatera sidan och ladda om
      sidan för att lösa problemet.
    note: >-
      Det här brukar hända första gången du använder proxyn. Vi har en framtida
      fix för det.
  bot:
    question: >-
      Jag har problem med att logga in på sidor eller se innehåll eftersom
      sidan tror att jag är en bot.
    answer: >-
      Under tider med hög trafik är det här väldigt vanligt eftersom all trafik
      går genom bara två IP-adresser. Lösningen är att byta region via Välj
      region eller aktivera Tor-routing. Du kan också gå med i vår Patreon för
      att få tillgång till en instans med hushållsleverantör (residential ISP)
      och slippa problemet.
  unreachable:
    question: >-
      Jag får ett fel som liknar: "'cdn.example.com' cannot be reached."
    answer: >-
      Ladda om sidan. Om det inte funkar första gången, använd webbläsarens
      tillbaka-knapp eller gå tillbaka till Scramjet-sidan och försök igen.
  blank:
    question: Varför laddar min sida bara delvis eller är helt tom?
    answer: >-
      Alla sidor stöds inte. Det beror helt enkelt på att webben är enorm och
      sidor använder många olika tekniker och sätt att ladda innehåll. Om du har
      problem med en viss sida, rapportera det i vår Discord-server eller på
      GitHub. Testa annars våra olika proxyalternativ för att se om något av dem
      stödjer sidan.
  idb:
    question: >-
      Jag får ett fel som har med IDB-databasen att göra (problem i Scramjet V1)
    answer: >-
      Det här brukar hända när vi uppdaterar projektet. Klicka bara på
      (i)-ikonen uppe till vänster i din webbläsare (eller låssymbolen) och välj
      "Rensa webbplatsdata" eller "Cookies och webbplatsdata > Hantera data på
      enheten > Papperskorgsikonen". Det här rensar IndexedDB-databasen och
      låter dig använda proxyn igen.
  discord:
    question: Stöds Discord?
    answer: Ja, Discord stöds.
    note: >-
      Dock finns det vissa begränsningar med gratisproxyerna. Använd inte ditt
      huvudkonto om du inte självhostar eller använder en liten domän.
  youtube:
    question: Varför funkar inte YouTube-videor?
    answer: >-
      Om du fortfarande har problem efter stegen ovan kan instansen vara nere
      tillfälligt, särskilt om många andra har samma problem. Det här händer
      inte om du självhostar.
    tor: >-
      Testa att välja alternativet "Tor", det kan lösa problemet men gör
      laddningen mycket långsammare.
  login:
    question: Är det säkert att logga in på sidor?
    answer: >-
      Ja, det är säkert att logga in på sidor. Vi rekommenderar dock att du inte
      loggar in på sidor du inte litar på och inte använder personliga konton,
      eftersom så mycket trafik går genom en enda domän. Vi försöker minska
      problemet genom att rotera IP-adresser, men det är helt enkelt praxis att
      inte använda personliga konton på offentliga proxyer. Om du självhostar
      kan du däremot göra det utan problem. Du kan också gå med i vår Patreon för
      att använda en hushållsleverantör och slippa problemet.
  captcha:
    question: >-
      Varför fungerar inte sidan jag är på korrekt, eller får CAPTCHA-fel?
    answer: >-
      CAPTCHA-stöd fungerar med Scramjet men kräver några försök. Anledningen
      är att Scramjet ofta helt enkelt är för snabb, och CAPTCHAs är av naturen
      opålitliga. Lösningen är att fortsätta lösa CAPTCHAn tills det funkar.
      Försök att inte gå för snabbt fram.
  youtubeBlank:
    question: >-
      Varför laddar inte sidan helt eller är videon bara vit när jag använder
      YouTube på någon av proxysidorna?
    answer: 'Det finns två sätt att lösa det:'
    reload: >-
      Att ladda om sidan som vanligt när felet ovan inträffar bör få videon att
      laddas.
    reloadFrame: >-
      Eller högerklicka på sidan och välj <code>Läs in ramen igen</code> om du
      använder någon form av smygläge.

privacy:
  title: Integritetspolicy
  subtitle: InvisiProxy, en privat webbproxy-tjänst.
  effective: 'Gäller från: 2021-07-16'
  updated: 'Uppdaterad: 2026-10-31'
  what:
    title: Vad är InvisiProxy?
    body: >-
      InvisiProxy LTS är en webbproxy-tjänst som hjälper dig att komma åt sidor
      som kan vara blockerade av ditt nätverk, din regering eller av policyer,
      direkt i webbläsaren utan nedladdning eller installation. Det sker säkert
      och med extra integritetsfunktioner. Besök Tor/Onion-sidor i vilken
      webbläsare som helst, dölj din surfaktivitet och kringgå filter. Det
      inkluderar möjligheten att kringgå innehållsblockeringar från regeringar,
      Chrome-tillägg, lokala brandväggar på klientsidan och nätverksrelaterade
      filter.<br/>Det här projektet är främst ett "proof of concept" för den
      ideala klientlösa metoden att kringgå censur.
  data:
    title: Samlas någon data in?
    body: >-
      InvisiProxy själv loggar eller samlar inte in din surfning. Loggning är
      avstängd på backend för att skydda användarnas integritet. Det enda
      undantaget är knappen för spegellänkar, som håller din IP-adress i minnet
      i några sekunder för att stoppa missbruk; den skrivs aldrig till disk.
      Annonspartner på domäner med annonser samlar in sin egen data, enligt
      beskrivningen under Annonser nedan. NextDNS-förfrågningar är inställda på
      att inte logga klienters IP-adresser eller domäner och lagras i Schweiz.
      NextDNS lagrar loggar för respektive numeriska värden minimalt och enbart
      för att tjänsten ska fungera smidigt. Cloudflare används i projektet för
      bättre prestanda och enklare DNS-hantering med tanke på projektets
      omfattning. Cloudflares numeriska värden används i minsta möjliga mån för
      att räkna besök och sidvisningar, så att vi vet när servrarna behöver
      uppgraderas. NGINX är inställt på att inte spara några loggar.
      InvisiProxy LTS står fast vid sitt mål att stoppa internetcensuren och
      värdesätter användarnas integritet. Utöver det används Wisp-protokollet
      (för att proxya TCP-anslutningar) tillsammans med libcurl-transport för
      end-to-end-kryptering genom att köra SSL/TLS inuti WebAssembly. Tjänsten
      är gjord för att vara så transparent som möjligt, och kom ihåg att du kan
      självhosta när som helst för att ha kontroll över allt.<br/><br/>Om du har
      synpunkter eller förfrågningar kring integritet, kontakta oss gärna via
      Discord.
  security:
    title: Säkerhet
    body: >-
      InvisiProxy LTS är byggt från grunden för att ge användarna en säker och
      pålitlig webbproxy-tjänst. En av de centrala teknikerna bakom InvisiProxy
      LTS är det nya Wispprotokollet, utvecklat av Mercury
      Workshop.<br/><br/>Protokollet för med sig flera innovativa funktioner och
      förbättringar som bidrar till tjänstens hastighet och säkerhet jämfört med
      tidigare modeller.
    intro: >-
      Wispprotokollet är designat för att hantera modern webbtrafik och samtidigt
      upprätthålla höga säkerhetsstandarder. Genom att implementera Wisp drar
      projektet nytta av följande fördelar:
    performance: >-
      Prestanda: Wispprotokollet optimerar hastigheten för TCP-dataöverföring så
      att användarna upplever minimal latens när de surfar.
    compatibility: >-
      Kompatibilitet: Wisp är byggt för att fungera med en lång rad
      webbtekniker, vilket ger sömlös åtkomst till olika sidor och
      onlinetjänster. Det möjliggörs av stöd för olika överföringsmetoder med
      öppen källkod som följer protokollet (Libcurl Transport).
    censorship: >-
      Motståndskraft mot censur: Protokollet är designat för att kringgå
      sofistikerade censurmetoder som används av restriktiva nätverk, så att
      användare enkelt kan komma åt blockerat innehåll.
    fingerprinting: >-
      Fingeravtrycksresistens: Projektet har starka mekanismer mot fingeravtryck
      i sin reverse proxy-uppsättning för officiella instanser. Det betyder att
      proxyn är designad för att minimera de unika identifierare som kan
      användas för att spåra eller identifiera användare, vilket stärker
      integriteten. Genom att följa branschens bästa praxis och hela tiden
      uppdatera metoderna kan användare surfa anonymt utan att lämna
      identifierbara spår.
    transparency: >-
      Transparens: Transparens är en av de viktigaste principerna för
      InvisiProxy LTS. Projektet drivs med öppen källkod, vilket låter
      communityn granska och bidra till koden. Den här öppenheten skapar inte
      bara förtroende, utan gör också att projektet ständigt kan förbättras
      genom feedback och samarbete från communityn. Genom att vara transparent
      ser InvisiProxy LTS till att användarna vet hur deras data hanteras och
      vilka åtgärder som finns för att skydda deras integritet.
    randomisation: >-
      Källrandomisering/global randomisering: För att ytterligare förbättra
      säkerhet och integritet använder InvisiProxy LTS källrandomisering och
      global randomisering. Det låter projektet förbli oblockerat längre på
      domäner och förbättrar dessutom anonymiteten när du surfar. Vanliga
      webbproxyer lämnar spår efter sig när de skriver om tillgångar, men med
      den här metoden är det mycket svårare att upptäcka proxyn och blockera
      den.
    encryption: >-
      Kryptering: InvisiProxy LTS använder avancerade proxytekniker med fokus på
      end-to-end-kryptering och säker dataöverföring, särskilt för proxyer som
      skriver om URL:er. OBS: Det här är fortfarande ett stort "work in
      progress" och vi tar gärna emot bidrag.
    audits: >-
      Regelbundna granskningar: Vi genomför regelbundna säkerhetsgranskningar
      för att hitta och åtgärda potentiella sårbarheter.
  advertising:
    title: Annonser
    body: >-
      Vissa InvisiProxy-domäner visar annonser för att täcka hostingkostnader.
      Patreon-instanser är alltid annonsfria. Annonserna levereras av
      tredjepartsnätverk: Adsterra, Adcash och Monetag.
      Annonser visas bara på InvisiProxys egna sidor och laddningsskärmar,
      aldrig inuti sidorna du besöker via proxyn.<br/><br/>När en annons laddas
      tar nätverket emot din IP-adress, webbläsarens user agent, domänen du
      besöker och liknande tekniska uppgifter, och kan sätta eller läsa sina
      egna cookies eller använda liknande tekniker för att visa annonser,
      begränsa hur ofta du ser dem, mäta resultat och förhindra bedrägerier.
      Nätverken kan köra sin kod på våra sidor; hur de hanterar dina uppgifter
      styrs av deras egna integritetspolicyer, inte vår.<br/><br/>Du kan välja
      bort många annonsnätverk på optout.aboutads.info eller
      youronlinechoices.eu. Du kan också
      blockera annonser med en innehållsblockerare, eller använda en
      Patreon-instans.
  usage:
    title: Övrig användning
    storage: >-
      InvisiProxy använder "cookies", IndexedDB, localStorage och sessionStorage
      för att upprätthålla en användarsession (beskrivs närmare nedan) och spara
      dina inställningar på din dator. All den här informationen stannar på din
      enhet och InvisiProxy använder ingen av den för analys. Annonspartner kan
      spara sina egna cookies, enligt beskrivningen under Annonser.
    cookies: >-
      En cookie är en textsträng med information som en webbplats lagrar på
      besökarens dator, och som besökarens webbläsare skickar till webbplatsen
      varje gång besökaren återkommer. InvisiProxy använder cookies för att
      säkerställa att inställningsmenyn fungerar och för användarens
      preferenser. Om du inte vill ha cookies på din dator bör du ställa in din
      webbläsare att neka cookies innan du använder InvisiProxys webbplatser,
      med nackdelen att vissa funktioner i InvisiProxy INTE kommer att fungera
      ordentligt utan cookies, localStorage eller IndexedDB. Inga cookies,
      IndexedDB, localStorage eller sessionStorage används för analys av
      InvisiProxy; endast följande funktioner använder dem för att lagra
      beständig data lokalt: Scramjet (cachning av proxyade tillgångar,
      sessionstillstånd m.m.), flikar, bokmärken, autokomplettering (proxyad),
      inställningsmenyn: Tab Cloak, förinställda ikoner, överföringsmetoder,
      sökmotorer, teman, språk, fönstertyp, Tor-routing, byte av region, dölj
      annonser, dold historik, blockera fönsterläckor, blockera WebRTC och
      slumpade fingeravtryck.
    serviceWorkers: >-
      Dessutom använder InvisiProxy Service Workers som teknik för våra
      webbproxyer. Det gör det möjligt att fånga upp respektive nätverkstrafik
      m.m. och är en central funktion i projektet.
    consent: >-
      Genom att fortsätta använda vår webbplats utan att ändra dina
      cookieinställningar bekräftar och godkänner du InvisiProxys användning av
      cookies och de ovan beskrivna annonspartnernas cookies, i de fall lagen
      inte kräver ditt separata samtycke.
  changes:
    title: Slutnotering
    body: >-
      Även om de flesta ändringar troligen blir små kan InvisiProxy då och då
      ändra sin integritetspolicy, helt efter InvisiProxy LTS eget gottfinnande.
      InvisiProxy LTS uppmanar besökare att ofta kolla den här sidan efter
      ändringar i integritetspolicyn. Om du fortsätter använda sidan efter en
      ändring i integritetspolicyn innebär det att du godkänner ändringen. Vid
      missbruk eller DDoS-attacker kan InvisiProxy LTS tvingas att tillfälligt
      logga data för att motverka attacken och hålla tjänsten igång. I sådana
      fall raderas all loggad data säkert direkt efter att attacken har
      avvärjts.
  contact:
    title: Kontaktinformation & Tack
    body: >-
      Har du frågor om vår integritetspolicy? Kontakta oss via e-post på

docs:
  chemical: >-
    Testa <chemical>Chemical</chemical> om du vill bygga din egen
    webbproxy-tjänst från grunden.
  chemicalButton: Bygg din proxysida med Chemical
  formerly: Tidigare Holy Unblocker LTS
  badges:
    ci: GitHub Actions-status
    dockerVersion: Version av Docker-avbild
    dockerPulls: Docker-hämtningar
  intro: >-
    <strong>InvisiProxy LTS</strong> (tidigare Holy Unblocker LTS) är en
    experimentell webbproxy-tjänst som kan kringgå webbfilter och "blockers"
    oavsett om censurmetoden finns på klientsidan eller i nätverket. Det
    inkluderar förmågan att kringgå innehållsblockeringar från regeringar,
    Chrome-tillägg, lokala brandväggar på klientsidan och nätverksrelaterade
    filter. Projektet låter dig till och med besöka Tor/Onion-sidor i vilken
    webbläsare som helst (även Chromium), allt via en hemsida!
  star: Du kan stödja InvisiProxy genom att stjärnmärka repositoryt!
  about: >-
    Det här projektet är främst ett "proof of concept" för den ideala klientlösa
    metoden att kringgå censur. Ett bra användningsområde är om du behöver
    använda Tor, byta region när du surfar (eller använda en extern proxy),
    surfa utan att skapa konton (minskar fingeravtryck), kringgå
    annonsblockeringsspärrar och/eller lämna minimala spår av aktivitet på
    enheten. Hosta bara projektet på valfri domän så har du ett alternativ
    till VPN utan att behöva ladda ner något på enheten. Som en säker
    webbproxy-tjänst stödjer den otaliga sidor, uppdateras ofta och fokuserar
    på att vara enkel att självhosta. InvisiProxy LTS fungerar med väldigt
    många sidor, bland annat YouTube, Gemini, ChatGPT, Discord, GeForce NOW och
    fler! Projektet har också en hel del exklusiva funktioner jämfört med
    andra webbproxyer när det gäller att kringgå webbfilter
    (DOM-maskering och källrandomisering) och statlig censur. Länder som stöds
    just nu är Kina (GFW) och Ryssland.
  users: >-
    Över 30 miljoner användare sedan 2020. Tusen tack för stödet, jag hade
    aldrig kunnat föreställa mig hur enorm webbproxy-communityn skulle bli.
  branches:
    current: 'Nuvarande branch: Latest'
    title: Typer av branches
    latest: Latest (master; byggd för FOSS och SEO)
    beta: Beta (väntande ändringar; ändringar som kan förstöra saker)
    production: >-
      Production (v4, v5, v6; stabil version av InvisiProxy LTS. Ändringar för
      självhosting i produktionsmiljö; maximal filterundvikning och hantering
      av förfrågningar)
    switch: Överväg att byta till en produktions-branch om du självhostar!
  selfHost: >-
    Se <deploy>alternativen för självhosting</deploy> om du vill självhosta
    projektet. Kan du inte driftsätta med något av gratisalternativen? Kolla in
    Koyeb eller titta på billig betald VPS-hosting. Om du inte vill självhosta,
    klicka på menyn för spegellänkar på InvisiProxy.
  discord: "Gå med i TitaniumNetworks Discord för fler officiella länkar:"
  caution:
    title: Varning
    body: >-
      Om du ska självhosta InvisiProxy LTS, byt till PRODUCTION-branchen där
      funktionerna för att undvika filter är aktiverade automatiskt.
      Master-branchen innehåller ändringar under arbete som inte är redo för
      självhosting. Om du däremot vill bidra till projektet, skicka din PR till
      master-branchen.
  tip:
    title: Tips
    body: >-
      InvisiProxy LTS är optimerat för självhosting för att ge dig maximal
      kontroll över din integritet! Forka repositoryt och stjärnmärk det gärna.
      Du kan självhosta med gratis eller betalda alternativ, eller sätta upp det
      på en dedikerad instans (VPS) för bättre prestanda.
  sites:
    site: Sidor som stöds
    features: Funktioner
    youtube: >-
      Inbyggt urval av webbproxyer med öppen källkod med fokus på hastighet
      och/eller säkerhet
    reddit: >-
      Källrandomisering och DOM-maskering för att effektivt kringgå stora
      filter, samt randomisering av proxyns globala variabler
    discord: >-
      Anpassa fliktitel och ikon i inställningsmenyn för diskretare webbhistorik
    instagram: >-
      Annonsblockering på alla sidor när du surfar och DNS med låg latens på
      officiella servrar
    tor: >-
      Stöd för SOCKS5 och Onion-routing med Tor i inställningsmenyn. Använd
      Tor/Onion-sidor i vilken webbläsare som helst!
    geforce: >-
      Exklusiva funktioner jämfört med andra webbproxyer för att kringgå
