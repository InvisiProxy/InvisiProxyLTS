    brus i canvas-, WebGL-, CPU- och minnesvärden. En vald user agent har
    fortfarande företräde. Kan göra att vissa sidor slutar fungera.
  customWisp: Egen Wisp-server
  customWispDescription: >-
    Skicka proxytrafiken genom din egen Wisp-server för bättre kontroll över din
    integritet. Om du vill skicka all trafik via egen hosting är det här ett
    enkelt sätt: använd gränssnittet här men låt trafiken gå till dina egna
    servrar. Lämna tomt för att stänga av.
