    summary: Steg-för-steg-guide
    mirrors: >-
      För enkelhetens skull kan du gå med i TN:s Discord på discord.gg/unblock
      och be om spegellänkar (som fylls på och är oblockerade).
    hosting: Hosting
    hostingBody: >-
      Om du vill självhosta behöver du först en VPS eller hostingleverantör:
    dependencies: Beroenden
    dependenciesBody: >-
      Sedan behöver du installera git, musl, nginx (eller caddy) och Node.js.
      Här är ett exempel för Ubuntu LTS:
    tor: Tor-stöd (valfritt)
    configure: Konfigurera InvisiProxy
