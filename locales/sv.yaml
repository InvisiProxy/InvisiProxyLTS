home:
  title: InvisiProxy LTS | Gratis webbproxy - Kringgå filter och kom åt blockerade sidor
  description: >-
    InvisiProxy LTS är en avancerad webbproxy-tjänst gjord för att kringgå
    webbfilter och blockeringar. Oavsett om censuren sker på klientsidan eller i
    nätverket ger InvisiProxy LTS dig sömlös åtkomst till blockerade sidor och
    säker, privat surfning på enheter som Chromebooks. Ta dig förbi
    innehållsblockerare, Chrome-tillägg, brandväggar och mer med vår avancerade
    proxylösning.
  ogDescription: >-
    InvisiProxy LTS är en webbproxy-tjänst i toppklass som kringgår nätverks-
    och webbläsarbegränsningar så att du säkert kommer åt blockerade sidor.
    Njut av en sömlös surfupplevelse med stark säkerhet och avancerade
    funktioner.
  twitterDescription: >-
    Upptäck InvisiProxy LTS, en ledande webbproxy-tjänst som kringgår censur
    och filter och ger dig säker åtkomst till blockerade sidor. Perfekt för
    privat surfning och för att ta sig förbi nätverksbegränsningar på enheter
    som Chromebooks.

  headline: Stå upp mot censuren.
  tagline: Ta full kontroll över din integritet.
  browseNow: Surfa nu
  bypassNow: Kringgå nu
  donate: Donera
  logoAlt: InvisiProxy-logotyp
  terminal:
    setup: För första installationen på en produktions-branch...
    start: Eller vid vanlig användning...
    dev: För utveckling...

  free:
    title: InvisiProxy är gratis.
    body: >-
      Eftersom projektet har öppen källkod kan du enkelt forka repositoryt och
      självhosta för full integritetskontroll. Till skillnad från många andra
      webbproxy-tjänster utmärker sig InvisiProxy med end-to-end-kryptering via
      TLS, isolerad webbhistorik, Tor/Onion-routing i Chromium-webbläsare, full
      transparens och integritetskontroll. <strong>Till skillnad från andra
      proxytjänster samlar vi inte in någon användardata på våra officiella
      instanser. Inte ens för felsökning.</strong><br/>Våra beroenden med öppen
      källkod (Wisp, Libcurl och Epoxy) är byggda med fokus på säkerhet och
      integritet, så att din surfning förblir privat även på illasinnade
      självhostade instanser.

  fast:
    title: InvisiProxy är snabb och mycket avancerad.
    body: >-
      InvisiProxy levererar exceptionell prestanda. Vi har många funktioner som
      stöd för reCAPTCHA/Botguard, Tor-nätverket, SOCKS5-proxykedjor,
      anpassningsbar svartlista, skydd mot läckor, dold historik och omfattande
      kompatibilitet med de flesta sidor med hjälp av Scramjet + Wisp
      (kombinerat med Libcurl-överföring). Andra populära tjänster som
      CroxyProxy eller Proxium gör oftast bara halva jobbet med att skriva om
      tillgångar och läcker förfrågningar, vilket är ett integritetsproblem.
      Projektet stödjer också proxykedjor, så att du kan skicka din trafik
      genom flera proxyer för extra säkerhet och anonymitet.

  practical:
    title: InvisiProxy är praktisk.
    body: >-
      Tack vare källrandomisering och projekt som Proxy Transports, Wisp och
      Scramjet ger det här projektet dig en sömlös upplevelse som kringgår
      webbfilter, statliga filter och nätverksfilter. Projektet fungerar mot
      filter som används i Kina (GFW - Great Firewall of China), Ryssland och
      fler länder <strong>utan att du behöver ladda ner någon
      programvara</strong>. Allt sker direkt i din webbläsare som en hemsida och
      på vår backend (eller din egen om du självhostar), vilket låter användare
      kringgå även de mest invasiva censurblockeringarna. Du behöver inte ladda
      ner något, skriv bara in domänen till InvisiProxy, gå till den officiella
      InvisiProxy-sidan för att få speglar om den är blockerad, och surfa
      anonymt.

  heroSubtitle: Gratis och transparent att använda
  designedWithPrivacy: Designad med integritet i fokus<underline/>.

  overview:
    title: Översikt
    body: >-
      InvisiProxy LTS, en experimentell webbproxy-tjänst, kan kringgå webbfilter
      och "blockers" oavsett om censurmetoden finns på klientsidan eller i
      nätverket. Det inkluderar förmågan att kringgå innehållsblockeringar som
      införts av regeringar utomlands (Kina/GFW, Ryssland m.fl.),
      Chrome-tillägg, lokala brandväggar på klientsidan och nätverksrelaterade
      filter.
    donate: >-
      Överväg gärna att donera till projektet så att vi kan hålla det gratis!
      Vi erbjuder fler domäner varje månad, betaåtkomst, personliga domäner och
      prioriterade funktionsönskemål.<br/>Du kan donera <patreon>här på
      Patreon</patreon>.
    patreonLabel: Donera på Patreon
    imageAlt: Serverikon

  intent:
    title: Syfte
    body: >-
      Det här projektet är främst ett "proof of concept" för den ideala
      klientlösa metoden att kringgå censur. Som en säker webbproxy-tjänst
      stödjer den otaliga sidor, uppdateras ofta och är noggrann med detaljerna
      i design, mekanik och funktioner.
    palette: >-
      Projektets färgpalett är byggd med <nord>Nord Theme</nord> för dess
      optimala färgpalett och fokus på läsbar kodsyntax och
      gränssnittskomponenter.
    imageAlt: Ikon för kodfil

  usage:
    title: Användning
    body: >-
      Gå till sidan <browse>Surfa</browse> och välj en av proxyerna vi har!
      Skriv sedan in sidan du vill komma åt i sökrutan. Varje webbproxy har sin
      egen nivå av effektivitet, hastighet och säkerhet. Vi rekommenderar
      Scramjet.<br/><br/>Exempelsida att avblockera:
      <code>https://youtube.com</code>
    imageAlt: Sköldikon

  apps:
    title: Appar
    body: >-
      InvisiProxy har en samling förlänkade applikationer, bland annat YouTube,
      Spotify, GeForce NOW, Discord, ChatGPT, Gemini och mer!
    imageAlt: Applikationsikon

  hosting:
    title: Hosting och driftsättning
    body: >-
      <strong>InvisiProxy LTS</strong> är en lösning med öppen källkod byggd med
      modularitet, användarvänlighet och enkel driftsättning i åtanke. Viktiga
      funktioner är annonsblockering, flexibel generering av källkod och
      avancerad proxynavigering.<br/><br/>Fullständiga installationsinstruktioner
      finns på vårt officiella <github>GitHub-repository</github> eller i den
      <docs>inbyggda dokumentationen här</docs>.
    docsTitle: Mer information om hosting
    imageAlt: Ikon för hosting och driftsättning
    imageTitle: Hosting och driftsättning av InvisiProxy LTS

  contributing:
    title: Bidra
    body: >-
      <strong>InvisiProxy LTS</strong> kan fortsätta växa tack vare våra
      engagerade bidragsgivare. Som ett projekt med öppen källkod är
      <strong>InvisiProxy LTS</strong> beroende av communityns passion för att
      kringgå internetcensur och hjälpa användare att komma åt information.
    start: För att börja bidra, besök vårt <github>GitHub-repository.</github>
    imageAlt: GitHub-ikon för bidrag
    imageTitle: Bidra till InvisiProxy LTS på GitHub

  githubTitle: InvisiProxy LTS GitHub-repository

  bypass:
    title: Kringgå censur och filter
    body: >-
      InvisiProxy LTS är ett <strong>webbproxy-projekt</strong> med öppen
      källkod. Njut av obegränsad åtkomst till innehåll och surfning online med
      våra avancerade funktioner för <strong>avblockering via
      webbproxy</strong>. Projektet låter dig också självhosta var som helst och
      kringgå nationella och regionala blockeringar som i Kina (Great Firewall
      of China - GFW) och Ryssland.

  freeProxy:
    title: 100% gratis webbproxy
    body: >-
      Dra nytta av vår <strong>gratis webbproxy-tjänst</strong> som hjälper dig
      att <strong>avblockera sidor</strong> och komma åt begränsat innehåll.
      Perfekt för att kringgå filter i skolan och/eller på jobbet – projektet är
      gjort för att avblockera allt.

  tor:
    title: Använd Tor-routing i Chromium-webbläsare och Firefox
    body: >-
      Med InvisiProxy LTS kan du <strong>komma åt Tor-nätverket</strong> direkt
      i din Chromium- eller Firefox-baserade webbläsare. Det betyder att du kan
      besöka <strong>.onion</strong>-sidor direkt på den här hemsidan. Det låter
      dig surfa anonymt (åtminstone till viss del; riktiga Tor har bättre skydd
      mot fingeravtryck) och kringgå regionala begränsningar. Projektet stödjer
      också anpassade SOCKS5-proxyer för proxykedjor.

  unrestricted: Gratis obegränsad surfning
  closing: Börja surfa fritt nu.
  tryFree: Testa InvisiProxy gratis

