proxySettings:
  donate: >-
    Nous proposons des domaines premium, des fonctionnalités bêta, des
    connexions via des FAI résidentiels et des vitesses plus élevées. Vous
    pouvez faire un don sur <patreon>Patreon</patreon>.<br/>Activez Tor ou le
    routage régional si vous avez du mal à utiliser certains services.
    Consultez la page <faq>FAQ</faq> si vous rencontrez des problèmes avec le
    proxy.
  title: Préférences du proxy
  connection: Connexion
  searchNavFix: Activer les correctifs de sites
  searchNavFixDescription: >-
    Utiliser le plugin créé par The Freedom Project pour corriger des erreurs
    comme « undefined » pendant la navigation. Facultatif.
  experimentalSiteFixes: Correctifs de sites expérimentaux
  experimentalSiteFixesDescription: >-
    Ensemble de correctifs manuels de compatibilité. Peut casser des sites et
    divulguer votre véritable IP ; à utiliser à vos risques et périls.
  hideHistoryDescription: Masquer l'historique de navigation local. Le réseau peut toujours intercepter l'historique, mais il passe par le proxy.
  randomizeFingerprint: Rendre aléatoire l'empreinte du navigateur
  randomizeFingerprintDescription: >-
    Utilise un navigateur de bureau aléatoire pour chaque session d'onglet et
    ajoute du bruit aux mesures canvas, WebGL, processeur et mémoire. Un user
    agent choisi reste prioritaire. Peut casser certains sites.
  customWisp: Serveur Wisp personnalisé
  customWispDescription: >-
    Faites passer le trafic du proxy par votre propre serveur Wisp pour mieux
    contrôler votre confidentialité. Si vous voulez faire transiter tout votre
    trafic par votre propre hébergement, c'est une méthode légère : utilisez
    l'interface d'ici, mais envoyez le trafic correspondant vers vos propres
    serveurs. Laissez vide pour désactiver.
  invalidWisp: Saisissez une adresse ws:// ou wss://.
  moreSettings: Voir plus de paramètres
  anotherLink: Besoin d'un autre lien ? Cliquez sur le <mirrors>bouton des liens miroirs</mirrors>.

faq:
  meta:
    title: FAQ InvisiProxy | Erreurs réseau, CAPTCHA et correctifs YouTube
    description: >-
      Network Error, pages blanches, boucles de CAPTCHA ou YouTube qui ne charge
      pas ? Les solutions aux problèmes les plus courants d'InvisiProxy, et la
      réponse à la question : est-il sûr de se connecter à des sites ?
    social: >-
      Des solutions rapides aux erreurs réseau, pages blanches, boucles de
      CAPTCHA et problèmes de lecture YouTube, ainsi que des réponses sur la
      prise en charge de Discord et la connexion en toute sécurité.
  title: Foire aux questions
  search: Rechercher
  searchLabel: Rechercher dans la foire aux questions
  icons:
    question: Comment obtenir les URL d'icônes pour le menu de camouflage d'onglet ?
    bookmarklet: >-
      Rendez-vous sur le site dont vous voulez l'icône, puis utilisez ce
      bookmarklet (faites-le glisser dans votre barre de favoris) :
    button: Trouver l'URL de l'icône
    copy: >-
      Copiez l'URL fournie par le bookmarklet. Revenez ensuite sur InvisiProxy
      et saisissez-la comme URL de l'icône dans les paramètres. Et voilà !
  networkError:
    question: >-
      J'obtiens « Network Error » ou une erreur de site à chaque fois que
      j'utilise le proxy ?
    answer: >-
      C'est un problème connu de nos proxys web modernes. En raison du nombre
      d'utilisateurs, la connexion est généralement coupée après dix minutes
      d'inactivité de l'onglet. Cliquez simplement sur le bouton « Actualiser la
      page » et rechargez la page pour résoudre le problème.
    note: >-
      Cela arrive généralement la première fois que vous utilisez le proxy. Un
      correctif est prévu.
  bot:
    question: >-
      J'ai du mal à me connecter à des sites ou à voir du contenu parce qu'ils
      pensent que je suis un robot.
    answer: >-
      Aux heures de forte affluence, c'est très courant, car tout le trafic
      passe par seulement deux IP. La solution est de changer de région via la
      sélection de région ou d'activer le routage Tor. Vous pouvez aussi
      rejoindre notre Patreon pour accéder à une instance avec un FAI
      résidentiel et éviter ce problème.
  unreachable:
    question: >-
      J'obtiens une erreur du type « 'cdn.example.com' cannot be reached. »
    answer: >-
      Rechargez la page. Si cela ne marche pas du premier coup, utilisez
      simplement le bouton Retour du navigateur ou revenez à la page Scramjet et
      réessayez.
  blank:
    question: Pourquoi mon site ne se charge-t-il qu'en partie ou reste-t-il blanc ?
    answer: >-
      Tous les sites ne sont pas pris en charge. C'est inévitable, vu l'immensité
      du web et la diversité des technologies et des méthodes de chargement de
      contenu. Si vous rencontrez un problème avec un site précis, signalez-le
      sur notre serveur Discord ou sur GitHub. Sinon, essayez nos différentes
      options de proxy pour voir si l'une d'elles prend en charge le site.
  idb:
    question: >-
      J'obtiens une erreur concernant une base de données IDB (problème de
      Scramjet V1)
    answer: >-
      Cela arrive généralement lorsque nous mettons à jour le projet. Cliquez
      simplement sur l'icône (i) en haut à gauche de votre navigateur (ou sur
      le cadenas) et sélectionnez « Effacer les données du site » ou « Cookies et
      données de site > Gérer les données sur l'appareil > icône de corbeille ».
      Cela videra la base de données IndexedDB et vous permettra d'utiliser à
      nouveau le proxy.
  discord:
    question: Discord est-il pris en charge ?
    answer: Oui, Discord est pris en charge.
    note: >-
      Cependant, les proxys gratuits ont quelques limites. N'utilisez pas votre
      compte principal, sauf si vous auto-hébergez ou utilisez un petit
      domaine.
  youtube:
    question: Pourquoi les vidéos YouTube ne fonctionnent-elles pas ?
    answer: >-
      Si le problème persiste même après les étapes ci-dessus, il est possible
      que l'instance soit temporairement hors service, surtout si beaucoup de
      personnes rencontrent le même problème. Cela n'arrive pas en
      auto-hébergement.
    tor: >-
      Essayez de sélectionner l'option « Tor » : cela peut régler le problème,
      mais ralentira fortement le chargement.
  login:
    question: Est-il sûr de me connecter à des sites ?
    answer: >-
      Oui, il est sûr de se connecter à des sites. Cependant, nous vous
      recommandons de ne pas vous connecter à des sites auxquels vous ne faites
      pas confiance ni d'utiliser des comptes personnels, en raison de la
      quantité de trafic acheminée vers un seul domaine. Nous essayons
      d'atténuer ce problème en faisant tourner les IP, mais ne pas utiliser de
      comptes personnels sur des proxys publics reste une bonne pratique
      courante. En auto-hébergement, en revanche, vous pouvez le faire sans
      souci. Vous pouvez aussi rejoindre le Patreon pour utiliser un FAI
      résidentiel et éviter ce problème.
  captcha:
    question: >-
      Pourquoi le site sur lequel je suis ne fonctionne-t-il pas correctement ou
      affiche-t-il des erreurs de CAPTCHA ?
    answer: >-
      Les CAPTCHA fonctionnent avec Scramjet, mais il faudra peut-être plusieurs
      essais. La raison est que Scramjet est souvent tout simplement trop
      rapide, et que les CAPTCHA sont par nature capricieux. La solution est de
      continuer à résoudre le CAPTCHA jusqu'à ce que ça passe. Essayez de ne pas
      aller trop vite.
  youtubeBlank:
    question: >-
      Quand j'utilise YouTube sur l'un des sites proxy, pourquoi la page ne se
      charge-t-elle pas entièrement ou la vidéo reste-t-elle blanche ?
    answer: 'Il existe deux méthodes pour corriger cela :'
    reload: >-
      Recharger normalement la page lorsque l'erreur ci-dessus se produit devrait
      charger la vidéo.
    reloadFrame: >-
      Ou faites un clic droit sur la page et choisissez <code>Actualiser le
      cadre</code> si vous utilisez une forme de mode furtif.

privacy:
  title: Politique de confidentialité
  subtitle: InvisiProxy, un service de proxy web privé.
  effective: "Date d'entrée en vigueur : 16/07/2021"
  updated: 'Date de mise à jour : 31/10/2026'
  what:
    title: Qu'est-ce qu'InvisiProxy ?
    body: >-
      InvisiProxy LTS est un service de proxy web qui vous aide à accéder à des
      sites susceptibles d'être bloqués par votre réseau, votre gouvernement ou
      une politique, directement dans votre navigateur, sans téléchargement ni
      configuration. Il le fait de manière sécurisée et avec des fonctionnalités
      de confidentialité supplémentaires. Consultez des sites Tor/Onion dans
      n'importe quel navigateur, masquez votre activité de navigation et
      contournez les filtres. Cela inclut la capacité potentielle de contourner
      les bloqueurs de contenu gouvernementaux, les extensions Chrome, les
      pare-feu clients locaux et les filtres liés au réseau.<br/>Ce projet sert
      avant tout de preuve de concept pour la solution idéale, sans client, de
      contournement de la censure.
  data:
    title: Des données sont-elles collectées ?
    body: >-
      InvisiProxy lui-même n'enregistre ni ne collecte votre navigation. La
      journalisation est désactivée sur le backend afin de garantir la
      confidentialité des utilisateurs. La seule exception est le bouton des
      liens miroirs, qui conserve votre adresse IP en mémoire pendant quelques
      secondes pour empêcher les abus ; elle n'est jamais écrite sur disque. Les
      partenaires publicitaires présents sur les domaines financés par la
      publicité collectent leurs propres données, comme décrit dans la section
      Publicité ci-dessous. Les requêtes NextDNS sont configurées pour ne pas
      enregistrer les IP ni les domaines des clients, et sont stockées en
      Suisse. La conservation des journaux de NextDNS pour les valeurs
      numériques concernées est minimale et sert uniquement au bon
      fonctionnement du service. Cloudflare est utilisé pour ce projet afin
      d'améliorer les performances et de faciliter la gestion DNS, compte tenu
      de l'ampleur du projet. Les valeurs numériques de Cloudflare sont
      utilisées au strict minimum pour compter les visites et les pages vues,
      afin de savoir quand les serveurs doivent être mis à niveau. NGINX est
      configuré pour ne stocker aucun journal. InvisiProxy LTS tient à son
      engagement de mettre fin à la censure d'Internet tout en respectant la
      vie privée des utilisateurs. Par ailleurs, le protocole Wisp (pour faire
      transiter les connexions TCP) est utilisé avec libcurl-transport pour un
      chiffrement de bout en bout, en exécutant SSL/TLS dans WebAssembly. Ce
      service se veut aussi transparent que possible, et n'oubliez pas que vous
      pouvez l'auto-héberger à tout moment pour garder le contrôle sur
      tout.<br/><br/>Si vous souhaitez faire une déclaration ou une demande
      relative à la confidentialité, contactez-nous via Discord.
  security:
    title: Sécurité
    body: >-
      InvisiProxy LTS a été conçu de A à Z pour offrir à ses utilisateurs un
      service de proxy web sûr et fiable. L'une des technologies clés
      d'InvisiProxy LTS est le nouveau protocole Wisp, développé par Mercury
      Workshop.<br/><br/>Ce protocole apporte plusieurs fonctionnalités et
      améliorations innovantes qui renforcent la vitesse et la sécurité du
      service par rapport aux modèles précédents.
    intro: >-
      Le protocole Wisp est conçu pour répondre aux exigences du trafic web
      moderne tout en maintenant des normes de sécurité élevées. Grâce à Wisp,
      ce projet bénéficie des avantages suivants :
    performance: >-
      Performances : le protocole Wisp optimise la vitesse de transfert des
      données TCP, garantissant une latence minimale pendant la navigation.
    compatibility: >-
      Compatibilité : Wisp est conçu pour être compatible avec un large éventail
      de technologies web, garantissant un accès fluide à divers sites et
      services en ligne. Cela passe par la prise en charge de différents
      transports open source qui suivent le protocole (Libcurl Transport).
    censorship: >-
      Résistance à la censure : le protocole est conçu pour contourner les
      techniques de censure sophistiquées employées par les réseaux
      restrictifs, permettant aux utilisateurs d'accéder facilement aux
      contenus bloqués.
    fingerprinting: >-
      Résistance à l'empreinte numérique : ce projet dispose de solides
      mécanismes de résistance à l'empreinte numérique dans la configuration du
      proxy inverse de ses instances officielles. Le proxy est donc conçu pour
      réduire au minimum les identifiants uniques pouvant servir à suivre ou à
      identifier les utilisateurs, ce qui renforce la confidentialité. En
      suivant les meilleures pratiques du secteur et en mettant continuellement
      ses méthodes à jour, il permet aux utilisateurs de naviguer anonymement
      sans laisser de traces identifiables.
    transparency: >-
      Transparence : la transparence est un principe clé d'InvisiProxy LTS. Le
      projet fonctionne selon un modèle open source, permettant à la communauté
      d'examiner le code et d'y contribuer. Cette ouverture renforce non
      seulement la confiance, mais permet aussi une amélioration continue grâce
      aux retours et à la collaboration de la communauté. En restant
      transparent, InvisiProxy LTS garantit que les utilisateurs savent comment
      leurs données sont traitées et quelles mesures protègent leur vie privée.
    randomisation: >-
      Randomisation du code source et globale : pour renforcer encore la
      sécurité et la confidentialité, InvisiProxy LTS utilise une randomisation
      du code source et des variables globales. Cela permet au projet de rester
      débloqué plus longtemps sur les domaines et améliore l'anonymat pendant la
      navigation. Les proxys web classiques laissent des traces lorsqu'ils
      réécrivent des ressources, mais avec cette méthode, il est bien plus
      difficile de détecter le proxy et de le bloquer.
    encryption: >-
      Chiffrement : InvisiProxy LTS utilise des technologies de proxy avancées
      axées sur le chiffrement de bout en bout et le transfert sécurisé des
      données, en particulier dans le contexte des proxys à réécriture d'URL.
      REMARQUE : ce chantier est encore largement en cours et ouvert aux
      contributions.
    audits: >-
      Audits réguliers : réalisation d'audits de sécurité réguliers pour
      identifier et corriger les vulnérabilités potentielles.
  advertising:
    title: Publicité
    body: >-
      Certains domaines InvisiProxy affichent des publicités pour couvrir les
      frais d'hébergement. Les instances Patreon sont toujours sans publicité.
      Les publicités sont diffusées par des régies tierces : Adsterra, Adcash
      et Monetag. Elles n'apparaissent que sur les propres pages
      et écrans de chargement d'InvisiProxy, jamais à l'intérieur des sites que
      vous consultez via le proxy.<br/><br/>Lorsqu'une publicité se charge, la
      régie reçoit votre adresse IP, l'user agent de votre navigateur, le
      domaine que vous visitez et d'autres informations techniques similaires,
      et peut déposer ou lire ses propres cookies ou utiliser des technologies
      similaires pour afficher des publicités, limiter leur fréquence, mesurer
      leurs performances et prévenir la fraude. Ces régies peuvent exécuter
      leur code sur nos pages ; le traitement de vos données par ces régies est
      régi par leurs propres politiques de confidentialité, et non par la
      nôtre.<br/><br/>Vous pouvez refuser de nombreuses régies sur
      optout.aboutads.info ou youronlinechoices.eu. Vous pouvez aussi bloquer
      les publicités avec un bloqueur de contenu, ou utiliser une instance
      Patreon.
  usage:
    title: Utilisation complémentaire
    storage: >-
      InvisiProxy utilise des « cookies », IndexedDB, localStorage et
      sessionStorage pour maintenir une session utilisateur (décrite plus bas)
      et enregistrer vos préférences sur votre ordinateur. Toutes ces
      informations restent sur votre appareil et InvisiProxy n'en utilise
      aucune à des fins d'analyse. Les partenaires publicitaires peuvent
      déposer leurs propres cookies, comme décrit dans la section Publicité.
    cookies: >-
      Un cookie est une chaîne d'informations qu'un site web enregistre sur
      l'ordinateur d'un visiteur, et que le navigateur du visiteur transmet au
      site à chaque nouvelle visite. InvisiProxy utilise des cookies pour
      assurer le bon fonctionnement du menu des paramètres, ainsi que pour les
      préférences des utilisateurs. Les utilisateurs qui ne souhaitent pas que
      des cookies soient déposés sur leur ordinateur doivent configurer leur
      navigateur pour les refuser avant d'utiliser les sites d'InvisiProxy, avec
      pour inconvénient que certaines fonctionnalités d'InvisiProxy NE
      fonctionneront PAS correctement sans cookies, localStorage ou IndexedDB.
      InvisiProxy n'utilise aucun cookie, IndexedDB, localStorage ou
      sessionStorage à des fins d'analyse ; seules les fonctionnalités suivantes
      s'en servent pour stocker des données persistantes localement : Scramjet
      (mise en cache des ressources passant par le proxy, état de session,
      etc.), onglets, favoris, saisie semi-automatique (via le proxy), menu des
      paramètres : camouflage d'onglet, icônes prédéfinies, options de
      transport, moteurs de recherche, thèmes, langue, type de fenêtre, routage
      Tor, changement de région, masquage des publicités, masquage de
      l'historique, blocage des fuites de fenêtres, blocage de WebRTC et
      randomisation de l'empreinte.
    serviceWorkers: >-
      En outre, InvisiProxy utilise les Service Workers comme technologie pour
      nos proxys web. Cela permet d'intercepter le trafic réseau concerné, etc.,
      et constitue une fonction essentielle du projet.
    consent: >-
      En continuant à naviguer sur notre site sans modifier vos paramètres de
      cookies, vous reconnaissez et acceptez l'utilisation de cookies par
      InvisiProxy ainsi que les cookies des partenaires publicitaires décrits
      ci-dessus, lorsque la loi n'exige pas votre consentement distinct.
  changes:
    title: Note finale
    body: >-
      Bien que la plupart des modifications soient vraisemblablement mineures,
      InvisiProxy peut modifier sa politique de confidentialité de temps à
      autre, à la seule discrétion d'InvisiProxy LTS. InvisiProxy LTS encourage
      les visiteurs à consulter régulièrement cette page pour prendre
      connaissance de toute modification de sa politique de confidentialité.
      Votre utilisation continue de ce site après toute modification de la
      présente politique vaut acceptation de cette modification. En cas d'abus
      ou d'attaques DDoS, InvisiProxy LTS peut être contraint d'enregistrer
      temporairement des données pour atténuer l'attaque et assurer la
      continuité du service. Dans ce cas, toutes les données enregistrées
      seront supprimées de manière sécurisée immédiatement après l'atténuation
      de l'attaque.
  contact:
    title: Coordonnées et crédits
    body: >-
      Pour toute question concernant notre politique de confidentialité,
      contactez-nous par e-mail à l'adresse

docs:
  chemical: >-
    Essayez <chemical>Chemical</chemical> si vous voulez créer votre propre
    service de proxy web à partir de zéro.
  chemicalButton: Créez votre site proxy avec Chemical
  formerly: Anciennement Holy Unblocker LTS
  badges:
    ci: Statut GitHub Actions
    dockerVersion: Version de l'image Docker
    dockerPulls: Téléchargements Docker
  intro: >-
    <strong>InvisiProxy LTS</strong> (anciennement Holy Unblocker LTS) est un
    service de proxy web expérimental capable de contourner les filtres web ou
    « bloqueurs », que la censure soit appliquée côté client ou au niveau du
    réseau. Cela inclut la capacité de contourner les bloqueurs de contenu
    gouvernementaux, les extensions Chrome, les pare-feu clients locaux et les
    filtres liés au réseau. Le projet permet même de consulter des sites
    Tor/Onion dans n'importe quel navigateur (même Chromium), le tout via un
    site web !
  star: Vous pouvez soutenir InvisiProxy en ajoutant une étoile au dépôt !
  about: >-
    Ce projet sert avant tout de preuve de concept pour la solution idéale,
    sans client, de contournement de la censure. Il est particulièrement utile
    si vous avez besoin d'utiliser Tor, de changer de région pendant la
    navigation (ou d'utiliser un proxy externe), de consulter des sites sans
    créer de compte (moins d'empreinte numérique), de contourner les
    anti-bloqueurs de pub et/ou de laisser un minimum de traces sur
    l'appareil. Il suffit d'héberger ce projet sur n'importe quel domaine pour
    disposer d'une alternative à un VPN sans rien télécharger sur l'appareil.
    En tant que service de proxy web sécurisé, il prend en charge de nombreux
    sites, est mis à jour fréquemment et met l'accent sur la facilité
    d'auto-hébergement. InvisiProxy LTS fonctionne avec un grand nombre de
    sites, dont YouTube, Gemini, ChatGPT, Discord, GeForce NOW et bien d'autres !
    Ce projet propose aussi un bon nombre de fonctionnalités exclusives par
    rapport aux autres proxys web pour contourner les filtres web (DOM
    Masquerading et randomisation du code source) et la censure des États. Les
    pays actuellement pris en charge sont la Chine (GFW) et la Russie.
  users: >-
    Plus de 30 millions d'utilisateurs depuis 2020. Merci infiniment pour votre
    soutien, je n'aurais jamais imaginé que la communauté des proxys web
    deviendrait aussi immense.
  branches:
    current: 'Branche actuelle : Latest'
    title: Types de branches
    latest: Latest (master ; conçue pour le FOSS et le SEO)
    beta: Beta (changements en attente ; changements susceptibles de casser des choses)
    production: >-
      Production (v4, v5, v6 ; version stable d'InvisiProxy LTS. Changements
      pour l'auto-hébergement en production ; contournement des filtres et
      gestion des requêtes maximaux)
    switch: Pour l'auto-hébergement, pensez à passer sur une branche de production !
  selfHost: >-
    Consultez les <deploy>options d'auto-déploiement</deploy> si vous souhaitez
    auto-héberger ce projet. Impossible de déployer avec les options
    gratuites ? Jetez un œil à Koyeb ou à des solutions d'hébergement VPS
    payantes et bon marché. Si vous ne souhaitez pas auto-héberger, cliquez sur
    le menu des liens miroirs d'InvisiProxy.
  discord: "Rejoignez le Discord de TitaniumNetwork pour obtenir davantage de liens officiels :"
  caution:
    title: Attention
    body: >-
      Si vous comptez auto-héberger InvisiProxy LTS, passez sur la branche
      PRODUCTION, où les fonctionnalités de contournement des filtres sont
      activées automatiquement. La branche master contient des changements en
      cours qui ne sont pas prêts pour l'auto-hébergement. En revanche, si vous
      souhaitez contribuer au projet, faites vos PR sur la branche master.
  tip:
    title: Astuce
    body: >-
      InvisiProxy LTS est optimisé pour l'auto-hébergement afin de vous offrir un
      contrôle maximal sur votre confidentialité ! Forkez ce dépôt et pensez à
      lui ajouter une étoile. Vous pouvez l'auto-héberger avec des options de
      déploiement gratuites ou payantes, ou l'installer sur une instance dédiée
      (VPS) pour de meilleures performances.
