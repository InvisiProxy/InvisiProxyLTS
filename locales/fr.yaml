home:
  title: InvisiProxy LTS | Proxy web gratuit - Contournez les filtres et accédez aux sites bloqués
  description: >-
    InvisiProxy LTS est un service de proxy web de pointe conçu pour contourner
    les filtres et bloqueurs web. Qu'il s'agisse de censure côté client ou au
    niveau du réseau, InvisiProxy LTS offre un accès fluide aux sites bloqués et
    une navigation sécurisée et privée sur des appareils comme les Chromebooks.
    Venez à bout des bloqueurs de contenu, des extensions Chrome, des pare-feu
    et plus encore grâce à notre solution de proxy avancée.
  ogDescription: >-
    InvisiProxy LTS est un service de proxy web haut de gamme qui contourne les
    restrictions du réseau et du navigateur pour accéder en toute sécurité aux
    sites bloqués. Profitez d'une navigation fluide, avec une sécurité solide et
    des fonctionnalités avancées.
  twitterDescription: >-
    Découvrez InvisiProxy LTS, un service de proxy web de premier plan qui
    contourne la censure et les filtres pour accéder en toute sécurité aux sites
    bloqués. Idéal pour la navigation privée et pour passer outre les
    restrictions réseau sur des appareils comme les Chromebooks.

  headline: Mettez fin à la censure d'Internet.
  tagline: La confidentialité à portée de main.
  browseNow: Naviguer maintenant
  bypassNow: Contourner maintenant
  donate: Faire un don
  logoAlt: Logo principal InvisiProxy
  terminal:
    setup: Pour une première installation sur une branche de production...
    start: Ou pour un usage habituel...
    dev: Pour le développement...

  free:
    title: InvisiProxy est gratuit.
    body: >-
      Le projet étant open source, vous pouvez facilement forker ce dépôt et
      l'auto-héberger pour un contrôle maximal de votre confidentialité.
      Contrairement à de nombreux autres services de proxy web, InvisiProxy se
      distingue par son chiffrement de bout en bout via TLS, l'isolation de
      l'historique de navigation, le routage Tor/Onion dans les navigateurs
      Chromium, une transparence totale et le contrôle de la confidentialité.
      <strong>Contrairement à d'autres services de proxy, nous ne collectons
      aucune donnée utilisateur sur nos instances officielles. Pas même à des
      fins de débogage.</strong><br/>Nos dépendances open source (Wisp, Libcurl
      et Epoxy) sont conçues pour être sûres et respectueuses de la vie privée,
      afin que votre navigation reste confidentielle même sur des instances
      auto-hébergées malveillantes.

  fast:
    title: InvisiProxy est rapide et très avancé.
    body: >-
      InvisiProxy offre des performances de proxy web exceptionnelles. Il
      propose un ensemble complet de fonctionnalités : prise en charge de
      reCAPTCHA/Botguard, réseau Tor, chaînage de proxys SOCKS5, liste noire
      personnalisable, prévention des fuites, masquage de l'historique et large
      compatibilité avec les sites grâce à Scramjet + Wisp (associé à Libcurl
      Transport). D'autres services populaires comme CroxyProxy ou Proxium ne
      font souvent que la moitié du travail de réécriture des ressources, en
      laissant fuiter des requêtes, ce qui pose un problème de confidentialité.
      Ce projet prend aussi en charge le chaînage de proxys, qui vous permet de
      faire passer votre trafic par plusieurs proxys pour plus de sécurité et
      d'anonymat.

  practical:
    title: InvisiProxy est pratique.
    body: >-
      Grâce à notre randomisation du code source et à des projets comme Proxy
      Transports, Wisp et Scramjet, ce projet offre une expérience fluide qui
      contourne les filtres web, gouvernementaux et réseau. Il fonctionne contre
      les filtres utilisés en Chine (GFW - la Grande Muraille numérique de
      Chine), en Russie et ailleurs, <strong>sans avoir besoin de télécharger de
      logiciel</strong>. Tout se passe dans votre navigateur, sous forme de site
      web, et sur notre backend (ou le vôtre si vous l'auto-hébergez),
      permettant aux utilisateurs de contourner même les blocages de censure les
      plus intrusifs. Rien à télécharger : tapez simplement le domaine
      d'InvisiProxy, rendez-vous sur le site officiel d'InvisiProxy pour obtenir
      des miroirs s'il est bloqué, et naviguez anonymement.

  heroSubtitle: Gratuit et transparent
  designedWithPrivacy: Pensé pour la confidentialité<underline/>.

  overview:
    title: Présentation
    body: >-
      InvisiProxy LTS, un service de proxy web expérimental, peut contourner les
      filtres web ou « bloqueurs », que la censure soit appliquée côté client ou
      au niveau du réseau. Cela inclut la capacité de contourner les bloqueurs de
      contenu mis en place à l'étranger par des gouvernements (Chine/GFW, Russie,
      etc.), les extensions Chrome, les pare-feu clients locaux et les filtres
      liés au réseau.
    donate: >-
      Pensez à faire un don à ce projet pour nous aider à le garder gratuit !
      Nous offrons davantage de domaines chaque mois, un accès bêta, des domaines
      personnels et des demandes de fonctionnalités prioritaires.<br/>Vous
      pouvez faire un don <patreon>sur Patreon ici</patreon>.
    patreonLabel: Faire un don sur Patreon
    imageAlt: Icône de serveur

  intent:
    title: Objectif
    body: >-
      Ce projet sert avant tout de preuve de concept pour la solution idéale,
      sans client, de contournement de la censure. En tant que service de proxy
      web sécurisé, il prend en charge de nombreux sites, est mis à jour
      fréquemment et soigne les détails du design, des mécanismes et des
      fonctionnalités.
    palette: >-
      La palette de ce projet repose sur <nord>Nord Theme</nord> pour ses
      couleurs optimales et la priorité qu'elle accorde à la lisibilité de la
      syntaxe du code et des composants d'interface.
    imageAlt: Icône de fichier de code

  usage:
    title: Utilisation
    body: >-
      Rendez-vous sur la page <browse>Naviguer</browse> et choisissez l'un des
      proxys proposés ! Ensuite, tapez le site auquel vous voulez accéder dans
      la barre de recherche. Chaque proxy web a son propre niveau d'efficacité,
      de vitesse et de sécurité. Nous recommandons Scramjet.<br/><br/>Exemple de
      site à débloquer : <code>https://youtube.com</code>
    imageAlt: Icône de bouclier

  apps:
    title: Applications
    body: >-
      InvisiProxy propose une collection d'applications prêtes à l'emploi,
      dont YouTube, Spotify, GeForce NOW, Discord, ChatGPT, Gemini et bien
      d'autres !
    imageAlt: Icône d'application

  hosting:
    title: Hébergement et déploiement
    body: >-
      <strong>InvisiProxy LTS</strong> est une solution open source conçue pour
      la modularité, la facilité d'utilisation et un déploiement simple. Ses
      principales fonctionnalités incluent le blocage des publicités, une
      génération flexible du code source et une navigation par proxy
      avancée.<br/><br/>Pour des instructions d'installation complètes,
      consultez notre <github>dépôt GitHub</github> officiel ou la
      <docs>documentation intégrée fournie ici</docs>.
    docsTitle: Informations complémentaires sur l'hébergement
    imageAlt: Icône d'hébergement et de déploiement
    imageTitle: Hébergement et déploiement d'InvisiProxy LTS

  contributing:
    title: Contribuer
    body: >-
      <strong>InvisiProxy LTS</strong> prospère grâce aux efforts dévoués de nos
      formidables contributeurs. En tant que projet open source,
      <strong>InvisiProxy LTS</strong> repose sur la passion de sa communauté
      pour contourner la censure d'Internet et aider les utilisateurs à accéder
      plus facilement à l'information.
    start: Pour commencer à contribuer, rendez-vous sur notre <github>dépôt GitHub.</github>
    imageAlt: Icône GitHub de contribution
    imageTitle: Contribuer à InvisiProxy LTS sur GitHub

  githubTitle: Dépôt GitHub d'InvisiProxy LTS

  bypass:
    title: Contournez la censure et les filtres
    body: >-
      InvisiProxy LTS est un <strong>projet de proxy web</strong> open source.
      Profitez d'un accès illimité aux contenus en ligne et à la navigation grâce
      à nos fonctionnalités avancées de <strong>déblocage par proxy
      web</strong>. Ce projet vous permet aussi de l'auto-héberger n'importe où
      et de contourner les blocages nationaux ou régionaux comme en Chine
      (Grande Muraille numérique de Chine - GFW) et en Russie.

  freeProxy:
    title: Proxy web 100 % gratuit
    body: >-
      Profitez de notre <strong>service de proxy web gratuit</strong> qui vous
      aide à <strong>débloquer des sites</strong> et à accéder à des contenus
      restreints. Parfait pour contourner les filtres scolaires et/ou
      professionnels, ce projet est fait pour tout débloquer.

  tor:
    title: Utilisez le routage Tor dans les navigateurs Chromium et Firefox
    body: >-
      Avec InvisiProxy LTS, vous pouvez <strong>accéder au réseau Tor</strong>
      directement depuis votre navigateur basé sur Chromium ou Firefox. Vous
      pouvez donc consulter des sites <strong>.onion</strong> directement depuis
      ce site. Cela vous permet de naviguer anonymement (du moins dans une
      certaine mesure ; le vrai Tor protège mieux contre l'empreinte numérique),
      en contournant toute restriction régionale. Ce projet permet aussi de
      configurer des proxys SOCKS5 personnalisés pour le chaînage.

  unrestricted: Navigation gratuite et sans restriction
  closing: Il est temps de naviguer librement sur Internet.
  tryFree: Essayez InvisiProxy gratuitement

