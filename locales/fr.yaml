    terminalIntro: >-
      Vous pouvez soit utiliser le bouton ci-dessus pour déployer aux options de déploiement ou taper les commandes ci-dessous sur un serveur dédié
    nginxOnly: CE PROJET EST FAIT POUR MARCHER AVEC NGINX ; PAS CADDY.
    requirements: >-
      Veuillez vous assurer d'utiliser également <code>Node 26.x</code>. <code>git</code> et <code>curl</code> sont des dépendances nécessaires :
    builtIn: >-
      Ce site web est hébergé localement avec <scramjet>Scramjet</scramjet>, <wisp>Wisp</wisp>, <merp>l'obscurcissement Merp</merp>, <epoxy>le transport Epoxy</epoxy>, et <libcurl>le transport Libcurl</libcurl> inclus.
    caddyWarning: >-
      Pour des raisons de sécurité lors d'un hébergement derrière un proxy inverse, utilisez S'IL VOUS PLAÎT NGINX et non Caddy. Cela vient du fait que finalwisp utilise des adresses de bouclage. Si vous utilisez Caddy, désactivez cette fonctionnalité ou ajustez votre configuration Caddy par défaut.
    resources: 'Ressources pour l''auto-hébergement :'
  commands:
    pm2Config: Installez les dépendances et récupérez les listes de blocage
    finalwisp: >-
      Installez finalwisp, le serveur Wisp dont le proxy a besoin pour ouvrir des connexions
    pm2Finalwisp: >-
      Production : les instances finalwisp, une par région, également sous pm2
    pm2: usage du service pm2
    restart: Ou sur les usages suivants...
    kill: Pour éliminer des processus de production provenant de pm2
    buildErrors: Si vous rencontrez des erreurs de compilation...
    serviceErrors: Si vous obtenez des erreurs de service...
    nodeVersion: 26 ou la dernière version
    start: Si vous souhaitez commencer le projet
    test: Pour les points de fin de testage et les erreurs
    prSet: code de la fonction prSet ici....
  ubuntu:
    title: Configuration avancée (Exemple avec Ubuntu)
    intro: >-
      Vous aurez besoin de <code>Node.js 26.x</code>, <code>curl</code> et <code>git</code> installés ; vous trouverez ci-dessous un exemple pour la configuration avec Debian/Ubuntu.
    summary: Guide pas à pas
    mirrors: >-
      En toute simplicité, vous pouvez rejoindre le Discord de TitaniumNetwork sur discord.gg/unblock et demander des liens de site miroirs (qui sont réapprovisionnés et débloqués).
    hosting: Hébergement
    hostingBody: >-
      Par contre, si vous souhaitez auto-héberger, vous aurez d'abord besoin d'un VPS ou d'un fournisseur d'hébergement :
    dependencies: Dépendances
    dependenciesBody: >-
      Vous devrez ensuite installer git, nginx (ou caddy), Node.js et le binaire finalwisp (le serveur Wisp). Voici un exemple pour Ubuntu LTS :
    tor: Prise en charge Tor (optionnel)
    configure: Configurer InvisiProxy
    configureBody: >-
      Les réglages les plus importants sont production ainsi que les techniques d'obscurcissement et de dissimulation du DOM.
    configureMore: 'À partir de là, configurer comme nécessaire :'
    run: Cloner le dépôt d'InvisiProxy et l'exécuter
    runBody: >-
      Lancez ensuite le processus correspondant ; le site démarre sous pm2 avec notre propre système de workers et de cache, et manageWisp (par défaut) laisse le processus du site gérer lui-même les instances finalwisp :
    restart: Puis, bien sûr, si vous avez utilisé NGINX ou Caddy, redémarrez le
  config:
    title: Configuration
    server: Configuration initiale du serveur
    port: >-
      Le PORT par défaut du proxy au démarrage est <code>http://localhost:8080</code>. Vous pouvez modifier le PORT (surcharge via la variable d'environnement PORT) et d'autres paramètres si nécessaire dans <code>./config.json</code>.
    local: >-
      Tous les autres changements localisés pour la randomisation du code source, la minification automatique, etc. se trouvent dans <code>./config.json</code>.
    options:
      minifyScripts: >-
        Minifier automatiquement les ressources statiques respectives lors du démarrage du serveur.
      randomizeIdentifiers: >-
        Active la randomisation des variables globales de proxy expérimentales pour Ultraviolet. Cela réduit les chances qu'UV soit détecté par des filtres provenant d'extensions de navigateur.
      manageWisp: >-
        À true (valeur par défaut), le processus du site démarre et surveille lui-même les instances finalwisp. Passez-le à false pour la configuration nginx + pm2, où nginx route Wisp vers des instances gérées par pm2 (voir FINALWISP.md) et la reconstruction du site ne coupe plus les sessions Wisp.
      dns: >-
        Comment les instances finalwisp résolvent les noms d'hôte : resolve (par défaut) utilise le résolveur intégré de finalwisp, lookup utilise le résolveur du système, et un fournisseur comme nextdns:xxx ou xxx.dns.nextdns.io est interrogé directement.
      disguiseFiles: >-
        Activer la dissimulation du DOM qui obscurcit les vraies requêtes de contenu d'InvisiProxy LTS. Ceci est fait via le déguisement des requêtes, de la décompression et finalement de la reconstruction de l'arbre DOM.
      usingSEO: >-
        Activer la randomisation de source, qui modifie aléatoirement la source en échangeant des morceaux de données spécifiées dans <code>./src/data.json</code>. Très utile pour masquer des mots-clés qui signaleraient ou bloqueraient InvisiProxy LTS tout en prévenant les blocages de source.
      verbose: >-
        Active les messages de compilation, permettant de voir le progrès et les potentiels problèmes lors de la compilation.
      mirrorLinksFile: >-
        Fichier coté serveur utilisé par la page de distribution de liens, utilisant <code>private/mirror-links.txt</code> par défaut. Les chemins relatifs sont résolus à partir de la racine du projet ; les chemins absolus sont aussi pris en charge. Utilisez un URL HTTP(S) par ligne et gardez le fichier hors de <code>views/</code> pour qu'il ne soit pas servi publiquement. Redémarrez le serveur après avoir changé ce paramètre.
      geoLanguage: >-
        Active la sélection de langue automatique avec l'en-tête <code>CF-IPCountry</code> de Cloudflare. Activez ceci seulement si vous êtes derrière Cloudflare, car sinon, n'importe qui peut régler cet en-tête. Les pays sont listés par langue sous <code>language.countries</code> dans chaque fichier <code>./locales/*.yaml</code>.
      singleLanguage: >-
        Lorsque le paramètre est <code>true</code>, seulement la langue configurée dans <code>language</code> est compilée et tous les visiteurs l'ont, avec le paramètre de langue caché. Utile pour Docker ou d'autre déploiements ayant besoin d'une seule langue, car le service compilé est plus petit et rapide. Configuré à <code>false</code> par défaut.
      language: >-
        La langue à compiler lorsque <code>singleLanguage</code> est activé, correspondant à un fichier dans <code>./locales/</code> (p. ex. <code>en</code> pour <code>en.yaml</code>). La valeur par défaut est <code>en</code>. Pour Docker, réglez-la dans <code>config.json</code> avant d'exécuter <code>docker build</code> ou <code>docker compose build</code>, parce que les langues sont choisies en temps de compilation.
  translations:
    title: Traductions
    crowdin: >-
      InvisiProxy LTS est traduit sur <crowdin>Crowdin</crowdin>, et tout le monde peut aider sans avoir besoin de programmer. Rejoignez le projet, choisissez une langue et commencez à traduire. Les traductions finies sont synchronisées dans <code>./locales/</code> automatiquement.
    rules: >-
      Consultez le <readme/> pour les règles de traduction (substitutions, balises, et termes masqués). Si votre langue ne se trouve pas sur le Crowdin, créez un problème GitHub ou posez une question sur Discord.
  tor:
    title: Configuration du routage Tor/Onion/SOCKS5
    intro: >-
      Vous avez besoin de configurer Tor (La version graphique n'est pas nécessaire, mais c'est possible de l'utiliser. Si vous utilisez ce dernier, veuillez changer le port à 9150) pour que le routage Onion fonctionne !
    guide: 'Hébergez Tor simplement avec ce guide :'
    cliGuide: 'Guide alternatif (pour invite de commandes) :'
    body: >-
      Si vous hébergez InvisiProxy LTS sur un VPS avec Ubuntu, pensez à brancher Tor avec systemctl pour une gestion plus facile lors de la production. Sur Linux ou Windows, lorsque Tor est opérationnel, il fonctionnera automatiquement avec InvisiProxy LTS lorsque activé par l'utilisateur via le menu des paramètres.
    customWisp: Les utilisateurs peuvent aussi configurer leur propre serveur Wisp dans les préférences du proxy.
    customProxy: >-
      Si vous souhaitez utiliser un proxy HTTP/HTTPS/SOCKS5 personnalisé pour router le trafic Scramjet, c'est géré sur le serveur dans <code>./src/server/wisp.ts</code>.
  proxy:
    title: Configuration du proxy
    body: >-
      L'emplacement primaire pour changer les paramètres liés au proxy web changés dans le menu des paramètres est <code>./views/assets/js/register-sw.js</code>. C'est ici que vous pouvez modifier les options de transport fournies réglées localement via un cookie, changer les proxies SOCKS5, changer les ports du routage Onion, spécifier une liste de blocage, et plus encore.
    options:
      stockSW: >-
        Le fichier de configuration de service worker par défaut pour Ultraviolet. Par contre, pour InvisiProxy, le blocage de publicités est automatiquement activé donc ce paramètre est désactivé par défaut.
      blacklistSW: >-
        Une version modifiée d'Ultraviolet qui permet de mettre en liste noire des domaines et de bloquer des publicités.
      proxyUrl: >-
        Spécifie un URL de protocole SOCKS5/HTTPS/HTTP avec une valeur par défaut du port de proxy Tor par défaut. Ceci peut être remplacé avec n'importe quel port valide ou proxy SOCKS5. Ceci est fait via l'option proxy pour Epoxy et libcurl.
      transports: >-
        Spécifie des ports à être échangés via Bare-Mux et utiliser Wisp.
      wispUrl: Modifier le nom de chemin ou le traitement des URL pour Wisp
      defaultMode: >-
        Spécifiez le transport utilisé par défaut globalement (peut quand même être changé par les utilisateurs via le menu des paramètres)
      ScramjetController: >-
        Ce constructeur vous permet de changer le préfixe utilisé pour Scramjet dynamiquement et de spécifier les emplacements de fichiers. Note : vous aurez peut-être besoin de modifier <code>./views/scram/scramjet.sw</code> lors de la modification des noms de fichier.
  navigation:
    title: Configuration de la navigation client
    body: >-
      L'emplacement principal pour les scripts de navigation côté client est <code>./views/assets/js/common.js</code>. Ce fichier est utilisé principalement pour la fonctionnalité Omnibox (moteur de recherche), pour changer les options du proxy et d'autres paramètres côté client.
    options:
      getDomain: >-
        Cette constante est utilisée pour spécifier des sous-domaines à supprimer lorsqu'on ajoute un URL dans l'Omnibox.
      goFrame: Ceci spécifie le cadre de discrétion utilisé pour InvisiProxy LTS
      sx: >-
        Cette constante détermine le moteur de recherche que vous voulez qui soie proxié lorsqu'un utilisateur tape quelque chose qui n'est pas un URL
      search: Ces fonctions spécifient et analysent les requêtes utilisées pour les URL soumis
      urlHandler: Utilisé pour régler des fonctions pour l'objet goProx.
      goProx: >-
        Cette constante permet d'associer la gestion des URL pour certains proxies ou liens qui ont besoin d'être sous un proxy web.
      prSet: Attache des écouteurs d'événement avec goProx pour les boutons ou entrées nécessaires
      huLinks: >-
        Prend automatiquement les chemins spécifiés dans <code>./views/assets/json</code> et les ajoute en fonction de la page et son utilisation. Ceci est utilisé pour cacher des liens qui créeraient des blocs de filtre et pour avoir un système plus facile pour ajouter des applis.
  structure:
    title: Structure
    summary: Pages Web
    info: Informations sur la structure
    root:
      views: >-
        La base de site physique d'InvisiProxy est ici, où les ressources statiques sont servies.
      src: Pour l'implémentation future des fonctionnalités d'obscurcissement et de l'effaçage des mots-clés.
    views: Détails de <code>/views/</code>
    folders:
      dist: est utilisé pour les fichiers minifiés. Créé lors du build.
      pages: contient le HTML du site.
      assets: est utilisé pour stocker divers fichiers CSS, JS, JSON, et des photos.
      scram: >-
        contient l'implémentation locale Scramjet respective. Les fichiers sont remplacés par le module Node.
      uv: contient l'implémentation d'UV.
    scripts: Scripts se trouvant dans <code>/views/assets/js</code>
    files:
      card: ajoute un effet visuel sophistiqué au cartes en boîte affichées sur l'écran de bienvenue.
      common: >-
        est utilisé sur toutes les pages et permet à la majorité des fonctionnalités du site de fonctionner, comme les suggestions automatiques.
      csel: >-
        gère le menu des paramètres, la fonctionnalité d'Omnibox et d'autres fonctions supplémentaires.
      loader: est utilisé en tant que ressource pour la dissimulation du DOM.
      registerSw: >-
        crée et gère les service workers qui permettent à Ultraviolet de fonctionner, et utilise aussi le transport bare.
  future:
    title: Ajouts à venir
    body: <todo>Ceci</todo> est notre liste de tâches non exhaustive pour InvisiProxy LTS.
  beginners:
    title: Explication vague pour les débutants avec proxies externes et hébergement
    intro: Premièrement, vous voudrez héberger vos proxies localement ou extérieurement.
    hosting: 'Liste de quelques bonnes options pour l''hébergement :'
    current: Fournisseur d'hébergement actuel
    paid: Payant
    freePaidDedicated: Gratuit, Payant, Dédié
    freeAndPaid: Gratuit et payant
    preference: >-
      Sur la liste de fournisseurs d'hébergement, Dedipath et Azure sont premiers de préférence. Vous pouvez aussi auto-héberger.
    cloudflare: >-
      Lorsque vous avez sélectionné un VPS, utilisez Cloudflare pour les enregistrements DNS du site et les sous-domaines pour les proxies.
    dns: >-
      Ceci est un exemple d'enregistrements DNS. L'auto-hébergement requerra des <code>Enregistrements A</code> préférablement.
    dnsAlt: Enregistrements DNS
    root: >-
      <code>@</code> et <code>www.example.com</code> sont utilisés pour InvisiProxy LTS.
    subdomain: >-
      <code>a.example.com</code> est utilisé pour d'autres services comme Libreddit ou Invidious dépendamment des besoins du responsable du site.
    local: >-
      Comme mentionné précédemment, InvisiProxy est hébergé localement avec Scramjet et Ultraviolet intégrés. Pas besoin de services externse.
  domain:
    title: Étapes de nom de domaine
    porkbun: >-
      Si vous préférez obtenir des domaines (TLDs) « premium », veuillez utiliser <porkbun>Porkbun</porkbun>. Ils offrent des domaines à bas prix. Un domaine <code>.org</code> coûte littéralement seulement 5 $ pour la première année.
  cloudflare:
    title: Étapes pour Cloudflare
    account: >-
      Utilisez Cloudflare (créez un compte), ajoutez vote site et ensuite vos cibles DNS à Cloudflare. Assurez-vous d'ajouter les serveurs de noms de Cloudflare qui seront données plus tard lors de l'ajout de votre site.
    records: >-
      Assurez-vous qu'ils soient CNAME, mais les enregistrements A fonctionnent aussi. Essayez de suivre cette structure :
    columns: Type | Nom | Cible
    ip: L'ADRESSE IP DU VPS VA ICI
    ssl: >-
      Assurez-vous que l'HTTPS est forcé et que le SSL soit en mode Flexible (si vous n'utilisez pas LetsEncrypt). Sinon, vous pouvez mettre le SSL en mode Complet.
  workspace:
    title: Configurations d'espace de travail
    vsc: >-
      Préférablement, si vous avez votre propre appareil, utilisez <vsc>Visual Studio Code</vsc>. C'est probablement la meilleure option que vous pourriez avoir mais cela est clairement une opinion. Aussi, assurez-vous d'avoir <node>Node.JS</node> installé sur votre machine.
    fork: >-
      Nous n'allons pas aller en détail avec cette partie, mais commencez par forker le dépôt. Ensuite, faites une copie locale avec un terminal en fonction du système d'exploitation que vous utilisez. Assurez-vous de vous diriger vers le dossier où vous voulez faire la configuration initiale.
    gitignore: >-
      Maintenant, ajoutez simplement le dossier où que vous avez fait une copie du dépôt dans VSC. Exécutez ensuite <code>pnpm install</code>. Si vous allez publier ceci sur GitHub, je vous recommande d'ajouter un fichier <code>.gitignore</code> avec les exclusions suivantes :
    deploy: >-
      Maintenant, vous avez votre environnement de travail configuré. Pour déployer l'environnement de travail que vous venez de créer, vous aurez besoin de le chercher en fonction de votre fournisseur d'hébergement.
    gitpod: >-
      Pour un IDE en ligne que vous pouvez utiliser sur votre ordinateur scolaire et/ou Chromebook, veuillez utiliser GitPod. C'est presque l'équivalent de Visual Studio Code mais prenant en charge le navigateur.
    gitpodAccount: 'Créez un compte :'
    gitpodFork: 'Forkez ce dépôt et tapez cet URL pour configurer votre espace de travail :'
    gitpodSteps: >-
      Utilisez les mêmes étapes ci-dessus en exécutant <code>pnpm install</code> dans votre dépôt et en ajoutant un <code>.gitignore</code> dans votre dossier root spécifiant d'exclure <code>node_modules</code>.
  faq:
    title: FAQ détaillée
    summary: FAQ rapide
    games: Où puis-je trouver les jeux pour ce dépôt ? (Erreurs 404, etc)
    gamesBody: Veuillez consulter <games>ce lien</games>.
    captcha: >-
      Pourquoi le site que je visite ne fonctionne pas correctement, ou a des erreurs de CAPTCHA ?
    captchaBody: >-
      Malheureusement, la prise en charge des captchas est intermittente sur tous les proxies. Ils sont pris en charge principalement par Scramjet. Il est donc possible que certains sites ne fonctionnent pas.
    badGateway: J'obtiens des erreurs 502. Que faire ?
    badGatewayBody: >-
      Lorsque ceci ce produit, vous pouvez soit changer de site pour résoudre le problème ou attendre un peu. Parfois, vider le cache peut aider.
    questions: >-
      Si vous avez encore des questions, pensez à les poser dans le Discord lié ici.
    domains: >-
      Pourquoi les domaines sont maintenant peu ? Est-ce que ce projet recommence à être pris en charge ?
    domainsBody: >-
      Oui, ce projet est redevenu actif pour la prise en charge LTS ! Par contre, l'approche est maintenant beaucoup plus simple pour assurer la fonctionnalité : réapprovisionnements de noms de domaine lorsque nécessaire et un code source très maintenu. Plus que jamais, ce projet sert comme preuve de concept pour les braves individus cherchant à innover dans l'espace des services de proxy web.
  closing:
    summary: Message de fermeture précédent (Original - 2022)
    announcement: >-
      Ceci n'est pas la meilleure annonce, désolé. Après beaucoup de pensée et une sévère hésitation, j'arrête Holy Unblocker et je quitte TN. C'était juste quelque chose de conflictuel pour des mois, expliquant le manque de mises à jour et les grands vides qui se sont produits l'année dernière. Je ne voulais juste pas jeter un projet que j'aimais passionnément et que je passais du temps sur tout en me faisant des amis formidables et en rencontrant des développeurs epic ici. Je pourrais faire une liste infinie pour qui ces personnes sont, mais je vais le laisser ici. Ils savent qui ils sont :D
    reasons: >-
      Le changement de pensée majeure est que je mets juste finalement une fin à cela en ce moment à cause de 1) le manque de motivation 2) la communauté n'est pas la meilleure ou la plus gentille certaines fois (il faut le dire) 3) le futur n'a pas l'air très bon pour HU/TN en tant que projet.
    secrets: >-
      Il y a certaines choses qui resteront des secrets car il y a plus de raisons à ce choix pour ceux qui trouvent que ceci n'est pas assez d'information. Mes bons amis ici vont savoir que ce choix me stressait beaucoup pour des mois. De toute façon, un bon facteur de motivation pour ce choix est ma graduation imminente.
    future: >-
      Il est possible que je continuerais/reviendrais pour ceci dans le future ou le garder sur GitHub seulement. Je laisse ceci ici parce que même maintenant je doute sur ce changement. Mais pour l'instant, j'essayerais d'autres sites comme Incognito (Duce FAIT beaucoup de mises à jour fréquentes et il est le créateur/développeur d'Ultraviolet donc donnez lui un peu d'amour) :yayy_hopi:
    patreon: >-
      Allez aussi voir son Patreon ! Aux abonnés du Patreon HU : vous ne serez pas facturés le mois prochain et le Patreon HU sera archivé donc dirigez-vous vers le Patreon de Duce pour qu'il puisse acheter plus de noms de domaine pour Incognito.
    signoff: Avec amour <3
  more:
    title: Plus d'information
    maintained: >-
      Ce projet est maintenu par l'équipe d'InvisiProxy LTS et est un site de proxy web primaire de TitaniumNetwork.
    website: Consultez le site web officiel pour plus de détails et les crédits.
    sources: 'Sources de proxy web :'
    sourcesBody: >-
      Ce projet utilise Scramjet et Ultraviolet en tant que proxys web adhérant au protocole Wisp. Bare-Mux est utilisé pour changer le système de transport utilisé avec Wisp. Les systèmes de transport inclus sont EpoxyTransport et libcurl-transport.
    wispProtocol: Protocole Wisp
    merp: Merp (Module d'obscurcissement)
    dnsBlocklists: Listes de blocage DNS hagezi
    dependencies: 'Autres dépendances :'
    mentions: 'Mentions notables :'
    hostingProvider: Fournisseur d'hébergement
  meta:
    title: Documentation InvisiProxy | Auto-hébergement, configuration, et installation de Tor
    description: >-
      Auto-hébergement d'InvisiProxy : installez-le avec pnpm, configurez le dans config.json, routez le trafic via Tor ou un proxy SOCKS5, et voyez ce que chaque dépendance fait.
    social: >-
      Gérez votre propre service InvisiProxy. Couvre l'installation, config.json, le routage Tor et SOCKS5, et les librairies que le projet utilise.
apps:
  intro: >-
    Sélectionnez un site web ci-dessous pour l'ouvrir à travers le proxy. Assurez-vous de ne pas vous connecter avec vos comptes principaux, car ceci est un service de proxy public. Il est recommandé de créer d'autres comptes et d'activer l'authentification à deux facteurs car certains sites assouplissent les restrictions sous ces exigences. Des millions de requêtes passent à travers quelques adresses IP donc certains sites pourraient bloquer l'accès.
  patreon: >-
    Pensez à rejoindre notre <patreon>Patreon</patreon> si vous désirez avoir des vitesses plus rapides et d'utiliser le trafic sous un FAI résidentiel de bonne réputation. Vous pouvez aussi activer le routage Tor ou modifier les paramètres régionaux si vous avez des problèmes. Pour que GeForce Now soit pris en charge, veuillez désactiver les annonces via les paramètres du proxy.
  faq: Consultez la page de la <faq>FAQ</faq> si vous rencontrez des problèmes avec le proxy.
  loading: Chargement des applications…
  categories:
    all: Tout
    featured: En vedette
    social: Social
    chat: Messagerie instantanée
    video: Vidéo
    music: Musique
    games: Jeux
    ai: IA
    education: Éducation
    opensource: Open source
partners:
  title: Services de partenaires
  intro: >-
    Explorez nos projets partenaires. Ces projets s'exécutent à travers le proxy, donc vous pouvez les utiliser ici sans restriction.
  features: >-
    Nos partenaires offrent des fonctionnalités comme des jeux débloqués, des ports web et de l'émulation. Tous les partenaires sont open source et gratuits à utiliser. Pensez à vous joindre à leurs communautés et les supporter si possible. Ils ont tous un modèle similaire à InvisiProxy donc assurez-vous de visiter leur Discords respectifs pour plus de liens.
credits:
  title: Crédit
  intro: >-
    InvisiProxy LTS est un service de proxy web officiel qui peut contourner les filtres web, que ce soit une extension ou le réseau.<br/>Ce projet vous permet d'accéder à du contenu autrement bloqué par les gouvernements, les écoles, ou les espaces de travail.
  name: Nom
  contributions: Contributions
  contact: Notes et informations de contact
  iconAlt: icône
  sections:
    developers: Développeurs principaux
    contributors: Contributeurs
    translators: Traducteurs
    shoutouts: Mentions
icons:
  title: Information sur les icônes
  subtitle: Comment trouver l'URL d'icône d'un site
  copy: >-
    Copiez l'URL que le bookmarklet affiche. Ensuite, retournez sur InvisiProxy et collez l'URL dans le champ d'URL d'icône. Profitez-en!
error:
  pageTitle: Erreur
  title: Erreur du site (retourner à la page d'accueil)
  reload: Rafraîchissez la page ou effectuez Ctrl+R. Cela résout beaucoup de problèmes.
  unavailable: >-
    La connection de proxy est indisponible et le serveur a rafraîchi le code source.
