home:
  title: InvisiProxy LTS | Proxy en ligne gratuit - Contourner les filtres & accéder aux sites bloqués
  description: >-
    InvisiProxy LTS est un service moderne de proxy web conçu pour contourner les filtres web et les bloqueurs. Que ce soit de la censure coté client ou sur le réseau, InvisiProxy LTS fournit un accès fluide aux sites bloqués et une navigation sécuritaire et privée sur des appareils comme des Chromebooks. Surmontez les bloqueurs de contenu, les extensions Chrome, les pare-feux, et plus avec notre proxy avancé.
  ogDescription: >-
    InvisiProxy LTS est un service de proxy web de qualité visant à surmonter les restrictions de navigateur et de réseau pour accéder aux sites web bloqués de manière sécurisée. Profitez d'une expérience de navigation fluide avec une sécurité robuste et des fonctions avancées.
  twitterDescription: >-
    Découvrez InvisiProxy LTS, un service de proxy web de qualité contournant la censure et les filtres pour fournir un accès sécuritaire aux sites web bloqués. Idéal pour la navigation privée, et pour surmonter les restrictions de réseau sur des appareils comme les Chromebooks.
  headline: Fini avec la censure Internet.
  tagline: La confidentialité a porté de main.
  browseNow: Naviguer maintenant
  bypassNow: Contourner la censure maintenant
  donate: Faire un don
  logoAlt: Logo principal InvisiProxy
  terminal:
    setup: Pour une première configuration sur une branche de production...
    start: Ou pour l'usage typique...
    dev: Pour le développement...
  free:
    title: InvisiProxy est gratuit.
    body: >-
      Étant open source, vous pouvez facilement faire une copie de ce dépôt et l'héberger vous-même pour avoir un contrôle maximal de votre confidentialité. Contrairement à plusieurs autres services de proxy web, InvisiProxy se démarque avec le chiffrement de bout-en-bout via TLS, l'isolation d'historique de navigateur, le routage Tor/Onion dans les navigateurs Chromium, la transparence complète, et le contrôle de la confidentialité. <strong>De plus, nous ne collectons pas de données d'utilisateur sur nos serveurs officiels. Même pas pour le débogage.</strong><br/>Nos dépendances open source (Wisp, Libcurl, et Epoxy) sont axées sur la protection de la vie privée et conçues pour être sécuritaires, vous garantissant une expérience de navigation confidentielle même avec des instances auto-hébergées malveillantes.
  fast:
    title: InvisiProxy est rapide et très avancé.
    body: >-
      InvisiProxy offre une performance de proxy web exceptionnelle. Il dispose de fonctionnalités robustes incluant la prise en charge de Botguard/reCAPTCHA, le réseautage Tor, le chaînage de proxies Tor, des listes de blocage personnalisables, la prévention de fuites, des préférences de dissimulation d'historique, et une prise en charge de site extensive via Scramjet et Wisp (couplé avec le transport Libcurl). D'autres services populaires comme CroxyProxy ou Proxium font souvent seulement la moitié du travail de réécriture des ressources, fuitant des requêtes tout en ayant une mauvaise confidentialité. Ce projet support aussi des fonctionnalités comme le chaînage de proxies, qui vous permet de router votre traffic via plusieurs proxies pour plus de sécurité et d'anonymité.
  practical:
    title: InvisiProxy est pratique.
    body: >-
      Grâce à notre randomisation du code source et à des projets comme les transports de proxy, Wisp, et Scramjet, ce projet fournit une expérience fluide qui contourne les filtres web, les filtres gouvernementaux, et les filtres réseau. Ce projet fonctionne contre les filtres utilisés en Chine (GFW - Grand Pare-feu de Chine), en Russie, et plus, <strong>sans aucun téléchargement</strong>. Ceci est réalisé entièrement dans votre navigateur en tant que site web et notre backend (ou le votre si vous hébergez le projet vous-même), permettant aux utilisateurs de contourner même la censure la plus invasive. Aucun téléchargement requis : il suffit de taper le domaine pour InvisiProxy, visiter le site officiel d'InvisiProxy pour obtenir des liens miroirs si il est bloqué, et naviguer dans l'anonymat.
  heroSubtitle: Gratuit et transparent pour l'usage
  designedWithPrivacy: Conçu avec confidentialité<underline/>.
  overview:
    title: Aperçu
    body: >-
      InvisiProxy, un service expérimental de proxy web, peut contourner les filtres web ou les bloqueurs de contenu, que la censure soit côté client ou sur le réseau. Cela inclut la possibilité de contourner les bloqueurs de contenus à l'étranger mis en place par les gouvernements (China/GFW, Russie, etc), les extensions Chrome, les pare-feux client localisés, et les filtres réseau.
    donate: >-
      S'il vous plait, pensez à faire un don pour que le service puisse rester gratuit ! Nous offrons plus de domaines, l'accès bêta, des domaines personnels et des requêtes de fonctionnalité en priorité.<br/>Vous pouvez faire un don <patreon>sur Patreon</patreon>.
    patreonLabel: Faire un don sur Patreon
    imageAlt: Icône du serveur
  intent:
    title: Intention
    body: >-
      Ce projet sert de preuve de concept pour la solution sans client idéale pour contourner la censure. Étant un service de proxy web sécurisé, il supporte de nombreux sites tout en restant mis à jour fréquemment et se concentrant sur les détails avec le design, les mécanismes, et les fonctionnalités.
    palette: >-
      La palette de ce projet est conçu avec le <nord>Thème Nord</nord> pour sa palette de couleur optimale et sa priorisation de la syntaxe du code et les composantes de l'interface utilisateur lisibles.
    imageAlt: Icône de code
  usage:
    title: Usage
    body: >-
      Rendez-vous sur la page <browse>de navigation</browse> et sélectionnez un proxy en vedette ! Ensuite, tapez le site que vous désirez accéder dans le champ de recherche. Chaque proxy web a son propre niveau d'efficacité, de vitesse, et de sécurité. C'est recommandé d'utiliser Scramjet.<br/><br/>Exemple de site web à débloquer: <code>https://youtube.com</code>
    imageAlt: Icône de bouclier
  apps:
    title: Applis
    body: >-
      InvisiProxy offre une collection d'applications déjà connectées, incluant YouTube, Spotify, GeForce NOW, Discord, ChatGPT, Gemini et plus !
    imageAlt: Icône de l'application
  hosting:
    title: Hébergement et déploiement
    body: >-
      <strong>InvisiProxy LTS</strong> est une solution open source conçue avec la modularité, la facilité d'utilisation, et le déploiement facile à l'esprit. Les fonctionnalités clés incluent le blocage d'annonces, la génération flexible de code source, et une navigation proxy avancée.<br/><br/>Pour des instructions de configuration compréhensives, visitez notre <github>dépôt GitHub</github> officiel ou la <docs>documentation intégrée fournie ici</docs>.
    docsTitle: Informations supplémentaires pour l'hébergement
    imageAlt: Icône d'hébergement et de déploiement
    imageTitle: Hébergement et déploiement pour InvisiProxy LTS
  contributing:
    title: Contribuer
    body: >-
      <strong>InvisiProxy LTS</strong> s'épanouit grâce aux efforts acharnés de nos merveilleux contributeurs. Étant un projet open source, <strong>InvisiProxy LTS</strong> dépend sur la passion de sa communauté pour contourner la censure Internet et aider les utilisateurs à améliorer l'accès à l'information.
    start: Pour commencer à contribuer, visitez notre <github>dépôt GitHub.</github>
    imageAlt: Icône de contribution GitHub
    imageTitle: Contribuer à InvisiProxy LTS sur GitHub
  githubTitle: Dépôt GitHub de InvisiProxy LTS
  bypass:
    title: Contourner la censure et les filtres
    body: >-
      InvisiProxy LTS est un projet open source <strong>de proxy web</strong>. Profitez d'un accès sans restriction au contenu en ligne et à la navigation avec nos fonctionnalités de <strong>déblocage proxy web</strong> avancées. Ce projet vous permet aussi de l'auto-héberger partout et contourner les blocage nationaux/régionaux comme la Chine (Grand Pare-feu de Chine - GFW) et la Russie.
  freeProxy:
    title: Proxy 100 % gratuit en ligne
    body: >-
      Bénéficiez de notre <strong>service de proxy gratuit</strong> qui vous aide à <strong>débloquer des sites web</strong> et à accéder au contenu bloqué. Parfait pour contourner les filtres éducationnels et/ou les filtres d'environnement professionnel, ce projet est fait pour tout débloquer.
  tor:
    title: Utilisez le routage Tor dans les navigateurs Chromium & Firefox
    body: >-
      Avec InvisiProxy LTS, vous pouvez <strong>accéder au réseau Tor</strong> directement sur votre navigateur Chromium/Firefox. Cela signifie que vous pouvez accéder à des sites <strong>.onion</strong> directement dans ce service web. Cela vous permet de naviguer le web en tout anonymat (du moins en partie ; le vrai Tor a de meilleurs systèmes de prévention d'empreinte du navigateur), contournant tous les restrictions régionales. De plus, ce projet prend en charge la configuration de proxies SOCKS5 personnalisés pour faire une chaîne de proxies.
