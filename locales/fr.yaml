    Router le trafic du proxy à travers votre propre serveur Wisp pour un contrôle de la confidentialité plus élevé. Si vous désirez router votre trafic via l'auto-hébergement, ceci est une méthode facile. Utilisez le frontend ici, mais dirigez le trafic respectif vers vos propres serveurs. Laissez le vide pour le désactiver.
