  hideHistoryDescription: Cacher l'historique de navigation local. Les réseaux peuvent quand même voir l'historique, mais il passe à travers un proxy.
  randomizeFingerprint: Empreinte du navigateur aléatoire
  randomizeFingerprintDescription: >-
    Utilise un navigateur aléatoire pour chaque session d'onglet et ajoute du bruit au canvas, WebGL, et aux lectures de CPU et de mémoire. Un agent utilisateur personnalisé prend quand même le dessus. Pourrait briser certains sites.
