      Si vous voulez héberger InvisiProxy LTS vous-même veuillez changer à la branche de PRODUCTION pour des fonctions d'évasion de filtres activées automatiquement. La branche master aura des changements en cours qui ne sont pas prêts pour l'auto-hébergement. Par contre, si vous voulez contribuer à ce projet veuillez faire un PR à la branche master.
  tip:
