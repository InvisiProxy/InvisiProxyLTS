faq:
  meta:
    title: FAQ InvisiProxy | Erreurs réseau, CAPTCHAs, et solutions pour YouTube
    description: >-
      Erreur réseau, pages vides, boucles CAPTCHA, ou YouTube ne chargeant pas ? Des solutions pour les problèmes InvisiProxy les plus communs, et si c'est sécuritaire de se connecter aux sites.
    social: >-
      Solutions rapides pour les erreurs réseaux, les pages vides, les boucles CAPTCHA, et des réponses à propos de la prise en charge Discord et se connecté de façon sécurisée.
  title: Foire aux questions
  search: Recherche
  searchLabel: Rechercher les questions fréquemment posées
  icons:
    question: Comment obtenir des URL d'icône pour le menu de dissimulation d'onglets ?
    bookmarklet: >-
      Visitez le site que vous voulez utiliser pour l'icône, et utilisez ce bookmarklet (fait le glisser vers votre barre de favoris) :
    button: Trouver l'URL d'icône
    copy: >-
      Copiez l'URL que le bookmarklet affiche. Ensuite, retournez sur InvisiProxy et collez l'URL dans le champ d'URL d'icône. Profitez-en!
  networkError:
    question: >-
      Pourquoi est-ce que j'obtiens une "Erreur réseau" ou une Erreur de site à chaque fois que j'utilise le proxy ?
    answer: >-
      Ceci est une erreur connue avec nos proxies web modernes. À cause du nombre élevé d'utilisateurs que nous recevons, la connexion est coupée après dix minutes d'inactivité sur l'onglet. Pour résoudre le problème, cliquez sur le bouton Rafraîchir la page, et rafraîchissez la page pour résoudre le problème.
    note: >-
      En général, ceci se produit lorsque vous utilisez le proxy pour la première fois. Nous travaillons sur un futur correctif pour ce problème.
  bot:
    question: >-
      J'ai de la difficulté à me connecter aux sites ou à consulter du contenu car le site détecte que je suis un bot.
    answer: >-
      Durant les heures de trafic intense, ceci est très commun parce que toutes les requêtes passent via seulement deux adresses IP. La solution est de changer de région ou d'activer le routage via Tor. Vous pouvez aussi rejoindre notre Patreon pour avoir accès à un serveur avec un FAI résidentiel pour éviter cette erreur.
  unreachable:
    question: >-
      J'ai une erreur similaire à : "'cdn.example.com' ne peux pas être rejoint."
    answer: >-
      Rafraîchissez la page. Si cela ne fonctionne pas la première fois, utilisez simplement le bouton retour du navigateur ou retournez à la page Scramjet et réessayez.
  blank:
    question: Pourquoi mon site charge partiellement ou tout simplement pas ?
    answer: >-
      Ce ne sont pas tous les sites web qui sont pris en charge. Naturellement, c'est à cause des vastes étendues du web avec plusieurs technologies et méthodes de chargement différentes. Si vous avez un problème avec un site spécifique, veuillez nous le reporter sur notre groupe Discord ou sur GitHub. Sinon, essayez toutes nos options de proxy pour voir si l'une d'entre elle fonctionne avec le site en question.
  idb:
    question: >-
      J'obtiens une erreur se référant à une base de données IDB (Problème de Scramjet V1)
    answer: >-
      Cela se produit typiquement lorsque nous mettons le projet à jour. Appuyez simplement sur l'icône (i) dans le coin en haut à gauche de votre navigateur (ou sur le symbole de cadenas) et sélectionnez « Vider les données du site » ou « Vider les cookies et les données du site > Gérer les données de site > Icône de poubelle ». Cela videra la base de données IndexedDB et vous permettra de recommencer à utiliser le proxy.
  discord:
    question: Est-ce que Discord est pris en charge ?
    answer: Oui, Discord est pris en charge.
    note: >-
      Par contre, il y a des limitations avec les proxies gratuits. Assurez-vous de ne pas utiliser votre compte principal si vous n'êtes pas en train d'héberger le service vous-même ou d'utiliser un petit domaine.
  youtube:
    question: Pourquoi les vidéos YouTube ne fonctionnent pas ?
    answer: >-
      Si vous avez des problèmes persistants même après avoir essayé les étapes ci-dessus, il est possible que le serveur soit temporairement indisponible, surtout si des grands groupes de personnes ont le même problème. Ce problème ne se produit pas si vous hébergez le projet vous-même.
    tor: >-
      Essayez de sélectionner l'option « Tor » ; cela pourrait résoudre le problème mais réduire considérablement les vitesses de chargement.
  login:
    question: Est-il sécuritaire pour moi de me connecter aux sites ?
    answer: >-
      Oui, la connexion aux sites est sécuritaire. Par contre, nous vous recommandons de ne pas vous connecter à des sites qui ne vous inspirent pas confiance ou d'utiliser des comptes personnels à cause du trafic élevé étant routé sur un seul domaine. Nous essayons d'atténuer ce problème en changeant les adresses IP, mais c'est juste une pratique courante de ne pas utiliser vos comptes personnels sur des proxies publics. Par contre, lors de l'auto-hébergement, vous pouvez le faire avec facilité. Vous pouvez aussi rejoindre le Patreon pour utiliser un FAI résidentiel et éviter ce problème.
  captcha:
    question: >-
      Pourquoi le site que j'utilise ne fonctionne pas correctement ou a des erreurs de CAPTCHA ?
    answer: >-
      Scramjet prend en charge les CAPTCHAS mais cela nécessite de l'essai et erreur. En effet, Scramjet est souvent trop rapide et le CAPTCHA est naturellement très instable. La solution est de continuer à essayer jusqu'à ce que ça fonctionne. Essayez de ne pas aller trop vite.
  youtubeBlank:
    question: >-
      Pourquoi la page reste-t-elle blanche ou ne charge pas complètement lorsque j'utilise YouTube sur les sites proxy ?
    answer: 'Il y a deux façons de résoudre le problème :'
    reload: >-
      Normalement, rafraîchir la page lorsque l'erreur ci-dessus se produit devrait charger la vidéo.
    reloadFrame: >-
      Ou faire un clic droit sur la page et appuyer sur <code>Rafraîchir le cadre</code> si vous utilisez une sorte de mode discret.
privacy:
  title: Politique de confidentialité
  subtitle: InvisiProxy LTS, un service de proxy Web privé.
  effective: "Date d'entrée en vigueur : 16/07/2021"
  updated: 'Date de mise à jour : 26/11/2026'
  what:
    title: Qu'est-ce qu'InvisiProxy ?
    body: InvisiProxy LTS est un proxy web qui fonctionne dans votre navigateur. Au lieu d'ouvrir un site directement, vous l'ouvrez par le proxy, si bien que votre réseau ne voit que celui-ci. Les sites bloqués par votre réseau, votre école ou votre gouvernement redeviennent accessibles, et les sites Tor/Onion s'ouvrent dans n'importe quel navigateur. Rien à télécharger, rien à installer.
  data:
    title: Quelles données sont collectées ?
    body: "InvisiProxy ne consigne pas votre navigation. Le serveur Wisp fonctionne sans journal des connexions : aucune adresse, aucune destination, aucun enregistrement. La configuration nginx livrée avec ce projet désactive les journaux d'accès sur les chemins du proxy, et aucun journal n'est écrit sur le disque.<br/><br/>Une exception, en mémoire uniquement : le bouton des liens miroirs retient votre adresse pendant cinq secondes pour empêcher le spam. Elle n'est jamais écrite sur le disque et ne laisse aucune trace.<br/><br/>Les attaques et les floods sont gérés par des limites de débit et des plafonds de connexions, pas par des journaux. La journalisation par connexion existe comme option de débogage, mais elle est désactivée par défaut dans toutes les configurations livrées par ce projet.<br/><br/>Les requêtes DNS sont résolues sur le serveur. Le choix du fournisseur DNS appartient à l'opérateur ; ce projet ne rajoute aucun journal par-dessus.<br/><br/>Le site officiel est servi via Cloudflare. Comme tout CDN, il voit votre adresse IP et l'adresse de chaque requête ; la manière dont ces données sont traitées est décrite dans la politique de confidentialité de Cloudflare.<br/><br/>Rien de tout cela ne doit être pris sur parole : tout est open source, et vous pouvez héberger le projet vous-même pour contrôler l'ensemble de la pile."
  security:
    title: Sécurité
    body: "Wisp transporte chaque flux qu'ouvrirait normalement votre navigateur sur une seule WebSocket vers le serveur proxy, où les vraies connexions sont établies. En bref :"
    performance: 'Rapidité : Wisp envoie les données des sites comme de simples frames WebSocket, les pages restent rapides.'
    compatibility: 'Compatibilité : des transports ouverts comme Libcurl gardent le proxy compatible avec un large éventail de sites et de services.'
    censorship: 'Résistance à la censure : le protocole est conçu pour que les filtres aient du mal à voir et à bloquer ce que vous ouvrez.'
    fingerprinting: 'Empreintes : le proxy inverse randomise ses réécritures, si bien que les sessions sont plus dures à distinguer et le proxy plus dur à bloquer.'
    encryption: 'Chiffrement : les sites HTTPS restent chiffrés de bout en bout entre vous et eux, et la connexion Wisp elle-même tourne en wss:// (TLS) sur le site officiel. Une partie de la pile de réécriture est encore en construction ; cette section grandira avec elle.'
    transparency: 'Open source : tout ce qui précède peut être vérifié dans le dépôt, et les changements sont publics.'
  advertising:
    title: Publicités
    body: "Les domaines gratuits affichent des publicités pour couvrir les coûts d'hébergement. Les instances Patreon sont toujours sans publicités. Les annonces sont servies par des réseaux tiers : Adsterra, Adcash et Monetag. Elles n'apparaissent que sur les pages et écrans de chargement d'InvisiProxy, jamais dans les sites que vous naviguez via le proxy.<br/><br/>Lorsqu'une publicité charge, son réseau reçoit votre adresse IP, votre agent utilisateur et la page sur laquelle vous êtes, et peut poser ou lire ses propres cookies. Le traitement de vos données relève de leurs politiques de confidentialité, pas de celle-ci.<br/><br/>Un bloqueur de publicités arrête tout cela ; uBlock Origin fonctionne, ou utilisez une instance Patreon."
  usage:
    title: Ce qui est stocké sur votre appareil
    storage: "Vos réglages, onglets et favoris vivent dans votre navigateur : cookies, localStorage, sessionStorage et IndexedDB. Ils ne quittent jamais votre appareil et rien de tout cela ne sert à l'analyse."
    cookies: Si vous refusez les cookies dans votre navigateur, des fonctions comme les onglets, les favoris ou le menu des réglages cessent de fonctionner, faute d'endroit où les sauvegarder. Rien n'est stocké pour le pistage ; seules les fonctions du proxy en dépendent (cache et état de session Scramjet, onglets, favoris, saisie semi-automatique, dissimulation d'onglets, préréglages d'icônes, options de transport, moteurs de recherche, thèmes, langue, type de fenêtre, routage Tor, changement de région, masquage des publicités, historique caché, blocage des fuites de fenêtre, blocage WebRTC et randomisation de l'empreinte).
    serviceWorkers: Un service worker s'intercale entre les pages et le réseau ; le proxy en a besoin pour acheminer le trafic. Effacer le stockage du site le supprime aussi.
    consent: Utiliser le site vaut acceptation du stockage ci-dessus, plus les cookies des partenaires publicitaires là où la loi n'exige pas votre consentement séparé.
  changes:
    title: Changements
    body: Cette politique peut changer ; la date de mise à jour en haut vous dit quand c'est arrivé. Cette page énonce toujours la politique en vigueur.
  contact:
    title: Contact
    body: 'Des questions sur cette politique, ou une demande de données ou de confidentialité : écrivez à'

rivacy:
  title: Politique de confidentialité
  subtitle: InvisiProxy, un service de proxy Web privé.
  effective: 'Date d''entrée en vigueur : 16/07/2021'
  updated: 'Date de mise à jour : 31/10/2026'
  what:
    title: Qu'est-ce qu'InvisiProxy ?
    body: >-
      InvisiProxy LTS est un service de proxy web vous permettant d'accéder à des sites web qui pourraient avoir été bloqués par votre réseau, gouvernement ou politique dans votre navigateur, sans téléchargement ou configuration. Cela se passe en toute sécurité avec des fonctionnalités de confidentialité supplémentaires. Consultez des sites Tor/Onion sur n'importe quel navigateur, cachez votre historique de navigation et contournez les filtres. Cela inclut la capacité de contourner les bloqueurs de contenu des gouvernements, des extensions Chrome, des pare-feu client localisés, et les filtres réseau.<br/>Ce projet sert majoritairement comme preuve de concept pour la solution sans client idéale pour contourner la censure.
  data:
    title: Est-ce que des données sont collectées ?
    body: >-
      InvisiProxy lui-même ne trace et ne collecte pas votre historique de navigation. Le traçage est désactivé pour s'assurer de la confidentialité des utilisateurs sur le côté backend. La seule exception est le bouton de liens miroir, qui garde votre adresse IP en mémoire pour quelque secondes pour empêcher l'abus; elle n'est jamais écrite sur le disque dur. Nos partenaires de publicité sur les domaines soutenus par les annonces collectent leur propres données, comme décrit ci-dessous sous Publicités. Les requêtes NextDNS sont ajustées pour ne pas tracer ou stocker les IP en Suisse. La conservation du traçage de NextDNS pour les valeurs numériques respectives est minime et est mis au point pour s'assurer que le service opère fluidement. Ce projet utilise Cloudflare pour augmenter la performance et pour avoir une gestion DNS plus facile à cause de l'étendue de ce projet. À un minimum, les valeurs numériques de Cloudflare sont utilisées pour tracer les visites et les visionnements de page indiquant lorsque les mises à niveau de serveur sont nécessaires. NGINX est configuré pour stocker aucun log. InvisiProxy LTS valorise sa déclaration d'en finir avec la censure Internet tout en valorisant la confidentialité utilisateur. En dehors de cela, le protocole Wisp (pour proxier les connections TCP) est utilisé avec le transport libcurl pour le chiffrement de bout en bout en exécutant SSL/TLS dans WebAssembly. Ce service est fait pour être le plus transparent possible. N'oubliez pas que vous pouvez héberger le projet vous-même en tout temps pour assurer votre contrôle total.<br/><br/>Si vous voulez faire une déclaration ou une requête de confidentialité veuillez nous contacter via Discord.
  security:
    title: Sécurité
    body: >-
      InvisiProxy LTS est dévéloppé à partir de zéro pour assurer un service de proxy web sécurisé et fiable à ses utilisateurs. Une des technologies principales derrière InvisiProxy LTS est le nouveau protocole Wisp, développé par Mercury Workshop.<br/><br/>Ce protocole amène plusieurs fonctionnalités et améliorations innovantes qui contribuent à la vitesse et la sécurité du service comparée aux modèles précédents.
    intro: >-
      Le protocole Wisp est conçu pour gérer les demandes du trafic web moderne tout en maintenant des normes de sécurité élevées. En choisissant Wisp, ce projet bénéficie des avantages suivants :
    performance: >-
      Performance : le protocole Wisp optimise les vitesses de transfert de données TCP, assurant ainsi aux utilisateurs une latence minimale lors de la navigation.
    compatibility: >-
      Compatibilité : Wisp est conçu pour être compatible avec plusieurs technologies web, assurant un accès fluide à divers sites web et services en ligne. Ceci est fait grâce à la prise en charge de plusieurs transports open source du protocole (Transport Libcurl).
    censorship: >-
      Résilience à la censure : le protocole est conçu pour contourner des techniques de censure sophistiquées employées par des réseaux restrictifs, permettant aux utilisateurs d'accéder au contenu bloqué avec facilité.
    fingerprinting: >-
      Résistance à l'empreinte : Ce projet a des mécanismes forts de résistance à l'empreinte dans sa configuration de proxy inverse pour les serveurs officiels. Cela signifie que le proxy est conçu pour minimiser les identifiants uniques qui peuvent être utilisés pour tracer ou identifier les utilisateurs si bien que la confidentialité augmente. InvisiProxy suit les meilleures pratiques de l'industrie et en met ses méthodes à jour constamment de sorte que les utilisateurs peuvent naviguer en tout anonymat sans laisser de traces identifiables.
    transparency: >-
      Transparence : La transparence est un principe clé pour InvisiProxy LTS. Le projet opère avec un modèle open-source, permettant à la communauté d'examiner et de contribué au code source. Cette ouverture ne crée pas seulement de la confiance mais ouvre la porte à l'amélioration continue via la rétroaction et la collaboration de la communauté. En adhérant à des pratiques transparentes, InvisiProxy LTS s'assure que les utilisateurs sont conscients de la façon dont leur données sont gérées et quelles mesures sont en place pour protéger leur confidentialité.
    randomisation: >-
      Randomisation du code source/globale : De façon à renforcer la sécurité et la confidentialité, InvisiProxy LTS utilise la randomisation du code source et la randomisation globale. Cela permet au projet de rester débloqué pour plus longtemps sur des domaines et d'améliorer l'anonymat lors de la navigation. Les proxy web typiques vont laisser des traces lors de la réécriture des ressources, mais avec cette méthode, c'est beaucoup plus difficile de détecter le proxy et de le bloquer.
    encryption: >-
      Chiffrement : InvisiProxy LTS utilise des technologies de proxy avancées qui se concentrent sur le chiffrement de bout en bout et le transfert de données sécuritaires, particulièrement dans le contexte de proxies réécrivant l'URL. NOTE : Ceci est encore un travail en cours massif et nous sommes ouverts aux contributions.
    audits: >-
      Audits réguliers : nous menons des audits de sécurité réguliers pour identifier et combattre de possibles vulnérabilités.
  advertising:
    title: Publicités
    body: >-
      Certains domaines d'InvisiProxy affichent des publicités pour couvrir les coûts de l'hébergement. Les instances Patreon sont toujours sans publicités. Les annonces sont servies par des réseaux tierces : Adsterra, Adcash, et Monetag. Les publicités apparaissent seulement sur les pages et les écrans de chargement d'InvisiProxy, jamais dans les sites que vous naviguez via le proxy.<br/><br/>Lorsqu'une publicité charge, le réseau reçoit votre adresse IP, votre agent utilisateur de navigateur, le domaine que vous visitez et des détails techniques similaires, et pourrait créer ou lire ses propres cookies ou utiliser des technologies similaires pour afficher des annonces, limiter comment souvent vous les voyez, pour mesurer la performance et prévenir la fraude. Ces réseaux pourraient exécuter leur code sur nos pages : leur manipulation des données est gouvernée par leurs propres politiques de confidentialité, pas la notre.<br/><br/>Vous pouvez bloquer les annonces avec un bloqueur de contenu comme uBlock Origin, ou utiliser une instance Patreon.
  usage:
    title: Usage supplémentaire
    storage: >-
      InvisiProxy utilise des « cookies », IndexedDB, localStorage, et sessionStorage pour maintenir une session d'utilisateur (décrit en plus grand détail ci-dessous) et stocker vos préférences sur votre ordinateur. Toute cette information demeure sur votre appareil et InvisiProxy ne l'utilise pas pour des analytiques. Les partenaires publicitaires pourraient stocker leur propres cookies, comme décrit sous Publicités.
    cookies: >-
      Un cookie est un bout d'information qu'un site web stocke sur l'ordinateur du visiteur, et que le navigateur du visiteur passe au site web à chaque fois que le visiteur y retourne. InvisiProxy utilise les cookies pour s'assurer de l'utilisabilité du menu des paramètres, et finalement pour les préférences utilisateur. Les utilisateurs qui ne veulent pas avoir des cookies stockés sur leurs ordinateurs devraient configurer leur navigateurs pour refuser les cookies avant d'utiliser les sites web d'InvisiProxy, avec l'inconvénient que certaines fonctions d'InvisiProxy NE VONT PAS fonctionner correctement sans les cookies, localStorage, ou IndexedDB. Aucun cookie, IndexedDB, localStorage, ou fonctionnalités de sessionStorage sont stockées à des fins d'analyse par InvisiProxy ; Seulement les fonctionnalités (Scramjet (Cache des ressources proxiées, état de la session, etc.), Onglets, Favoris, Saisie semi-automatique (Proxiée), Menu des paramètres : Dissimulation d'onglets, préréglages d'icône, Options de transport, Moteurs de recherche, Personnalisation, Langue, Type de fenêtre, Routage Tor, Changement de région, Masquer les publicités, Historique caché, Bloquer les fuites de fenêtre, Bloquer WebRTC, et la randomisation de l'empreinte) les utilisent pour stocker des données persistantes localement.
    serviceWorkers: >-
      De plus, InvisiProxy utilise des Service Workers comme technologie pour nos proxies web. Cela permet d'intercepter le trafic de réseau respectif, etc. et est une fonction principale du projet.
    consent: >-
      En continuant à consulter notre site web sans changer vos paramètres de cookie, vous comprenez et acceptez à l'usage d'InvisiProxy des cookies et aux cookies des partenaires publicitaires décrits ci-dessus, lorsque la loi n'exige pas votre consentement séparé.
  changes:
    title: Note de fin
    body: >-
      Même si la majorité des changements seront probablement mineurs, InvisiProxy pourrait changer sa politique de confidentialité de temps en temps, et dans la seule discrétion d'InvisiProxy LTS. InvisiProxy LTS encourage les visiteurs à vérifier cette page fréquemment pour des changement à la politique de confidentialité. Votre usage continué de ce site après un changement de cette politique de confidentialité constituera un consentement à la politique modifiée. Dans le cas d'abus ou d'attaques DDoS, InvisiProxy LTS pourrait être forcé à tracer des données temporairement pour atténuer l'impact de l'attaque et s'assurer que le service reste opérationnel. Les données tracées seront supprimées de manière sécuritaire suite à l'atténuation de l'attaque.
  contact:
    title: Informations de contact et Crédit
    body: >-
      Si vous avez des questions à propos de notre politique de confidentialité, veuillez nous contacter via email au
docs:
  chemical: >-
    Essayez <chemical>Chemical</chemical> si vous voulez créer votre propre service de proxy web à partir de zéro.
  chemicalButton: Créez votre propre proxy web avec Chemical
  formerly: Précédemment Holy Unblocker LTS
  badges:
    ci: État de GitHub Actions
    dockerVersion: Version de l'image Docker
    dockerPulls: Pulls Docker
  intro: >-
    <strong>InvisiProxy LTS</strong> (précédemment Holy Unblocker LTS) est un service expérimental de proxy web qui peut contourner les filtres web ou les bloqueurs de contenu, que la méthode de censure soit côté client ou sur le réseau. Cela inclut la capacité de contourner les bloqueurs de contenu des gouvernements, des extensions Chrome, des pare-feux client localisés, et les filtres réseau. Le projet permet même de consulter des sites Tor/Onion dans tous les navigateurs (même Chromium) à travers un site web !
  star: Vous pouvez soutenir InvisiProxy en laissant une étoile sur le dépôt !
  about: >-
    Ce projet sert majoritairement de preuve de concept pour la solution sans client idéale pour contourner la censure. Un bon cas d'utilisation pour ce projet serait si vous auriez besoin d'un moyen d'utiliser Tor, de changer de région lors de la navigation (ou d'utiliser un proxy externe), de naviguer sur des sites web sans créer de comptes (réduit l'empreinte numérique), de contourner le blocage d'annonces, et/ou de laisser des traces minimales d'activité de l'appareil. Hébergez simplement ce projet sur n'importe quel nom de domaine et ayez une solution alternative à un VPN sans avoir besoin de télécharger quoi que ce soit sur cet appareil. Étant un service de proxy web sécuritaire, il supporte plusieurs site tout en étant mis à jour fréquemment et se concentrant sur étant facile à héberger soi-même. InvisiProxy LTS fonctionne avec un grand nombre de sites, incluant YouTube, Gemini, ChatGPT, Discord, GeForce NOW et plus ! Ce projet a aussi plusieurs fonctions exclusives pour contourner les filtres web (dissimulation du DOM et randomisation des sources) et la censure globale des sites. Les pays pris en charge sont la Chine (GFW) et la Russie.
  users: >-
    Plus de 30 millions d'utilisateurs depuis 2020. Merci beaucoup pour le soutien, je ne pouvais jamais avoir imaginé comment massive la communauté de proxy web était devenue.
  branches:
    current: 'Branche actuelle : la plus récente'
    title: Types de branche
    latest: Récente (master ; construit pour FOSS et le SEO)
    beta: Bêta (changements en attente ; des changements qui pourraient briser des choses)
    production: >-
      Production (v4, v5, v6 ; la version stable d'InvisiProxy LTS. Des changements ont été faits pour l'auto-hébergement dans des contextes de production ; évasion de filtres maximale et traitement des requêtes)
    switch: Considérez, pour l'auto-hébergement, de choisir une branche de production !
  selfHost: >-
    Consultez les <deploy>options d'auto-hébergement</deploy> si vous souhaitez héberger ce projet. Vous ne pouvez utiliser les options gratuites ? Essayez Koyeb ou des solutions de VPS bon marché. Si vous ne voulez pas auto-héberger veuillez cliquer sur le menu de liens miroirs d'InvisiProxy.
