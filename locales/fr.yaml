    restart: Et bien sûr, si vous avez utilisé NGINX ou caddy, redémarrez-le ou rechargez-le
  config:
    title: Configuration
    server: Configuration du serveur
    port: >-
      Le PORT par défaut du proxy au démarrage est
      <code>http://localhost:8080</code>. Vous pouvez modifier le PORT et
      d'autres paramètres de production si nécessaire dans
      <code>./ecosystem.config.js</code>.
    local: >-
      Toutes les autres modifications locales (randomisation du code source,
      minification automatique, etc.) se trouvent dans
      <code>./config.json</code>.
    options:
      minifyScripts: >-
        Minifier automatiquement les ressources statiques concernées au
        démarrage du serveur.
      randomizeIdentifiers: >-
        Activer la randomisation expérimentale des variables globales du proxy
        pour Ultraviolet. Cela réduit les risques que UV soit détecté par des
        filtres basés sur des extensions.
      production: >-
        Utiliser une configuration de production préparée pour l'hébergement
        sur serveur. Le contrôle du cache et la réécriture du code source sont
        configurés automatiquement.
      disguiseFiles: >-
        Activer le DOM Masquerading, qui dissimule les véritables récupérations
        de contenu d'InvisiLTS. Cela se fait en déguisant les requêtes, en les
        décompressant, puis en reconstruisant l'arbre DOM.
      usingSEO: >-
        Activer la randomisation du code source, qui modifie le code en
        échangeant des fragments de données définis dans
        <code>./src/data.json</code>. Très utile pour masquer les mots-clés qui
        signaleraient ou bloqueraient automatiquement InvisiProxy LTS, et pour
        éviter les blocages basés sur le code source.
      verbose: >-
        Active les messages de compilation et de build pour suivre la
        progression et repérer d'éventuels problèmes pendant la compilation.
      mirrorLinksFile: >-
        Fichier réservé au serveur, utilisé par le distributeur de la page des
        liens ; par défaut <code>private/mirror-links.txt</code>. Les chemins
        relatifs sont résolus à partir de la racine du projet ; les chemins
        absolus sont aussi pris en charge. Indiquez une URL HTTP(S) par ligne et
        gardez le fichier en dehors de <code>views/</code> pour qu'il ne soit pas
        servi publiquement. Redémarrez le serveur après avoir modifié ce
        paramètre.
      geoLanguage: >-
        Active la sélection automatique de la langue via l'en-tête
        <code>CF-IPCountry</code> de Cloudflare. N'activez cette option que
        derrière Cloudflare, car sinon n'importe qui peut définir cet en-tête.
        Les pays sont listés par langue sous <code>language.countries</code>
        dans chaque fichier <code>./locales/*.yaml</code>.
      singleLanguage: >-
        Lorsque cette option vaut <code>true</code>, seule la langue définie dans
        <code>language</code> est compilée et tous les visiteurs la reçoivent, le
        paramètre de langue étant masqué. Pratique pour Docker ou d'autres
        déploiements qui n'ont besoin que d'une langue, car les builds sont plus
        rapides et plus légers. Par défaut : <code>false</code>.
      language: >-
        La langue à compiler lorsque <code>singleLanguage</code> est activé,
        correspondant à un fichier de <code>./locales/</code> (par ex.
        <code>en</code> pour <code>en.yaml</code>). Par défaut :
        <code>en</code>. Pour Docker, définissez-la dans
        <code>config.json</code> avant de lancer <code>docker build</code> ou
        <code>docker compose build</code>, car les langues sont choisies au
        moment du build.
  translations:
    title: Traductions
    crowdin: >-
      InvisiProxy LTS est traduit sur <crowdin>Crowdin</crowdin>, et tout le
      monde peut aider sans toucher au code. Rejoignez le projet, choisissez une
      langue et commencez à traduire. Les traductions terminées sont
      automatiquement synchronisées dans <code>./locales/</code>.
    rules: >-
      Consultez <readme/> pour les règles de traduction (placeholders, balises
      et termes masqués). Si votre langue n'est pas proposée sur Crowdin, ouvrez
      une issue ou demandez sur le Discord.
  tor:
    title: Configuration du routage Tor/Onion/SOCKS5
    intro: >-
      Vous devez installer Tor (pas besoin d'interface graphique, mais ça
      fonctionne aussi avec. Avec l'interface graphique, remplacez le port 9050
      par 9150) pour que le paramètre de routage Onion fonctionne !
    guide: 'Hébergez simplement Tor en suivant ce guide :'
    cliGuide: 'Guide alternatif (en ligne de commande) :'
    body: >-
      Si vous hébergez InvisiProxy LTS sur un VPS sous Ubuntu, pensez à
      rattacher Tor à systemctl pour faciliter la gestion en production. Une
      fois Tor lancé sous Linux ou Windows, il fonctionnera automatiquement avec
      InvisiProxy LTS lorsque l'utilisateur l'activera dans le menu des
      paramètres.
    customWisp: Les utilisateurs peuvent aussi définir leur propre serveur Wisp dans les préférences du proxy.
    customProxy: >-
      Si vous souhaitez utiliser un proxy HTTP/HTTPS/SOCKS5 personnalisé pour
      faire transiter le trafic de Scramjet, cela se gère côté serveur dans
      <code>./src/server/wisp.ts</code>.
  proxy:
    title: Configuration du proxy
    body: >-
      L'endroit principal pour ajuster les paramètres liés au proxy web
      attribués via le menu des paramètres est
      <code>./views/assets/js/register-sw.js</code>. Vous pouvez y modifier les
      options de transport définies localement via un cookie, remplacer les
      proxys SOCKS5, changer les ports du routage Onion, définir une liste noire,
      et plus encore.
    options:
      stockSW: >-
        Le fichier de configuration du service worker par défaut d'Ultraviolet.
        Dans InvisiProxy, le blocage des publicités est toutefois activé
        automatiquement, donc il n'est pas utilisé par défaut.
      blacklistSW: >-
        Une version modifiée d'Ultraviolet qui permet de mettre des domaines en
        liste noire et de bloquer les publicités.
      proxyUrl: >-
        Définit une URL de protocole SOCKS5/HTTPS/HTTP, par défaut le port proxy
        par défaut de Tor. Elle peut être remplacée par n'importe quel port ou
        proxy SOCKS5 valide. Cela se fait via l'option proxy, pour epoxy comme
        pour libcurl.
      transports: >-
        Définit les ports à basculer via Bare-Mux et à utiliser avec Wisp.
      wispUrl: Modifier le chemin ou la gestion de l'URL pour Wisp
      defaultMode: >-
        Définit le transport utilisé par défaut globalement (les utilisateurs
        peuvent toujours le changer via le menu des paramètres)
      ScramjetController: >-
        Ce constructeur permet de changer dynamiquement le préfixe utilisé par
        Scramjet et de définir l'emplacement des fichiers. Notez qu'il peut être
        nécessaire de modifier <code>./views/scram/scramjet.sw</code> si vous
        renommez des fichiers.
  navigation:
    title: Configuration de la navigation client
    body: >-
      L'emplacement principal des scripts de navigation côté client est
      <code>./views/assets/js/common.js</code>. Ce fichier sert principalement à
      la barre d'adresse (moteur de recherche), au changement d'options de proxy
      et à d'autres paramètres client.
    options:
      getDomain: >-
        Cette constante définit les sous-domaines à supprimer lors de l'ajout
        d'une URL dans la barre d'adresse.
      goFrame: Définit le cadre furtif utilisé par InvisiProxy LTS
      sx: >-
        Cette constante définit le moteur de recherche à utiliser via le proxy
        lorsqu'un utilisateur tape autre chose qu'une URL
      search: Ces fonctions définissent et analysent les requêtes des URL soumises
      urlHandler: Sert à définir les fonctions de l'objet goProx.
      goProx: >-
        Cette constante permet d'associer la gestion des URL à des proxys
        spécifiques ou à des liens devant passer par un proxy web.
      prSet: Attache des écouteurs d'événements via goProx aux boutons ou champs nécessaires
      huLinks: >-
        Récupère automatiquement les chemins indiqués dans
        <code>./views/assets/json</code> et les ajoute selon la page et l'usage.
        Cela sert à masquer les liens qui déclencheraient des blocages de filtres
        et à faciliter l'ajout d'applications.
  structure:
    title: Structure
    summary: Pages web
    info: Informations sur la structure
    root:
      views: >-
        La base physique du site InvisiProxy se trouve ici ; c'est de là que
        sont servies les ressources statiques.
      src: Pour la future implémentation de l'obfuscation et de la suppression de mots-clés.
    views: Détails de <code>/views/</code>
    folders:
      dist: sert aux fichiers minifiés. Créé lors du build.
      pages: sert au HTML du site.
      assets: sert à stocker divers fichiers CSS, JS, images et JSON.
      scram: >-
        contient l'implémentation locale de Scramjet. Certains fichiers sont
        remplacés par le module node.
      uv: contient l'implémentation d'UV.
    scripts: Scripts situés dans <code>/views/assets/js/</code>
    files:
      card: ajoute un bel effet visuel aux cartes affichées sur l'écran d'accueil.
      common: >-
        est utilisé sur toutes les pages et fait fonctionner la plupart des
        fonctionnalités du site, comme la saisie semi-automatique.
      csel: >-
        gère le menu des paramètres, la barre d'adresse et d'autres
        fonctionnalités supplémentaires.
      loader: sert de ressource pour le DOM Masquerading.
      registerSw: >-
        crée et gère les service workers qui permettent à Ultraviolet de
        fonctionner, et utilise aussi bare transport.
  future:
    title: Ajouts à venir
    body: <todo>Voici</todo> notre liste de tâches non exhaustive pour InvisiProxy LTS.
  beginners:
    title: Explication sommaire pour débutants sur les proxys externes et l'hébergement
    intro: Vous devrez d'abord héberger vos proxys localement ou à l'extérieur.
    hosting: "Quelques bonnes options d'hébergement :"
    current: Hébergeur actuel
    paid: Payant
    freePaidDedicated: Gratuit, payant, dédié
    freeAndPaid: Gratuit et payant
    preference: >-
      Parmi ces hébergeurs, Dedipath et Azure arrivent en tête de nos
      préférences. Vous pouvez aussi auto-héberger.
    cloudflare: >-
      Une fois un VPS correct choisi, utilisez Cloudflare pour les
      enregistrements DNS du site et des sous-domaines des proxys.
    dns: >-
      Voici un exemple d'enregistrements DNS. L'auto-hébergement nécessite de
      préférence des <code>enregistrements A</code>.
    dnsAlt: Enregistrements DNS
    root: >-
      <code>@</code> et <code>www.example.com</code> sont utilisés pour
      InvisiProxy LTS.
    subdomain: >-
      <code>a.example.com</code> est utilisé pour d'autres instances comme
      Libreddit ou Invidious, selon les besoins de l'administrateur du site.
    local: >-
      Comme indiqué plus haut, InvisiProxy est hébergé localement avec Scramjet
      et Ultraviolet dès l'installation. Pas besoin d'instances externes.
  domain:
    title: Étapes pour le domaine
    porkbun: >-
      Si vous préférez obtenir des domaines premium (TLD), utilisez
      <porkbun>Porkbun</porkbun>, qui propose des domaines à des prix
      imbattables. Un domaine <code>.org</code> coûte littéralement environ 5 $
      la première année.
  cloudflare:
    title: Étapes pour Cloudflare
    account: >-
      Utilisez Cloudflare (créez un compte), ajoutez votre site, puis ajoutez
      vos différentes cibles DNS à Cloudflare. Veillez à ajouter les serveurs de
      noms de Cloudflare, qui vous seront communiqués lors de l'ajout de votre
      site.
    records: >-
      Assurez-vous qu'il s'agit d'enregistrements CNAME (les enregistrements A
      fonctionnent aussi) et essayez de suivre cette structure :
    columns: Type | Nom | Cible
    ip: IP DU VPS ICI
    ssl: >-
      Assurez-vous que HTTPS est forcé et que SSL est réglé sur Flexible (si vous
      n'utilisez pas LetsEncrypt). Sinon, vous pouvez régler SSL sur Full.
  workspace:
    title: Configuration de l'espace de travail
    vsc: >-
      Si vous avez votre propre appareil, utilisez de préférence <vsc>Visual
      Studio Code</vsc>. C'est à peu près la meilleure option disponible, mais
      c'est évidemment une opinion. Assurez-vous aussi que <node>Node.JS</node>
      est installé sur votre machine.
    fork: >-
      Sans trop entrer dans les détails, commencez par forker ce dépôt. Clonez-le
      ensuite localement via un terminal, selon votre système d'exploitation.
      Assurez-vous de vous placer dans le dossier où vous voulez l'installer.
    gitignore: >-
      Ajoutez maintenant simplement le dossier dans lequel vous avez cloné le
      dépôt à VSC. Lancez ensuite <code>pnpm install</code>. Si vous publiez ce
      projet publiquement sur GitHub, je vous recommande d'ajouter un
      <code>.gitignore</code> à la racine avec les exclusions suivantes :
    deploy: >-
      Votre environnement de travail est maintenant configuré. Pour déployer
      l'espace de travail que vous venez de créer, renseignez-vous selon votre
      hébergeur.
    gitpod: >-
      Pour un IDE en ligne utilisable sur l'ordinateur de l'école et/ou un
      Chromebook, utilisez GitPod. C'est en gros l'équivalent de Visual Studio
      Code, mais dans le navigateur.
    gitpodAccount: 'Créez un compte :'
    gitpodFork: 'Forkez ce dépôt et saisissez cette URL pour configurer votre espace de travail :'
    gitpodSteps: >-
      Suivez les mêmes étapes que ci-dessus en lançant <code>pnpm install</code>
      dans votre dépôt et en ajoutant à la racine un <code>.gitignore</code> qui
      exclut <code>node_modules</code>.
  faq:
    title: FAQ détaillée
    summary: FAQ rapide
    games: Où trouver les jeux de ce dépôt ? (erreurs 404, etc.)
    gamesBody: Merci de lire <games>ceci</games>.
    captcha: >-
      Pourquoi le site sur lequel je suis ne fonctionne-t-il pas correctement ou
      affiche-t-il des erreurs de CAPTCHA ?
    captchaBody: >-
      Malheureusement, la prise en charge des CAPTCHA est aléatoire sur tous les
      proxys actuels. Ils sont principalement pris en charge par Scramjet. Par
      conséquent, certains sites peuvent ne fonctionner avec aucun proxy.
    badGateway: J'obtiens des erreurs 502. Que faire ?
    badGatewayBody: >-
      Dans ce cas, vous pouvez soit changer de site pour corriger l'erreur, soit
      patienter un peu. Vider le cache peut parfois aider.
    questions: >-
      Si vous avez encore des questions, n'hésitez pas à les poser sur le
      Discord dont le lien figure ici.
    domains: >-
      Pourquoi les domaines officiels sont-ils maintenant numérotés ? Le projet
      est-il de nouveau maintenu ?
    domainsBody: >-
      Oui, ce projet est de nouveau actif pour le support LTS ! L'approche est
      toutefois bien plus simple pour garantir son fonctionnement :
      réapprovisionnement des domaines selon les besoins et un code source très
      bien entretenu. Plus que jamais, ce projet sert de preuve de concept pour
      les âmes courageuses prêtes à innover dans le domaine des services de
      proxy web.
  closing:
    summary: Ancien message de fermeture (original - 2022)
    announcement: >-
      Ce n'est pas la meilleure des annonces, désolé. Après beaucoup de
      réflexion et de sérieuses hésitations, je ferme Holy Unblocker et je
      quitte TN. C'est une décision qui me tiraille depuis des mois, d'où le
      manque de mises à jour et les longues absences de l'an dernier. Je ne
      voulais simplement pas abandonner un projet qui me passionnait, auquel
      j'ai consacré du temps et grâce auquel je me suis fait des amis
      formidables et j'ai rencontré des devs géniaux. Je pourrais parler de ces
      personnes indéfiniment, mais je vais m'arrêter là. Elles se reconnaîtront
      :D
    reasons: >-
      Ce qui m'a vraiment fait changer d'avis, c'est que je mets enfin un terme
      à tout ça maintenant en raison 1) d'un manque de motivation 2) d'une
      communauté qui n'est PAS toujours la meilleure ni la plus sympa (il faut
      bien le dire) 3) d'un avenir qui ne s'annonce pas très bien pour HU/TN en
      tant que projet.
    secrets: >-
      Je garderai certaines choses pour moi, car il y a d'autres raisons à ce
      choix, même pour ceux qui trouveront que ce n'est pas assez
      d'informations. Les bons amis d'ici savent que ce choix me stresse énormément
      depuis des mois. Et de toute façon, le fait que je vais bientôt être
      diplômé a beaucoup pesé dans la balance.
    future: >-
      Il est possible que je reprenne/revienne à l'avenir, ou que je garde le
      projet uniquement sur GitHub. Je le précise parce que, même maintenant, je
      doute encore de ce changement. Mais pour l'instant, je vous conseille
      d'aller voir d'autres sites proxy comme Incognito (Duce fait ÉNORMÉMENT de
      mises à jour et c'est le créateur/développeur d'Ultraviolet, alors
      montrez-lui un peu d'amour) :yayy_hopi:
    patreon: >-
      Allez aussi voir son Patreon ! Les patrons actuels de HU ne seront pas
      prélevés le mois prochain et le Patreon de HU sera archivé, alors passez
      sur le Patreon de Duce pour qu'il puisse acheter plus de domaines pour
      Incognito.
    signoff: Avec amour <3
  more:
    title: Plus d'informations
    maintained: >-
      Ce projet est maintenu par l'équipe InvisiProxy LTS et constitue un site de
      proxy web phare officiel de TitaniumNetwork.
    website: Consultez le site officiel pour plus de détails et les crédits.
    sources: 'Sources des proxys web :'
    sourcesBody: >-
      Ce projet utilise actuellement Scramjet et Ultraviolet comme proxys web,
      conformément au protocole Wisp. Bare-Mux sert à basculer entre les
      systèmes de transport utilisés avec Wisp. Les systèmes de transport inclus
      sont EpoxyTransport et libcurl-transport.
    wispProtocol: Protocole Wisp
    merp: Merp (module d'obfuscation)
    dnsBlocklists: Listes de blocage DNS hagezi
    dependencies: 'Autres dépendances :'
    mentions: 'Mentions notables :'
    hostingProvider: Hébergeur
  meta:
    title: Documentation InvisiProxy | Auto-hébergement, configuration et Tor
    description: >-
      Auto-hébergez InvisiProxy : installez-le avec pnpm, configurez-le dans
      config.json, faites passer le trafic par Tor ou un proxy SOCKS5, et
      découvrez le rôle de chaque dépendance.
    social: >-
      Lancez votre propre instance InvisiProxy. Installation, config.json,
      routage Tor et SOCKS5, et les bibliothèques sur lesquelles repose le
      projet.

