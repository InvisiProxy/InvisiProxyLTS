    body: >-
      InvisiProxy LTS est optimisé pour l'auto-hébergement pour vous donner un contrôle maximal de votre confidentialité ! Forkez ce dépôt et pensez à mettre une étoile. Vous pouvez héberger le projet vous-même avec des options de déploiement gratuites ou payantes, ou le configurer sur un serveur dédié (VPS) pour une performance accrue.
