  setup:
    title: Как установить
    branchWarning: >-
      Настоятельно рекомендуется переключиться в IDE на выпущенную
      production-ветку. Ветка master часто содержит нестабильные или
      незавершённые изменения.
    branchExample: 'Пример: v6.x_production вместо master'
    terminal: Терминал
    terminalIntro: >-
      Либо воспользуйтесь кнопкой выше для развёртывания на одной из платформ
      выше, либо введите команды ниже на выделенном сервере
    nginxOnly: ЭТОТ ПРОЕКТ РАССЧИТАН НА NGINX, А НЕ НА CADDY.
    requirements: >-
      Также убедитесь, что используете <code>Node 26.x</code>. <code>git</code> и
      <code>curl</code> — обязательные зависимости:
    builtIn: >-
      Этот сайт размещён локально со встроенными <scramjet>Scramjet</scramjet>,
      <wisp>Wisp</wisp>, <merp>обфускацией Merp</merp>,
      <epoxy>EpoxyTransport</epoxy> и <libcurl>LibcurlTransport</libcurl>.
    caddyWarning: >-
      В целях безопасности при размещении за обратным прокси ПОЖАЛУЙСТА,
      используйте NGINX, а не Caddy. Это связано с тем, что wispurr использует
      loopback-адреса. Если вы используете Caddy, отключите эту функцию или
      измените конфигурацию Caddy по умолчанию.
    resources: 'Ресурсы для самостоятельного размещения:'
  commands:
    pm2Config: >-
      Отредактируйте config.js и установите production в true, если хотите
      использовать pm2 (упрощает хостинг на VPS)
    pm2: использование демона pm2
    restart: Или при последующих запусках...
    kill: Для завершения production-процессов, созданных через pm2
    buildErrors: Если возникают ошибки сборки...
    serviceErrors: Если возникают ошибки сервиса...
