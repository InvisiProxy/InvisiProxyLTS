partners:
  title: Партнёрские сервисы
  intro: >-
    Познакомьтесь с нашими партнёрскими проектами. Они работают через прокси,
    поэтому ими можно пользоваться здесь без блокировок.
  features: >-
    У наших партнёров есть разблокированные игры, веб-порты и эмуляция. Все
    партнёры — проекты с открытым кодом и бесплатны. Присоединяйтесь к их
    сообществам и по возможности поддерживайте их. Все они работают по модели,
    похожей на InvisiProxy, так что вступайте в их Discord-серверы, чтобы
    получить больше ссылок.

