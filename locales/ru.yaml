proxySettings:
  donate: >-
    Мы предлагаем премиум-домены, бета-функции, подключение через домашних
    провайдеров (residential ISP) и более высокую скорость. Поддержать нас
    можно на <patreon>Patreon</patreon>.<br/>Если сервисы работают плохо,
    включите Tor или региональную маршрутизацию. При проблемах с прокси
    загляните на страницу <faq>FAQ</faq>.
  title: Настройки прокси
  connection: Подключение
  searchNavFix: Включить исправления сайтов
  searchNavFixDescription: >-
    Использовать плагин от The Freedom Project для исправления ошибок вроде
    «undefined» при просмотре. Необязательно.
  experimentalSiteFixes: Экспериментальные исправления сайтов
  experimentalSiteFixesDescription: >-
    Набор ручных исправлений поддержки сайтов. Может ломать сайты и раскрывать
    реальный IP; используйте на свой страх и риск.
  hideHistoryDescription: Скрывать локальную историю просмотра. Сеть всё ещё может отслеживать историю, но она проходит через прокси.
  randomizeFingerprint: Случайный отпечаток браузера
  randomizeFingerprintDescription: >-
    Использует случайный десктопный браузер для каждой сессии вкладки и
    добавляет шум в показания canvas, WebGL, процессора и памяти. Выбранный
    user agent имеет приоритет. Некоторые сайты могут работать некорректно.
  customWisp: Свой сервер Wisp
  customWispDescription: >-
    Направляйте трафик прокси через собственный сервер Wisp для лучшего
    контроля над конфиденциальностью. Если вы хотите пускать весь трафик через
    свой хостинг, это лёгкий способ: используйте этот интерфейс, а
    соответствующий трафик пусть идёт на ваши серверы. Оставьте пустым, чтобы
    отключить.
  invalidWisp: Введите адрес ws:// или wss://.
  moreSettings: Другие настройки
  anotherLink: Нужна другая ссылка? Нажмите <mirrors>кнопку ссылок на зеркала</mirrors>.

faq:
  meta:
    title: FAQ InvisiProxy | Сетевые ошибки, CAPTCHA и исправления для YouTube
    description: >-
      Network Error, пустые страницы, бесконечные CAPTCHA или не загружается
      YouTube? Решения самых частых проблем InvisiProxy и ответ на вопрос,
      безопасно ли входить в аккаунты на сайтах.
    social: >-
      Быстрые решения для сетевых ошибок, пустых страниц, бесконечных CAPTCHA и
      воспроизведения YouTube, а также ответы о поддержке Discord и безопасном
      входе в аккаунты.
  title: Часто задаваемые вопросы
  search: Поиск
  searchLabel: Поиск по часто задаваемым вопросам
  icons:
    question: Как получить URL иконки для меню маскировки вкладки?
    bookmarklet: >-
      Перейдите на сайт, иконку которого хотите получить, и воспользуйтесь этим
      букмарклетом (перетащите его на панель закладок):
    button: Найти URL иконки
    copy: >-
      Скопируйте URL, который выдаст букмарклет. Затем вернитесь в InvisiProxy и
      введите его в поле «URL иконки» в настройках. Готово!
  networkError:
    question: >-
      При каждом использовании прокси я получаю «Network Error» или ошибку
      сайта?
    answer: >-
      Это известная проблема наших современных веб-прокси. Из-за большого
      количества пользователей соединение обычно разрывается после десяти минут
      бездействия вкладки. Просто нажмите кнопку «Обновить страницу» и
      перезагрузите страницу.
    note: >-
      Обычно это происходит при первом использовании прокси. В будущем мы это
      исправим.
  bot:
    question: >-
      У меня проблемы со входом на сайты или просмотром контента, потому что
      сайт считает меня ботом.
    answer: >-
      В часы пиковой нагрузки это очень частая ситуация, поскольку весь трафик
      идёт всего через два IP-адреса. Решение — сменить регион в разделе выбора
      региона или включить маршрутизацию через Tor. Также можно оформить
      подписку на Patreon и получить доступ к инстансу с домашним провайдером
      (residential ISP), чтобы избежать этой проблемы.
  unreachable:
    question: >-
      Я получаю ошибку вроде «'cdn.example.com' cannot be reached.»
    answer: >-
      Перезагрузите страницу. Если с первого раза не помогло, просто нажмите
      «Назад» в браузере или вернитесь на страницу Scramjet и попробуйте снова.
  blank:
    question: Почему сайт загружается частично или остаётся пустым?
    answer: >-
      Поддерживаются не все сайты. Это естественно, ведь интернет огромен, и
      сайты используют самые разные технологии и способы загрузки контента. Если
      у вас проблемы с конкретным сайтом, сообщите нам о них на нашем
      Discord-сервере или на GitHub. Или попробуйте перебрать варианты прокси —
      возможно, какой-то из них поддерживает этот сайт.
  idb:
    question: >-
      Я получаю ошибку, связанную с базой данных IDB (проблема Scramjet V1)
    answer: >-
      Обычно это происходит, когда мы обновляем проект. Просто нажмите на значок
      (i) в левом верхнем углу браузера (или на значок замка) и выберите
      «Удалить данные сайта» или «Файлы cookie и данные сайтов > Управление
      данными на устройстве > значок корзины». Это очистит базу данных IndexedDB,
      и вы снова сможете пользоваться прокси.
  discord:
    question: Поддерживается ли Discord?
    answer: Да, Discord поддерживается.
    note: >-
      Однако у бесплатных прокси есть ограничения. Не используйте свой основной
      аккаунт, если только вы не размещаете проект сами или не пользуетесь
      малоизвестным доменом.
  youtube:
    question: Почему не работают видео на YouTube?
    answer: >-
      Если проблема сохраняется даже после выполнения шагов выше, возможно,
      инстанс временно недоступен, особенно если с той же проблемой
      сталкивается много людей. При самостоятельном размещении такой проблемы
      нет.
    tor: >-
      Попробуйте выбрать вариант «Tor» — это может решить проблему, но сильно
      снизит скорость загрузки.
  login:
    question: Безопасно ли входить в аккаунты на сайтах?
    answer: >-
      Да, входить на сайты безопасно. Однако мы не рекомендуем входить на сайты,
      которым вы не доверяете, или использовать личные аккаунты, поскольку
      большой объём трафика проходит через один домен. Мы стараемся смягчить
      эту проблему ротацией IP-адресов, но не использовать личные аккаунты на
      публичных прокси — это просто общепринятая практика. При самостоятельном
      размещении можно делать это без опасений. Также можно оформить подписку
      на Patreon, чтобы пользоваться домашним провайдером и избежать этой
      проблемы.
  captcha:
    question: >-
      Почему сайт работает некорректно или выдаёт ошибки CAPTCHA?
    answer: >-
      CAPTCHA работает со Scramjet, но может потребоваться несколько попыток.
      Причина в том, что Scramjet зачастую просто слишком быстрый, а CAPTCHA по
      своей природе работает нестабильно. Решение — продолжать решать CAPTCHA,
      пока не получится. Старайтесь не торопиться.
  youtubeBlank:
    question: >-
      Почему при использовании YouTube на любом из прокси-сайтов страница не
      загружается полностью или видео остаётся белым?
    answer: 'Есть два способа это исправить:'
    reload: >-
      Обычная перезагрузка страницы при появлении указанной ошибки должна
      загрузить видео.
    reloadFrame: >-
      Или щёлкните правой кнопкой мыши по странице и выберите <code>Перезагрузить
      фрейм</code>, если вы используете какой-либо скрытый режим.

privacy:
  title: Политика конфиденциальности
  subtitle: InvisiProxy — приватный веб-прокси.
  effective: 'Дата вступления в силу: 16.07.2021'
  updated: 'Дата обновления: 31.10.2026'
  what:
    title: Что такое InvisiProxy?
    body: >-
      InvisiProxy LTS — это веб-прокси, который помогает открывать сайты,
      заблокированные вашей сетью, правительством или правилами, прямо в
      браузере без скачивания и настройки. Он делает это безопасно и с
      дополнительными функциями конфиденциальности. Просматривайте сайты
      Tor/Onion в любом браузере, скрывайте свою активность и обходите
      фильтры. Это включает потенциальную возможность обходить блокировщики
      контента, установленные правительствами, расширения Chrome, локальные
      клиентские файрволы и сетевые фильтры.<br/>Этот проект в первую очередь
      служит доказательством концепции идеального бесклиентского решения для
      обхода цензуры.
  data:
    title: Собираются ли какие-либо данные?
    body: >-
      Сам InvisiProxy не записывает и не собирает данные о вашем просмотре.
      Логирование на бэкенде отключено для защиты конфиденциальности
      пользователей. Единственное исключение — кнопка ссылок на зеркала,
      которая хранит ваш IP-адрес в памяти несколько секунд для защиты от
      злоупотреблений; он никогда не записывается на диск. Рекламные партнёры на
      доменах с рекламой собирают собственные данные, как описано ниже в разделе
      «Реклама». Запросы NextDNS настроены так, чтобы не записывать IP-адреса
      клиентов и домены, и хранятся в Швейцарии. Хранение логов NextDNS для
      соответствующих числовых показателей минимально и нужно только для
      стабильной работы сервиса. Cloudflare используется в проекте для
      повышения производительности и упрощения управления DNS с учётом масштаба
      проекта. Числовые показатели Cloudflare используются в минимальном объёме
      для подсчёта посещений и просмотров страниц, чтобы понимать, когда нужно
      обновлять серверы. NGINX настроен не хранить никаких логов. InvisiProxy
      LTS верен своей цели покончить с интернет-цензурой и ценит
      конфиденциальность пользователей. Помимо этого, протокол Wisp (для
      проксирования TCP-соединений) используется вместе с libcurl-transport для
      сквозного шифрования за счёт выполнения SSL/TLS внутри WebAssembly. Сервис
      создан максимально прозрачным, и помните: вы в любой момент можете
      разместить его у себя, чтобы полностью всё контролировать.<br/><br/>Если вы
      хотите сделать заявление или запрос по вопросам конфиденциальности,
      свяжитесь с нами через Discord.
  security:
    title: Безопасность
    body: >-
      InvisiProxy LTS построен с нуля, чтобы обеспечить пользователям безопасный
      и надёжный веб-прокси. Одна из ключевых технологий InvisiProxy LTS — новый
      протокол Wisp, разработанный Mercury Workshop.<br/><br/>Этот протокол
      привносит ряд инновационных функций и улучшений, повышающих скорость и
      безопасность сервиса по сравнению с прежними моделями.
    intro: >-
      Протокол Wisp создан для работы с требованиями современного веб-трафика
      при сохранении высоких стандартов безопасности. Благодаря Wisp проект
      получает следующие преимущества:
    performance: >-
      Производительность: протокол Wisp оптимизирует скорость передачи данных по
      TCP, обеспечивая минимальные задержки при просмотре.
    compatibility: >-
      Совместимость: Wisp совместим с широким спектром веб-технологий, что
      обеспечивает беспрепятственный доступ к различным сайтам и онлайн-сервисам.
      Это достигается за счёт поддержки различных открытых транспортов,
      следующих протоколу (Libcurl Transport).
    censorship: >-
      Устойчивость к цензуре: протокол создан для обхода сложных методов
      цензуры, применяемых в ограниченных сетях, позволяя пользователям легко
      получать доступ к заблокированному контенту.
    fingerprinting: >-
      Защита от фингерпринтинга: в конфигурации обратного прокси официальных
      инстансов проекта применяются надёжные механизмы защиты от
      фингерпринтинга. Это означает, что прокси спроектирован так, чтобы
      минимизировать уникальные идентификаторы, по которым можно отследить или
      идентифицировать пользователей, тем самым повышая конфиденциальность.
      Следуя лучшим отраслевым практикам и постоянно обновляя методы, проект
      позволяет пользователям просматривать сайты анонимно, не оставляя
      идентифицирующих следов.
    transparency: >-
      Прозрачность: прозрачность — ключевой принцип InvisiProxy LTS. Проект
      работает по модели открытого исходного кода, позволяя сообществу
      проверять код и участвовать в его развитии. Такая открытость не только
      укрепляет доверие, но и обеспечивает постоянное улучшение благодаря
      отзывам и сотрудничеству сообщества. Придерживаясь прозрачности,
      InvisiProxy LTS гарантирует, что пользователи знают, как обрабатываются их
      данные и какие меры защищают их конфиденциальность.
    randomisation: >-
      Рандомизация исходного кода и глобальных переменных: для дальнейшего
      повышения безопасности и конфиденциальности InvisiProxy LTS применяет
      рандомизацию исходного кода и глобальных переменных. Это позволяет
      проекту дольше оставаться незаблокированным на доменах, а также повышает
      анонимность при просмотре. Обычные веб-прокси оставляют следы при
      переписывании ресурсов, но с этим методом обнаружить и заблокировать
      прокси гораздо сложнее.
    encryption: >-
      Шифрование: InvisiProxy LTS использует продвинутые прокси-технологии,
      ориентированные на сквозное шифрование и безопасную передачу данных,
      особенно в контексте прокси с переписыванием URL. ПРИМЕЧАНИЕ: это всё ещё
      масштабная работа в процессе, и мы открыты для участия.
    audits: >-
      Регулярные аудиты: проведение регулярных аудитов безопасности для
      выявления и устранения потенциальных уязвимостей.
  advertising:
    title: Реклама
    body: >-
      На некоторых доменах InvisiProxy показывается реклама для покрытия
      расходов на хостинг. Инстансы Patreon всегда без рекламы. Реклама
      предоставляется сторонними сетями: Adsterra, Adcash и Monetag. Реклама появляется только на собственных страницах и экранах
      загрузки InvisiProxy и никогда — внутри сайтов, которые вы открываете
      через прокси.<br/><br/>При загрузке рекламы сеть получает ваш IP-адрес,
      user agent браузера, домен, который вы посещаете, и подобные технические
      данные, а также может устанавливать или считывать собственные файлы
      cookie или использовать аналогичные технологии для показа рекламы,
      ограничения частоты показов, измерения эффективности и предотвращения
      мошенничества. Эти сети могут запускать свой код на наших страницах;
      обработка ваших данных ими регулируется их собственными политиками
      конфиденциальности, а не нашей.<br/><br/>Вы можете отказаться от многих
      рекламных сетей на optout.aboutads.info или youronlinechoices.eu. Также можно
      блокировать рекламу блокировщиком контента или пользоваться инстансом
      Patreon.
  usage:
    title: Дополнительное использование
    storage: >-
      InvisiProxy использует «cookie», IndexedDB, localStorage и sessionStorage
      для поддержания пользовательской сессии (подробнее ниже) и хранения ваших
      настроек на вашем компьютере. Вся эта информация остаётся на вашем
      устройстве, и InvisiProxy не использует её для аналитики. Рекламные
      партнёры могут хранить собственные файлы cookie, как описано в разделе
      «Реклама».
    cookies: >-
      Cookie — это строка информации, которую сайт сохраняет на компьютере
      посетителя и которую браузер посетителя передаёт сайту при каждом
      возвращении. InvisiProxy использует cookie для обеспечения удобства меню
      настроек, а также для пользовательских предпочтений. Пользователи, не
      желающие хранить cookie на своих компьютерах, должны настроить браузер на
      отказ от cookie перед использованием сайтов InvisiProxy, но в этом случае
      некоторые функции InvisiProxy НЕ будут работать корректно без cookie,
      localStorage или IndexedDB. InvisiProxy не хранит никаких данных в cookie,
      IndexedDB, localStorage или sessionStorage в аналитических целях; на них
      полагаются только функции для локального хранения постоянных данных:
      Scramjet (кэширование проксированных ресурсов, состояние сессии и т. д.),
      вкладки, закладки, автодополнение (через прокси), меню настроек:
      маскировка вкладки, наборы иконок, варианты транспорта, поисковые
      системы, темы, язык, тип окна, маршрутизация Tor, смена региона,
      скрытие рекламы, скрытие истории, блокировка утечек окон, блокировка
      WebRTC и рандомизация отпечатка.
    serviceWorkers: >-
      Кроме того, InvisiProxy использует Service Workers как технологию для
      наших веб-прокси. Это позволяет перехватывать соответствующий сетевой
      трафик и т. д. и является основной функцией проекта.
    consent: >-
      Продолжая пользоваться нашим сайтом без изменения настроек cookie, вы
      подтверждаете и соглашаетесь с использованием cookie со стороны
      InvisiProxy и cookie описанных выше рекламных партнёров в тех случаях,
      когда закон не требует вашего отдельного согласия.
  changes:
    title: Заключение
    body: >-
      Хотя большинство изменений, скорее всего, будут незначительными,
      InvisiProxy может время от времени изменять свою Политику
      конфиденциальности по исключительному усмотрению InvisiProxy LTS.
      InvisiProxy LTS рекомендует посетителям регулярно проверять эту страницу
      на предмет изменений Политики конфиденциальности. Продолжение
      использования сайта после любого изменения Политики конфиденциальности
      означает ваше согласие с таким изменением. В случае злоупотреблений или
      DDoS-атак InvisiProxy LTS может быть вынужден временно записывать данные,
      чтобы отразить атаку и сохранить работоспособность сервиса. В таких
      случаях все записанные данные будут надёжно удалены сразу после
      отражения атаки.
  contact:
    title: Контактная информация и авторы
    body: >-
      Если у вас есть вопросы о нашей Политике конфиденциальности, свяжитесь с
      нами по электронной почте:

docs:
  chemical: >-
    Попробуйте <chemical>Chemical</chemical>, если хотите создать собственный
    веб-прокси с нуля.
  chemicalButton: Создайте свой прокси-сайт с Chemical
  formerly: Ранее Holy Unblocker LTS
  badges:
    ci: Статус GitHub Actions
    dockerVersion: Версия Docker-образа
    dockerPulls: Загрузки Docker
  intro: >-
    <strong>InvisiProxy LTS</strong> (ранее Holy Unblocker LTS) —
    экспериментальный веб-прокси, способный обходить веб-фильтры и
    «блокировщики» независимо от того, работает цензура на стороне клиента
    или на уровне сети. Это включает обход блокировок контента со стороны
    правительств, расширений Chrome, локальных клиентских файрволов и сетевых
    фильтров. Проект даже позволяет просматривать сайты Tor/Onion в любом
    браузере (даже в Chromium) — и всё это через веб-сайт!
  star: Вы можете поддержать InvisiProxy, поставив звезду репозиторию!
  about: >-
    Этот проект в первую очередь служит доказательством концепции идеального
    бесклиентского решения для обхода цензуры. Он пригодится, если вам нужно
    использовать Tor, менять регион при просмотре (или использовать внешний
    прокси), просматривать сайты без регистрации (меньше фингерпринтинга),
    обходить антиблокировщики рекламы и/или оставлять минимум следов
    активности на устройстве. Просто разместите проект на любом домене — и у
    вас будет альтернатива VPN без необходимости что-либо скачивать на
    устройство. Будучи безопасным веб-прокси, он поддерживает множество
    сайтов, часто обновляется и ориентирован на простоту самостоятельного
    размещения. InvisiProxy LTS работает с огромным количеством сайтов,
    включая YouTube, Gemini, ChatGPT, Discord, GeForce NOW и многие другие!
    Кроме того, у проекта есть немало эксклюзивных по сравнению с другими
    веб-прокси функций для обхода веб-фильтров (маскировка DOM и рандомизация
    исходного кода) и государственной цензуры. Сейчас поддерживаются Китай
    (GFW) и Россия.
  users: >-
    Более 30 млн пользователей с 2020 года. Огромное спасибо за поддержку — я
    и представить не мог, насколько большим станет сообщество веб-прокси.
  branches:
    current: 'Текущая ветка: Latest'
    title: Типы веток
    latest: Latest (master; сборка для FOSS и SEO)
    beta: Beta (ожидающие изменения; изменения, которые могут что-то сломать)
    production: >-
      Production (v4, v5, v6; стабильная версия InvisiProxy LTS. Изменения для
      самостоятельного размещения в production-среде; максимальный обход
      фильтров и обработка запросов)
    switch: Для самостоятельного размещения рекомендуем перейти на production-ветку!
  selfHost: >-
    Если хотите разместить проект у себя, посмотрите <deploy>варианты
    самостоятельного развёртывания</deploy>. Не получается развернуть ни одним
    из бесплатных способов? Попробуйте Koyeb или поищите недорогой платный VPS.
    Если не хотите размещать сами, нажмите на меню ссылок на зеркала в
    InvisiProxy.
  discord: "Обязательно присоединяйтесь к Discord TitaniumNetwork, чтобы получить больше официальных ссылок:"
  caution:
    title: Внимание
    body: >-
      Если вы собираетесь размещать InvisiProxy LTS самостоятельно, переключитесь
      на ветку PRODUCTION, где функции обхода фильтров включены автоматически. В
      ветке master находятся незавершённые изменения, которые не готовы для
      самостоятельного размещения. Однако если вы хотите внести вклад в проект,
      отправляйте PR в ветку master.
  tip:
    title: Совет
    body: >-
      InvisiProxy LTS оптимизирован для самостоятельного размещения, чтобы дать
      вам максимальный контроль над конфиденциальностью! Сделайте форк этого
      репозитория и поставьте звезду. Можно разместить проект с помощью
      бесплатных или платных вариантов развёртывания или настроить его на
      выделенном сервере (VPS) для лучшей производительности.
  sites:
    site: Поддерживаемые сайты
    features: Возможности
    youtube: >-
      Встроенный набор открытых веб-прокси с упором на скорость и/или
      безопасность
    reddit: >-
      Рандомизация исходного кода и маскировка DOM для эффективного обхода
      крупных фильтров, а также рандомизация глобальных переменных прокси
    discord: >-
      Настройка заголовка и иконки вкладки через меню настроек для лучшей
      скрытности истории просмотра
    instagram: >-
      Блокировка рекламы на всех сайтах при сёрфинге и DNS с низкой задержкой на
      официальных серверах
    tor: >-
      Поддержка SOCKS5 и onion-маршрутизации через Tor в меню настроек.
      Открывайте сайты Tor/Onion в любом браузере!
    geforce: >-
      Эксклюзивные по сравнению с другими веб-прокси функции для обхода
      веб-фильтров и государственной цензуры.
    chatgpt: >-
      Скрытие локальной истории просмотра, защита от утечек вкладок и
      маскировка сетевого трафика!
    spotify: Обход региональных блокировок прокси сменой региона или включением Tor
    more: И практически большинство сайтов!
    moreFeature: Создан для интенсивных production-нагрузок и простой установки
  deploy:
    title: Развернуть InvisiProxy
    free: Бесплатное развёртывание
    alternatives: Другие бесплатные платформы
    paid: Production-варианты, платные/бесплатные (требуются платёжные данные)
    to: Развернуть на {name}
    run: Запустить на {name}
    replitTitle: Что случилось с развёртыванием на Replit/Heroku?
    replit: >-
      Replit больше не бесплатен, а у Heroku действует правило против
      веб-прокси. Для разработки в облаке попробуйте GitHub Codespaces или
      Gitpod, а для бесплатного хостинга — Koyeb.
  codespaces:
    title: Инструкции по установке
    fork: Сделайте форк этого репозитория (и поставьте звезду!) в своём аккаунте GitHub
    open: >-
      Перейдите на официальный сайт <codespaces>Codespaces</codespaces>
      (убедитесь, что у вас уже есть аккаунт GitHub)
    select: >-
      Выберите <strong>New Codespaces</strong> и найдите
      <em>[USERNAME]/InvisiProxy</em> в своём аккаунте
    branch: >-
      Убедитесь, что выбрана ветка <code>master</code>, а конфигурация dev
      container установлена на <strong>InvisiProxy LTS</strong>
    create: Выберите <strong>Create Codespace</strong> и дождитесь настройки контейнера
