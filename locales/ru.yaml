    start: Если хотите запустить проект
    test: Для проверки эндпоинтов и ошибок
    prSet: код функции prSet здесь....
  ubuntu:
    title: Подробная установка (на примере Ubuntu)
    intro: >-
      Вам понадобятся установленные <code>Node.js 26.x</code>, <code>curl</code>
      и <code>git</code>; ниже приведён пример установки для Debian/Ubuntu.
    summary: Пошаговое руководство
    mirrors: >-
      Для простоты можно присоединиться к Discord TN по адресу
      discord.gg/unblock и запросить ссылки на зеркала (они пополняются и не
      заблокированы).
    hosting: Хостинг
    hostingBody: >-
      Если же вы хотите разместить проект сами, сначала вам понадобится VPS или
      хостинг-провайдер:
    dependencies: Зависимости
    dependenciesBody: >-
      Затем нужно установить git, musl, nginx (или caddy) и Node.js. Вот пример
      для Ubuntu LTS:
    tor: Поддержка Tor (необязательно)
    configure: Настройка InvisiProxy
    configureBody: >-
      Самые важные параметры — production, а также методы обфускации и
      маскировки DOM.
    configureMore: 'Дальше настраивайте по необходимости:'
    run: Клонирование и запуск InvisiProxy
    runBody: >-
      Затем запустите соответствующий процесс; если в конфигурации production
      установлен в true, pm2 будет автоматически включён вместе с нашей
      собственной системой воркеров и кэша.
    restart: И, конечно, если вы использовали NGINX или caddy, перезапустите или перезагрузите их
  config:
    title: Конфигурация
    server: Настройка конфигурации сервера
    port: >-
      По умолчанию прокси запускается на порту <code>http://localhost:8080</code>.
      При необходимости порт и другие параметры production можно изменить в
      <code>./ecosystem.config.js</code>.
    local: >-
      Все остальные локальные настройки — рандомизация исходного кода,
      автоминификация и т. д. — находятся в <code>./config.json</code>.
    options:
      minifyScripts: >-
        Автоматически минифицировать соответствующие статические ресурсы при
        запуске сервера.
      randomizeIdentifiers: >-
        Включить экспериментальную рандомизацию глобальных переменных прокси для
        Ultraviolet. Это снижает вероятность обнаружения UV фильтрами на основе
        расширений.
      production: >-
        Использовать преднастроенную production-конфигурацию для серверного
        хостинга. Управление кэшем и переписывание исходного кода настраиваются
        автоматически.
      disguiseFiles: >-
        Включить маскировку DOM, которая обфусцирует реальные загрузки контента
        для InvisiLTS. Это достигается маскировкой запросов, распаковкой и
        последующим восстановлением дерева DOM.
      usingSEO: >-
        Включить рандомизацию исходного кода, которая меняет местами фрагменты
        данных, указанные в <code>./src/data.json</code>. Очень полезно для
        маскировки ключевых слов, из-за которых InvisiProxy LTS автоматически
        помечается или блокируется, а также для предотвращения блокировок по
        исходному коду.
      verbose: >-
        Включает сообщения компиляции и сборки, чтобы видеть прогресс и
        возможные проблемы при компиляции.
      mirrorLinksFile: >-
        Серверный файл, используемый раздатчиком на странице ссылок; по
        умолчанию <code>private/mirror-links.txt</code>. Относительные пути
        отсчитываются от корня проекта; абсолютные пути тоже поддерживаются.
        Указывайте по одному HTTP(S) URL на строку и храните файл вне
        <code>views/</code>, чтобы он не был публично доступен. После изменения
        этой настройки перезапустите сервер.
      geoLanguage: >-
        Включает автоматический выбор языка по заголовку Cloudflare
        <code>CF-IPCountry</code>. Включайте только за Cloudflare, иначе этот
        заголовок может подставить кто угодно. Страны для каждого языка указаны в
        <code>language.countries</code> в каждом файле
        <code>./locales/*.yaml</code>.
      singleLanguage: >-
        Если <code>true</code>, собирается только язык, указанный в
        <code>language</code>, все посетители получают его, а настройка языка
        скрывается. Полезно для Docker и других развёртываний, где нужен только
        один язык: сборка быстрее и меньше. По умолчанию <code>false</code>.
      language: >-
        Язык для сборки при включённом <code>singleLanguage</code>,
        соответствующий файлу в <code>./locales/</code> (например,
        <code>en</code> для <code>en.yaml</code>). По умолчанию <code>en</code>.
        Для Docker задайте его в <code>config.json</code> перед запуском
        <code>docker build</code> или <code>docker compose build</code>, так как
        языки выбираются во время сборки.
  translations:
    title: Переводы
    crowdin: >-
      InvisiProxy LTS переводится на <crowdin>Crowdin</crowdin>, и помочь может
      любой без необходимости трогать код. Присоединяйтесь к проекту, выберите
      язык и начинайте переводить. Готовые переводы автоматически
      синхронизируются в <code>./locales/</code>.
    rules: >-
      Правила перевода (плейсхолдеры, теги и маскируемые термины) смотрите в
      <readme/>. Если вашего языка нет на Crowdin, создайте issue или спросите в
      Discord.
  tor:
    title: Настройка маршрутизации Tor/Onion/SOCKS5
    intro: >-
      Чтобы настройка onion-маршрутизации работала, нужно установить Tor
      (графический интерфейс не нужен, но и не помешает. С графическим
      интерфейсом замените порт 9050 на 9150)!
    guide: 'Просто запустите Tor по этому руководству:'
    cliGuide: 'Альтернативное руководство (для CLI):'
    body: >-
      Если вы размещаете InvisiProxy LTS на VPS с Ubuntu, подключите Tor к
      systemctl для удобного управления в production. Как только Tor запущен на
      Linux или Windows, он будет автоматически работать с InvisiProxy LTS, когда
      пользователь включит его в меню настроек.
    customWisp: Пользователи также могут указать свой сервер Wisp в настройках прокси.
    customProxy: >-
      Если вы хотите направлять трафик Scramjet через собственный
      HTTP/HTTPS/SOCKS5-прокси, это настраивается на сервере в
      <code>./src/server/wisp.ts</code>.
  proxy:
    title: Конфигурация прокси
    body: >-
      Основное место для настройки параметров веб-прокси, задаваемых через меню
      настроек, — <code>./views/assets/js/register-sw.js</code>. Здесь можно
      изменить варианты транспорта, локально задаваемые через cookie, заменить
      SOCKS5-прокси, изменить порты onion-маршрутизации, указать чёрный список и
      многое другое.
    options:
      stockSW: >-
        Стандартный файл конфигурации service worker для Ultraviolet. Однако в
        InvisiProxy блокировка рекламы включена автоматически, поэтому по
        умолчанию он не используется.
      blacklistSW: >-
        Модифицированная версия Ultraviolet, позволяющая вносить домены в
        чёрный список и блокировать рекламу.
      proxyUrl: >-
        Указывает URL протокола SOCKS5/HTTPS/HTTP; по умолчанию — стандартный
        порт прокси Tor. Его можно заменить на любой допустимый порт или
        SOCKS5-прокси. Это делается через параметр proxy как для epoxy, так и для
        libcurl.
      transports: >-
        Указывает порты, переключаемые через Bare-Mux и использующие Wisp.
      wispUrl: Изменить путь или обработку URL для Wisp
      defaultMode: >-
        Указывает транспорт по умолчанию, используемый глобально (пользователи
        всё равно могут сменить его в меню настроек)
      ScramjetController: >-
        Этот конструктор позволяет динамически менять префикс, используемый
        Scramjet, и указывать расположение файлов. Обратите внимание: при
        переименовании файлов может понадобиться отредактировать
        <code>./views/scram/scramjet.sw</code>.
  navigation:
    title: Конфигурация клиентской навигации
    body: >-
      Основное место для скриптов клиентской навигации —
      <code>./views/assets/js/common.js</code>. Этот файл в основном отвечает за
      работу омнибокса (поисковой системы), переключение вариантов прокси и
      другие клиентские настройки.
    options:
      getDomain: >-
        Эта константа указывает поддомены, которые нужно удалять при добавлении
        URL в омнибокс.
      goFrame: Указывает скрытый фрейм, используемый в InvisiProxy LTS
      sx: >-
        Эта константа указывает поисковую систему, которая будет открываться
        через прокси, когда пользователь вводит не URL
      search: Эти функции задают и разбирают запросы для отправленных URL
      urlHandler: Используется для задания функций объекта goProx.
      goProx: >-
        Эта константа позволяет сопоставлять обработку URL для конкретных прокси
        или ссылок, которые должны открываться через веб-прокси.
      prSet: Назначает обработчики событий через goProx для нужных кнопок и полей ввода
      huLinks: >-
        Автоматически берёт пути, указанные в <code>./views/assets/json</code>, и
        добавляет их в зависимости от страницы и использования. Это нужно, чтобы
        скрывать ссылки, ведущие к блокировке фильтрами, и упростить добавление
        приложений.
  structure:
    title: Структура
    summary: Веб-страницы
    info: Описание структуры
    root:
      views: >-
        Здесь находится основа сайта InvisiProxy, откуда раздаются статические
        ресурсы.
      src: Для будущей реализации функций обфускации и удаления ключевых слов.
    views: Подробности о <code>/views/</code>
    folders:
      dist: используется для минифицированных файлов. Создаётся при сборке.
      pages: используется для HTML-страниц сайта.
      assets: используется для хранения различных CSS, JS, изображений и JSON-файлов.
      scram: >-
        содержит локальную реализацию Scramjet. Некоторые файлы переопределяются
        node-модулем.
      uv: содержит реализацию UV.
    scripts: Скрипты в <code>/views/assets/js/</code>
    files:
      card: добавляет красивый визуальный эффект карточкам на приветственном экране.
      common: >-
        используется на всех страницах и обеспечивает работу большинства функций
        сайта, например автодополнения.
      csel: >-
        управляет меню настроек, работой омнибокса и другими дополнительными
        функциями.
      loader: используется как ресурс для маскировки DOM.
      registerSw: >-
        создаёт и управляет service workers, обеспечивающими работу Ultraviolet,
        а также использует bare transport.
  future:
    title: Планы на будущее
    body: <todo>Это</todo> наш неполный список задач для InvisiProxy LTS.
  beginners:
    title: Краткое объяснение для новичков о внешних прокси и хостинге
    intro: Сначала нужно разместить прокси локально или на внешнем сервере.
    hosting: 'Список хороших вариантов хостинга:'
    current: Текущий хостинг-провайдер
    paid: Платный
    freePaidDedicated: Бесплатный, платный, выделенный
    freeAndPaid: Бесплатный и платный
    preference: >-
      Из списка хостинг-провайдеров предпочтительнее всего Dedipath и Azure.
      Можно также разместить у себя.
    cloudflare: >-
      Выбрав приличный VPS, используйте Cloudflare для DNS-записей как сайта,
      так и поддоменов для прокси.
    dns: >-
      Это пример DNS-записей. Для самостоятельного размещения предпочтительны
      <code>A-записи</code>.
    dnsAlt: DNS-записи
    root: >-
      <code>@</code> и <code>www.example.com</code> используются для
      InvisiProxy LTS.
    subdomain: >-
      <code>a.example.com</code> используется для других инстансов, например
      Libreddit или Invidious, в зависимости от потребностей администратора
      сайта.
    local: >-
      Как уже говорилось, InvisiProxy из коробки размещается локально со
      Scramjet и Ultraviolet. Внешние инстансы не нужны.
  domain:
    title: Шаги для домена
    porkbun: >-
      Если вы предпочитаете премиальные домены (TLD), используйте
      <porkbun>Porkbun</porkbun> — у них отличные цены. Буквально: домен
      <code>.org</code> обычно стоит около $5 за первый год.
  cloudflare:
    title: Шаги для Cloudflare
    account: >-
      Зарегистрируйтесь в Cloudflare, добавьте свой сайт, а затем добавьте в
      Cloudflare нужные DNS-цели. Обязательно укажите серверы имён Cloudflare,
      которые вам выдадут при добавлении сайта.
    records: >-
      Убедитесь, что это записи CNAME (хотя A-записи тоже работают), и
      постарайтесь следовать такой структуре:
    columns: Тип | Имя | Цель
    ip: СЮДА IP ВАШЕГО VPS
    ssl: >-
      Убедитесь, что HTTPS принудительно включён, а SSL установлен на Flexible
      (если вы не используете LetsEncrypt). В противном случае можно установить
      SSL на Full.
  workspace:
    title: Настройка рабочего окружения
    vsc: >-
      Если у вас есть своё устройство, лучше всего использовать <vsc>Visual
      Studio Code</vsc>. Пожалуй, лучший вариант из возможных, но это, конечно,
      субъективно. Также убедитесь, что на вашем компьютере установлен
      <node>Node.JS</node>.
    fork: >-
      Не будем вдаваться в подробности, но сначала сделайте форк этого
      репозитория. Затем клонируйте его локально через терминал — в зависимости
      от вашей ОС. Убедитесь, что перешли в папку, где хотите всё настроить.
    gitignore: >-
      Теперь просто добавьте папку с клонированным репозиторием в VSC. Затем
      выполните <code>pnpm install</code>. Если вы публикуете проект на GitHub,
      рекомендую добавить в корневую папку <code>.gitignore</code> со следующими
      исключениями:
    deploy: >-
      Теперь ваше рабочее окружение настроено. Чтобы развернуть созданное
      окружение, найдите инструкции для вашего хостинг-провайдера.
    gitpod: >-
      Если вам нужна онлайн-IDE, которой можно пользоваться на школьном
      компьютере и/или Chromebook, используйте GitPod. По сути, это Visual
      Studio Code, работающий в браузере.
    gitpodAccount: 'Создайте аккаунт:'
    gitpodFork: 'Сделайте форк этого репозитория и введите этот URL для настройки рабочего окружения:'
    gitpodSteps: >-
      Выполните те же шаги, что и выше: запустите <code>pnpm install</code> в
      репозитории и добавьте в корневую папку <code>.gitignore</code>,
      исключающий <code>node_modules</code>.
  faq:
    title: Подробный FAQ
    summary: Краткий FAQ
    games: Где найти игры для этого репозитория? (ошибки 404 и т. д.)
    gamesBody: Пожалуйста, прочитайте <games>здесь</games>.
    captcha: >-
      Почему сайт работает некорректно или выдаёт ошибки CAPTCHA?
    captchaBody: >-
      К сожалению, поддержка CAPTCHA во всех текущих прокси нестабильна. В
      основном её поддерживает Scramjet. Поэтому некоторые сайты могут не
      работать ни с одним из вариантов.
    badGateway: Я получаю ошибки 502. Что делать?
    badGatewayBody: >-
      В этом случае можно сменить сайт или немного подождать. Иногда помогает
      очистка кэша.
    questions: >-
      Если у вас остались вопросы, смело задавайте их в Discord по ссылке здесь.
    domains: >-
      Почему официальные домены теперь пронумерованы? Проект снова
      поддерживается?
    domainsBody: >-
      Да, проект снова активен в рамках LTS-поддержки! Однако подход теперь
      гораздо проще, чтобы гарантировать работоспособность: пополнение доменов
      по мере необходимости и тщательно поддерживаемый исходный код. Как никогда
      раньше, этот проект служит доказательством концепции для смельчаков,
      готовых внедрять инновации в сфере веб-прокси.
  closing:
    summary: Прежнее прощальное сообщение (оригинал — 2022)
    announcement: >-
      Это не самое приятное объявление, простите. После долгих раздумий и
      сильных колебаний я закрываю Holy Unblocker и ухожу из TN. Это то, что
      мучило меня месяцами, отсюда и отсутствие обновлений, и большие перерывы
      в прошлом году. Я просто не хотел бросать проект, которым увлечённо
      занимался, в который вложил время и благодаря которому нашёл замечательных
      друзей и познакомился с крутыми разработчиками. Я мог бы бесконечно
      перечислять этих людей, но, пожалуй, остановлюсь. Они сами знают, о ком
      речь :D
    reasons: >-
      Главная причина перемены в том, что я наконец решил поставить точку
      прямо сейчас из-за того, что 1) пропала мотивация 2) сообщество порой НЕ
      самое лучшее и не самое доброжелательное (должен это сказать) 3) будущее
      HU/TN как проекта выглядит не слишком радужно.
    secrets: >-
      Некоторые вещи я оставлю в секрете, поскольку у этого решения есть и
      другие причины, — если только кому-то этой информации покажется мало.
      Хорошие друзья здесь знают, что этот выбор уже несколько месяцев сильно
      меня напрягал. К тому же весомым аргументом стало то, что я скоро
      выпускаюсь.
    future: >-
      Возможно, в будущем я продолжу/вернусь к этому или оставлю проект только
      на GitHub. Пишу это, потому что даже сейчас сомневаюсь в своём решении.
      Но пока что загляните на другие прокси-сайты, например Incognito (Duce
      ОЧЕНЬ часто выпускает обновления, и он создатель/разработчик Ultraviolet,
      так что поддержите его) :yayy_hopi:
    patreon: >-
      Загляните и на его Patreon! С текущих патронов HU в следующем месяце не
      будут списаны деньги, а Patreon HU будет архивирован, так что переходите
      на Patreon Duce, чтобы он мог купить больше доменов для Incognito.
    signoff: С любовью <3
  more:
    title: Дополнительная информация
    maintained: >-
      Проект поддерживается командой InvisiProxy LTS и является официальным
      флагманским веб-прокси сайтом TitaniumNetwork.
    website: Подробности и благодарности — на официальном сайте.
    sources: 'Исходники веб-прокси:'
    sourcesBody: >-
      Сейчас проект использует Scramjet и Ultraviolet в качестве веб-прокси,
      работающих по протоколу Wisp. Bare-Mux используется для переключения
      транспортных систем, работающих с Wisp. Включены транспорты
      EpoxyTransport и libcurl-transport.
    wispProtocol: Протокол Wisp
    merp: Merp (модуль обфускации)
    dnsBlocklists: DNS-блоклисты hagezi
    dependencies: 'Другие зависимости:'
    mentions: 'Отдельная благодарность:'
    hostingProvider: Хостинг-провайдер
  meta:
    title: Документация InvisiProxy | Самостоятельное размещение, настройка и Tor
    description: >-
      Разместите InvisiProxy у себя: установите через pnpm, настройте в
      config.json, пустите трафик через Tor или SOCKS5-прокси и узнайте, за что
      отвечает каждая зависимость.
    social: >-
      Запустите собственный инстанс InvisiProxy. Установка, config.json,
      маршрутизация через Tor и SOCKS5 и библиотеки, на которых построен
      проект.

apps:
  intro: >-
    Выберите сайт ниже, чтобы открыть его через прокси. Не входите под
    основными аккаунтами — это публичный прокси. Рекомендуется создать
    запасные аккаунты и включить 2FA, так как некоторые сайты ослабляют
    ограничения при соблюдении этих условий. Миллионы запросов идут через
    несколько IP-адресов, поэтому некоторые сайты могут блокировать доступ.
  patreon: >-
    Оформите подписку на <patreon>Patreon</patreon>, если хотите, чтобы трафик
    шёл через надёжного домашнего провайдера (residential ISP) и с более
    высокой скоростью. При проблемах также можно включить маршрутизацию Tor или
    изменить региональные настройки. Для работы GeForce NOW отключите рекламу в
    настройках прокси.
  faq: При проблемах с прокси загляните на страницу <faq>FAQ</faq>.
  loading: Загрузка приложений…
