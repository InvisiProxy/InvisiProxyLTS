home:
  title: InvisiProxy LTS | Бесплатный веб-прокси — обход фильтров и доступ к заблокированным сайтам
  description: >-
    InvisiProxy LTS — передовой веб-прокси, созданный для обхода веб-фильтров
    и блокировщиков. Будь то цензура на стороне клиента или на уровне сети,
    InvisiProxy LTS обеспечивает беспрепятственный доступ к заблокированным
    сайтам и безопасный приватный просмотр на таких устройствах, как
    Chromebook. Обходите блокировщики контента, расширения Chrome, файрволы и
    многое другое с помощью нашего продвинутого прокси-решения.
  ogDescription: >-
    InvisiProxy LTS — первоклассный веб-прокси, который обходит сетевые и
    браузерные ограничения для безопасного доступа к заблокированным сайтам.
    Наслаждайтесь плавным просмотром с надёжной защитой и продвинутыми
    функциями.
  twitterDescription: >-
    Откройте для себя InvisiProxy LTS — ведущий веб-прокси, который обходит
    цензуру и фильтры, обеспечивая безопасный доступ к заблокированным сайтам.
    Идеален для приватного просмотра и обхода сетевых ограничений на таких
    устройствах, как Chromebook.

  headline: Положим конец интернет-цензуре.
  tagline: Конфиденциальность у вас под рукой.
  browseNow: Начать просмотр
  bypassNow: Обойти сейчас
  donate: Поддержать
  logoAlt: Логотип InvisiProxy
  terminal:
    setup: Для первоначальной установки на production-ветке...
    start: Или для обычного использования...
    dev: Для разработки...

  free:
    title: InvisiProxy — бесплатный.
    body: >-
      Благодаря открытому исходному коду вы можете легко сделать форк этого
      репозитория и разместить его у себя для максимального контроля над
      конфиденциальностью. В отличие от многих других веб-прокси, InvisiProxy
      выделяется сквозным шифрованием через TLS, изоляцией истории браузера,
      маршрутизацией Tor/Onion в браузерах на базе Chromium, полной
      прозрачностью и контролем конфиденциальности. <strong>В отличие от других
      прокси-сервисов, мы не собираем никаких данных пользователей на наших
      официальных инстансах. Даже для отладки.</strong><br/>Наши зависимости с
      открытым кодом (Wisp, Libcurl и Epoxy) спроектированы с упором на
      безопасность и конфиденциальность, поэтому ваш просмотр остаётся
      конфиденциальным даже на вредоносных самостоятельно размещённых инстансах.

  fast:
    title: InvisiProxy — быстрый и очень продвинутый.
    body: >-
      InvisiProxy обеспечивает исключительную производительность веб-прокси. Он
      может похвастаться мощным набором функций: поддержка reCAPTCHA/Botguard,
      сеть Tor, цепочки прокси SOCKS5, настраиваемый чёрный список, защита от
      утечек, скрытие истории и широкая совместимость с сайтами благодаря
      Scramjet + Wisp (в паре с Libcurl Transport). Другие популярные сервисы,
      такие как CroxyProxy или Proxium, зачастую переписывают ресурсы лишь
      наполовину, допуская утечку запросов, что ставит под угрозу
      конфиденциальность. Проект также поддерживает цепочки прокси, позволяя
      направлять трафик через несколько прокси для дополнительной безопасности
      и анонимности.

  practical:
    title: InvisiProxy — практичный.
    body: >-
      Используя рандомизацию исходного кода и такие проекты, как Proxy
      Transports, Wisp и Scramjet, этот проект обеспечивает плавную работу в
      обход веб-, государственных и сетевых фильтров. Проект работает против
      фильтров, используемых в Китае (GFW — Великий китайский файрвол), России и
      других странах, <strong>без необходимости скачивать программы</strong>.
      Всё это происходит прямо в вашем браузере как веб-сайт и на нашем бэкенде
      (или вашем собственном, если вы размещаете проект сами), что позволяет
      обходить даже самые жёсткие блокировки. Ничего не нужно скачивать — просто
      введите домен InvisiProxy; если он заблокирован, получите зеркала на
      официальном сайте InvisiProxy и сёрфите анонимно.

  heroSubtitle: Бесплатно и прозрачно
  designedWithPrivacy: Создано с заботой о конфиденциальности<underline/>.

  overview:
    title: Обзор
    body: >-
      InvisiProxy LTS — экспериментальный веб-прокси, способный обходить
      веб-фильтры и «блокировщики» независимо от того, работает цензура на
      стороне клиента или на уровне сети. Это включает обход блокировок
      контента, установленных правительствами разных стран (Китай/GFW, Россия и
      др.), расширений Chrome, локальных клиентских файрволов и сетевых
      фильтров.
    donate: >-
      Пожалуйста, поддержите проект пожертвованием, чтобы он оставался
      бесплатным! Мы предлагаем больше доменов каждый месяц, доступ к
      бета-версиям, личные домены и приоритет для запросов функций.<br/>Вы можете
      сделать пожертвование <patreon>здесь, на Patreon</patreon>.
    patreonLabel: Поддержать на Patreon
    imageAlt: Иконка сервера

  intent:
    title: Цель
    body: >-
      Этот проект в первую очередь служит доказательством концепции идеального
      бесклиентского решения для обхода цензуры. Будучи безопасным веб-прокси,
      он поддерживает множество сайтов, часто обновляется и уделяет внимание
      деталям дизайна, механики и функций.
    palette: >-
      Палитра проекта построена на <nord>Nord Theme</nord> благодаря её
      оптимальной цветовой гамме и приоритету читаемого синтаксиса кода и
      компонентов интерфейса.
    imageAlt: Иконка файла с кодом

  usage:
    title: Использование
    body: >-
      Перейдите на страницу <browse>Просмотр</browse> и выберите один из
      представленных прокси! Затем введите в поле поиска сайт, который хотите
      открыть. У каждого веб-прокси свой уровень эффективности, скорости и
      безопасности. Рекомендуется использовать Scramjet.<br/><br/>Пример сайта
      для разблокировки: <code>https://youtube.com</code>
    imageAlt: Иконка щита

  apps:
    title: Приложения
    body: >-
      В InvisiProxy есть коллекция готовых приложений, включая YouTube, Spotify,
      GeForce NOW, Discord, ChatGPT, Gemini и многое другое!
    imageAlt: Иконка приложения

  hosting:
    title: Хостинг и развёртывание
    body: >-
      <strong>InvisiProxy LTS</strong> — решение с открытым исходным кодом,
      созданное с упором на модульность, простоту использования и лёгкое
      развёртывание. Ключевые возможности: блокировка рекламы, гибкая генерация
      исходного кода и продвинутая навигация через прокси.<br/><br/>Подробные
      инструкции по установке смотрите в нашем официальном <github>репозитории
      на GitHub</github> или во <docs>встроенной документации</docs>.
    docsTitle: Дополнительная информация о хостинге
    imageAlt: Иконка хостинга и развёртывания
    imageTitle: Хостинг и развёртывание InvisiProxy LTS

  contributing:
    title: Участие в проекте
    body: >-
      <strong>InvisiProxy LTS</strong> развивается благодаря самоотверженной
      работе наших замечательных участников. Как проект с открытым исходным
      кодом, <strong>InvisiProxy LTS</strong> опирается на увлечённость своего
      сообщества, чтобы обходить интернет-цензуру и помогать пользователям
      получать доступ к информации.
    start: Чтобы начать участвовать, посетите наш <github>репозиторий на GitHub.</github>
    imageAlt: Иконка участия на GitHub
    imageTitle: Участвуйте в развитии InvisiProxy LTS на GitHub

  githubTitle: Репозиторий InvisiProxy LTS на GitHub

  bypass:
    title: Обход цензуры и фильтров
    body: >-
      InvisiProxy LTS — это <strong>веб-прокси проект</strong> с открытым
      исходным кодом. Наслаждайтесь неограниченным доступом к онлайн-контенту и
      просмотру с помощью наших продвинутых функций <strong>разблокировки через
      веб-прокси</strong>. Проект также позволяет размещать его где угодно и
      обходить общенациональные и региональные блокировки, например в Китае
      (Великий китайский файрвол — GFW) и России.

  freeProxy:
    title: 100% бесплатный веб-прокси
    body: >-
      Пользуйтесь нашим <strong>бесплатным веб-прокси</strong>, который помогает
      <strong>разблокировать сайты</strong> и получать доступ к ограниченному
      контенту. Идеально подходит для обхода фильтров в учебных заведениях
      и/или на работе — проект создан, чтобы разблокировать всё.

  tor:
    title: Маршрутизация Tor в браузерах Chromium и Firefox
    body: >-
      С InvisiProxy LTS вы можете <strong>получить доступ к сети Tor</strong>
      прямо в браузере на базе Chromium или Firefox. Это значит, что вы можете
      открывать <strong>.onion</strong>-сайты прямо на этом сайте. Так вы
      можете просматривать веб анонимно (по крайней мере в некоторой степени;
      настоящий Tor лучше защищает от фингерпринтинга), обходя любые
      региональные ограничения. Проект также поддерживает настройку
      собственных SOCKS5-прокси для построения цепочки.

  unrestricted: Бесплатный просмотр без ограничений
  closing: Пора пользоваться интернетом свободно.
  tryFree: Попробуйте InvisiProxy бесплатно

