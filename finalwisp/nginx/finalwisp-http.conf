# /etc/nginx/conf.d/finalwisp-http.conf: http-level parts (conf.d files are
# included inside http {}). Copy it there, then add this line inside your
# site's server { } block, before location /:
#   include snippets/finalwisp-routes.conf;

# Origin check for the Wisp paths (used by snippets/finalwisp-proxy.conf):
# 0 = allowed. The same rule as fromOwnSite() in src/server/wisp.ts: no Origin
# header, or an Origin with the same host name.
map "$http_origin|$host" $finalwisp_origin_bad {
    default 1;
    "~^\|" 0;                                              # no Origin header
    "~*^https?://([^/:|]+)(:[0-9]+)?\|\1(:[0-9]+)?$" 0;    # Origin host == Host host
}

# Visitor addresses behind Cloudflare. Skip this block if your nginx already
# sets real_ip for Cloudflare. Take the current ranges from
# https://www.cloudflare.com/ips/ (IPv4 and IPv6) and keep them up to date:
# set_real_ip_from 173.245.48.0/20;
# ... one line per range ...
# real_ip_header CF-Connecting-IP;
