# /etc/nginx/snippets/finalwisp-proxy.conf: included by every generated
# finalwisp location (scripts/wisp-nginx.ts). Copy it there and see
# finalwisp/nginx/finalwisp-http.conf for the Origin check map.
if ($finalwisp_origin_bad) {
    return 403;
}
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
# the visitor's address ($remote_addr is the visitor once the Cloudflare
# real-IP block in finalwisp-http.conf is in place)
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For "";
proxy_buffering off;
# finalwisp never closes an idle connection; nginx would after 60 s by default
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
